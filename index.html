<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chasing Excellence Scorecards</title>
<meta name="description" content="Recurring self-assessment across the areas that make a whole life.">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0D1620">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Scorecards">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400;12..96,75..100,600;12..96,75..100,800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Ported from life-balance-scorecard-prototype.html. Palette is spec section 2. */
:root{--ink:#0D1620;--slate:#16212D;--raise:#1E2B39;--line:#293949;--bone:#E8EDF2;--muted:#8494A3;--accent:#4C9BE0;--alert:#E0705F;--track:#3FA88F;--gold:#E0A93F;--r:14px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--ink);color:var(--bone);font-family:'Instrument Sans',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;padding:0 0 90px}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.wrap{max-width:460px;margin:0 auto;padding:0 18px}
.top{position:sticky;top:0;z-index:20;background:rgba(13,22,32,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top-in{max-width:460px;margin:0 auto;padding:14px 18px;display:flex;align-items:center;gap:12px}
.brandmark{font-family:'Bricolage Grotesque',system-ui;font-weight:800;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.brandsub{font-size:11px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
.top-sp{flex:1}
.iconbtn{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);display:grid;place-items:center;color:var(--muted);font-size:15px}
.iconbtn:hover{color:var(--bone);border-color:var(--muted)}
.h1{font-family:'Bricolage Grotesque',system-ui;font-weight:800;font-size:30px;line-height:1.05;letter-spacing:-.02em;margin:26px 0 4px}
.sub{color:var(--muted);font-size:13.5px;margin-bottom:22px}
.eyebrow{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:600}
.card{background:var(--slate);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px;width:100%;text-align:left;display:block}
.pill{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;padding:4px 9px;border-radius:100px}
.pill.due{background:rgba(76,155,224,.14);color:var(--accent)}
.tabs{display:flex;gap:2px;background:var(--slate);border:1px solid var(--line);border-radius:11px;padding:3px;margin:18px 0 22px}
.tab{flex:1;padding:9px 2px;border-radius:8px;font-size:11.5px;font-weight:500;color:var(--muted);transition:.14s;white-space:nowrap}
.tab.on{background:var(--raise);color:var(--bone)}
.monthbar{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.monthbar .mlbl{flex:1;text-align:center;font-family:'Bricolage Grotesque',system-ui;font-weight:600;font-size:15px}
.monthbar button{width:34px;height:30px;border:1px solid var(--line);border-radius:8px;color:var(--muted)}
.monthbar button:hover:not(:disabled){color:var(--bone);border-color:var(--muted)}
.monthbar button:disabled{opacity:.3;cursor:default}
.catblock{margin-bottom:26px}
.cathead{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
.catname{font-family:'Bricolage Grotesque',system-ui;font-weight:600;font-size:16px;flex:1}
.catpct{font-family:'Bricolage Grotesque',system-ui;font-weight:800;font-size:16px;font-variant-numeric:tabular-nums}
.catmeta{font-size:11px;color:var(--muted);margin-bottom:10px}
.bar{height:3px;background:var(--line);border-radius:2px;overflow:hidden;margin-bottom:12px}
.bar span{display:block;height:100%;background:var(--accent);transition:width .35s cubic-bezier(.4,0,.2,1)}
.item{display:flex;align-items:flex-start;gap:11px;padding:10px 12px;border-radius:10px;width:100%;text-align:left;transition:background .14s}
.item:hover{background:var(--slate)}
.item.na{opacity:.5;cursor:default}.item.na:hover{background:none}
.box{width:19px;height:19px;flex:none;margin-top:1px;border:1.5px solid var(--line);border-radius:5px;display:grid;place-items:center;font-size:11px;color:var(--ink);transition:.14s}
.item.on .box{background:var(--accent);border-color:var(--accent)}
.item.na .box{border-style:dashed}
.ilabel{font-size:14px;line-height:1.35;flex:1}
.item.on .ilabel{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.freq{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);padding:2px 6px;border-radius:5px;flex:none;margin-top:1px}
.wheelwrap{background:var(--slate);border:1px solid var(--line);border-radius:var(--r);padding:20px 12px 12px;margin-bottom:16px}
.scoreline{text-align:center;margin-bottom:6px}
.scoreline .n{font-family:'Bricolage Grotesque',system-ui;font-weight:800;font-size:56px;line-height:1;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.scoreline .d{font-size:13px;color:var(--muted);margin-top:2px}
.scoreline .c{font-size:12px;color:var(--accent);margin-top:5px;font-variant-numeric:tabular-nums}
.legend{display:flex;justify-content:center;gap:16px;font-size:11px;color:var(--muted);margin-top:4px}
.legend i{display:inline-block;width:14px;height:2px;vertical-align:middle;margin-right:5px}
.catlist{background:var(--slate);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.catrow{display:flex;align-items:center;gap:11px;padding:12px 15px;border-bottom:1px solid var(--line)}
.catrow:last-child{border-bottom:none}
.catrow .nm{flex:1;font-size:14px}
.catrow .ct{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;width:42px;text-align:right}
.catrow .tr{width:52px;height:3px;background:var(--line);border-radius:2px;overflow:hidden}
.catrow .tr span{display:block;height:100%;background:var(--accent)}
.catrow .vl{font-family:'Bricolage Grotesque',system-ui;font-weight:800;font-size:15px;width:34px;text-align:right;font-variant-numeric:tabular-nums}
.low .vl{color:var(--alert)}.low .tr span{background:var(--alert)}
.histcard{background:var(--slate);border:1px solid var(--line);border-radius:var(--r);padding:18px 16px;margin-bottom:14px}
.hrow{display:flex;align-items:center;gap:12px;padding:9px 0}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mcard{background:var(--slate);border:1px solid var(--line);border-radius:12px;padding:12px 8px 8px;text-align:center}
.mcard.cur{border-color:rgba(76,155,224,.45)}
.mcard .mn{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.mcard .ms{font-family:'Bricolage Grotesque',system-ui;font-weight:800;font-size:24px;line-height:1;margin-top:3px;font-variant-numeric:tabular-nums}
.mcard .mc{font-size:10.5px;color:var(--muted);margin-bottom:4px;font-variant-numeric:tabular-nums}
.selrow{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:10px;background:var(--ink)}
.selrow:hover{background:var(--slate)}
.tog{width:36px;height:21px;border-radius:100px;background:var(--line);flex:none;position:relative;transition:.18s;cursor:pointer}
.tog::after{content:'';position:absolute;top:3px;left:3px;width:15px;height:15px;border-radius:50%;background:var(--muted);transition:.18s}
.selrow.on .tog{background:rgba(76,155,224,.3)}
.selrow.on .tog::after{transform:translateX(15px);background:var(--accent)}
.grip{flex:none;width:22px;text-align:center;color:var(--muted);font-size:18px;line-height:1;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.mv{flex:none;display:flex;flex-direction:column;gap:2px}
.mv button{width:24px;height:12px;border:1px solid var(--line);border-radius:4px;color:var(--muted);font-size:7px;line-height:1;display:grid;place-items:center;padding:0}
.mv button:disabled{opacity:.3}
.selrow.dragging{opacity:.7;background:var(--raise);outline:1px solid var(--accent)}
.gtog{width:32px;height:21px;border-radius:100px;background:var(--line);flex:none;position:relative;transition:.18s;cursor:pointer}
.gtog::after{content:'';position:absolute;top:3px;left:3px;width:15px;height:15px;border-radius:50%;background:var(--muted);transition:.18s}
.gtog.on{background:rgba(224,178,76,.3)}
.gtog.on::after{transform:translateX(13px);background:var(--gold)}
.fsel{background:var(--ink);border:1px solid var(--line);border-radius:7px;color:var(--muted);font:inherit;font-size:10.5px;padding:4px 3px;flex:none;width:88px;cursor:pointer}
.selrow.on .fsel{color:var(--bone)}
.trkbtn{flex:none;width:28px;height:25px;border:1px solid var(--line);border-radius:7px;font-size:11px;color:var(--muted);display:grid;place-items:center}
.addwrap{display:flex;gap:7px;margin:10px 0 4px}
.addwrap input{flex:1;background:var(--ink);border:1px solid var(--line);border-radius:9px;padding:10px 11px;color:var(--bone);font:inherit;font-size:13.5px;min-width:0}
.addwrap select{flex:none;width:96px;background:var(--ink);border:1px solid var(--line);border-radius:9px;color:var(--bone);font:inherit;font-size:12.5px;padding:0 5px}
.addwrap button{background:var(--accent);color:var(--ink);font-weight:600;padding:0 14px;border-radius:9px;font-size:13.5px}
.custom-tag{font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);border:1px solid rgba(76,155,224,.35);padding:2px 5px;border-radius:4px;margin-left:6px}
.note{background:rgba(76,155,224,.07);border:1px solid rgba(76,155,224,.22);border-radius:11px;padding:13px 15px;font-size:12.5px;color:var(--muted);line-height:1.5;margin-bottom:18px}
.note b{color:var(--accent);font-weight:600}
.empty{text-align:center;color:var(--muted);font-size:13.5px;padding:30px 20px;line-height:1.6}
.seg{display:flex;gap:7px;margin-top:12px}
.seg button{flex:1;padding:11px 4px;border-radius:9px;font-size:13px;font-weight:500;color:var(--muted);background:#0A1119;border:1px solid var(--line);transition:.14s}
.seg button:hover{color:var(--bone);border-color:#3B5068}
.seg button.on{background:rgba(76,155,224,.16);border-color:var(--accent);color:var(--accent);font-weight:600}
.seglbl{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-top:22px}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.stat{background:var(--slate);border:1px solid var(--line);border-radius:12px;padding:13px 14px}
.stat .sl{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:6px}
.stat .sv{font-family:'Bricolage Grotesque',system-ui;font-weight:800;font-size:24px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat .sm{display:block;font-family:'Instrument Sans',system-ui;font-weight:400;font-size:11px;color:var(--muted);margin-top:3px}
.ctrend{background:var(--slate);border:1px solid var(--line);border-radius:12px;padding:14px 14px 11px;margin-bottom:10px}
.cth{display:flex;align-items:baseline;gap:10px;margin-bottom:2px}
.ctn{font-family:'Bricolage Grotesque',system-ui;font-weight:600;font-size:15px;flex:1}
.ctd{font-size:11.5px;color:var(--muted)}
.ctv{font-family:'Bricolage Grotesque',system-ui;font-weight:800;font-size:19px;font-variant-numeric:tabular-nums}
.ctc{margin:2px -4px 0}
.ctvals{display:flex;justify-content:space-between;gap:2px;margin-top:2px}
.ctvals span{flex:1;text-align:center;font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.ctvals span b{display:block;font-size:9px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;opacity:.7;margin-bottom:1px}
.ctvals span.now{color:var(--bone)}
.ctfoot{font-size:11px;color:var(--muted);margin-top:9px;padding-top:9px;border-top:1px solid var(--line)}
.pickrow{display:flex;gap:7px;margin:-2px 0 10px}
.pick{font-size:11.5px;color:var(--muted);border:1px solid var(--line);border-radius:7px;padding:5px 11px;background:#0A1119;transition:.14s}
.pick:hover:not(:disabled){color:var(--accent);border-color:var(--accent)}
.pick:disabled{opacity:.32;cursor:default}
.resetbtn{width:100%;margin-top:14px;padding:13px;border:1px solid var(--line);border-radius:11px;color:var(--muted);font-size:13px;background:#0A1119;transition:.14s}
.resetbtn:hover{color:var(--alert);border-color:var(--alert)}
.renameinp{flex:1;background:#0A1119;border:1px solid var(--accent);border-radius:8px;padding:8px 10px;color:var(--bone);font:inherit;font-size:14px;min-width:0}
.bigbtn{width:100%;padding:15px;border-radius:11px;background:var(--accent);color:var(--ink);font-weight:600;font-size:15px}
.bigbtn:disabled{opacity:.55;cursor:default}
#saving{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;z-index:60;background:var(--raise);border:1px solid var(--line);border-radius:100px;padding:8px 16px;font-size:12px;color:var(--muted);display:none}
#saving.err{color:var(--alert);border-color:var(--alert)}
.login{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:20px;background:var(--ink);z-index:50}
.login .box{width:100%;max-width:380px;background:var(--slate);border:1px solid var(--line);border-radius:16px;padding:28px}
.login h1{font-family:'Bricolage Grotesque',system-ui;font-weight:800;font-size:20px;letter-spacing:-.01em}
.login .brand{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.login .dot{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--track));flex:0 0 auto}
.login p{margin:0 0 20px;color:var(--muted);font-size:13px}
label{display:block;font-size:12px;color:var(--muted);margin:0 0 6px}
.login input{width:100%;padding:11px 12px;background:var(--ink);color:var(--bone);border:1px solid var(--line);border-radius:10px;font-size:16px;font-family:inherit}
.login input:focus{outline:none;border-color:var(--accent)}
#emailWrap,#passWrap,#pass2Wrap{margin-bottom:14px}
.btn{padding:11px 16px;border-radius:10px;border:1px solid var(--line);background:var(--slate);color:var(--bone);font-size:14px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--ink);font-weight:600}
.btn:disabled{opacity:.6;cursor:default}
.err{color:var(--alert);font-size:13px;margin-top:10px;min-height:18px}
.ok{color:var(--track);font-size:13px;margin-top:10px;min-height:18px}
.authlinks{display:flex;justify-content:space-between;margin-top:16px;font-size:13px}
.authlinks a{color:var(--accent);text-decoration:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<!-- ================= LOGIN GATE ================= -->
<div class="login" id="loginGate">
  <div class="box">
    <div class="brand"><span class="dot"></span><h1>Scorecards</h1></div>
    <p id="authSub">Sign in to track your scorecards across every device.</p>
    <div id="emailWrap"><label>Email</label>
      <input id="loginEmail" type="email" autocomplete="username" placeholder="you@example.com"></div>
    <div id="passWrap"><label id="passLabel">Password</label>
      <input id="loginPass" type="password" autocomplete="current-password" placeholder="••••••••"></div>
    <div id="pass2Wrap" style="display:none"><label id="pass2Label">Confirm password</label>
      <input id="loginPass2" type="password" autocomplete="new-password" placeholder="••••••••"></div>
    <button class="btn pri" id="loginBtn" style="width:100%;margin-top:20px">Sign in</button>
    <div class="err" id="loginErr"></div>
    <div class="ok" id="loginOk"></div>
    <div class="authlinks">
      <a href="#" id="forgotLink">Forgot password?</a>
      <a href="#" id="modeLink">Create account</a>
    </div>
    <p style="font-size:11px;color:var(--muted);margin:18px 0 0">
      Same account as Daily Time Tracker. Different site, so you sign in once here too.</p>
  </div>
</div>

<!-- ================= APP ================= -->
<div id="appRoot" style="display:none">
  <div class="top"><div class="top-in">
    <a href="/" id="homeLink" title="All scorecards" style="text-decoration:none;color:inherit;display:block"><div class="brandmark">Chasing Excellence</div><div class="brandsub">Scorecards</div></a>
    <div class="top-sp"></div>
    <button class="iconbtn" id="signOutBtn" title="Sign out">&#9211;</button>
  </div></div>
  <div class="wrap" id="app"></div>
</div>
<div id="saving"></div>

<!-- supabase-js, inlined verbatim from the Daily Time Tracker so the app has
     no CDN dependency. Same library, same version. -->

   across. "One login" means one Supabase account, not single sign-on. */
const SB=window.supabase.createClient(SUPA_URL,SUPA_KEY,{
  auth:{persistSession:true,autoRefreshToken:true,storageKey:"ces-auth"}
});

const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ===================================================================
   AUTH - forked from the time tracker: same four modes, same recovery
   handling.
   =================================================================== */
let authMode="signin";
const AUTH_UI={
  signin :{sub:"Sign in to track your scorecards across every device.",btn:"Sign in",         passLabel:"Password",    email:true, pass:true, pass2:false,forgot:"Forgot password?",mode:"Create account"},
  signup :{sub:"Create an account to start your first scorecard.",     btn:"Create account",  passLabel:"Password",    email:true, pass:true, pass2:true, forgot:"",                mode:"Back to sign in"},
  reset  :{sub:"Enter your email and we will send you a reset link.",  btn:"Send reset link", passLabel:"Password",    email:true, pass:false,pass2:false,forgot:"",                mode:"Back to sign in"},
  newpass:{sub:"Choose a new password for your account.",              btn:"Update password", passLabel:"New password",email:false,pass:true, pass2:true, forgot:"",                mode:""}
};
function setAuthMode(m){
  authMode=m; const u=AUTH_UI[m]; if(!u) return;
  const show=(id,on)=>{const el=$(id); if(el) el.style.display=on?"":"none";};
  $("authSub").textContent=u.sub; $("loginBtn").textContent=u.btn; $("loginBtn").disabled=false;
  $("passLabel").textContent=u.passLabel;
  show("emailWrap",u.email); show("passWrap",u.pass); show("pass2Wrap",u.pass2);
  const fl=$("forgotLink"); fl.textContent=u.forgot; show("forgotLink",!!u.forgot);
  const ml=$("modeLink");   ml.textContent=u.mode;   show("modeLink",!!u.mode);
  $("loginErr").textContent=""; $("loginOk").textContent="";
  $("loginPass").setAttribute("autocomplete",m==="signin"?"current-password":"new-password");
  if(!u.pass)  $("loginPass").value="";
  if(!u.pass2) $("loginPass2").value="";
}
async function doAuth(){
  const btn=$("loginBtn"), err=$("loginErr"), ok=$("loginOk");
  const email=$("loginEmail").value.trim(), pass=$("loginPass").value, pass2=$("loginPass2").value;
  const restore=AUTH_UI[authMode].btn;
  err.textContent=""; ok.textContent="";
  const fail=m=>{err.textContent=m; btn.textContent=restore; btn.disabled=false;};
  if(btn.disabled) return;
  btn.disabled=true;
  try{
    if(authMode==="signin"){
      if(!email||!pass) return fail("Enter your email and password.");
      btn.textContent="Signing in...";
      const {data,error}=await SB.auth.signInWithPassword({email,password:pass});
      if(error) return fail(error.message);
      await enterAppSafe(data.user.email); return;
    }
    if(authMode==="signup"){
      if(!email) return fail("Enter your email.");
      if(pass.length<6) return fail("Password must be at least 6 characters.");
      if(pass!==pass2) return fail("Those passwords do not match.");
      btn.textContent="Creating account...";
      const {data,error}=await SB.auth.signUp({email,password:pass,options:{emailRedirectTo:location.origin}});
      if(error) return fail(error.message);
      if(data&&data.session){ await enterAppSafe(data.user.email); return; }
      ok.textContent="Account created. Check "+email+" for a confirmation link, then sign in.";
      btn.textContent=restore; btn.disabled=false; return;
    }
    if(authMode==="reset"){
      if(!email) return fail("Enter your email.");
      btn.textContent="Sending...";
      const {error}=await SB.auth.resetPasswordForEmail(email,{redirectTo:location.origin});
      if(error) return fail(error.message);
      ok.textContent="If an account exists for "+email+", a reset link is on its way.";
      btn.textContent=restore; btn.disabled=false; return;
    }
    if(authMode==="newpass"){
      if(pass.length<6) return fail("Password must be at least 6 characters.");
      if(pass!==pass2) return fail("Those passwords do not match.");
      btn.textContent="Updating...";
      const {error}=await SB.auth.updateUser({password:pass});
      if(error) return fail(error.message);
      history.replaceState(null,"",location.pathname+location.search);
      const {data}=await SB.auth.getSession();
      if(data&&data.session){ await enterAppSafe(data.session.user.email); return; }
      ok.textContent="Password updated. Sign in with your new password.";
      btn.disabled=false; setTimeout(()=>setAuthMode("signin"),1400); return;
    }
  }catch(ex){ return fail((ex&&ex.message)||"Something went wrong. Please try again."); }
}
$("loginBtn").addEventListener("click",doAuth);
["loginEmail","loginPass","loginPass2"].forEach(id=>{
  $(id).addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();doAuth();}});
});
$("forgotLink").addEventListener("click",e=>{e.preventDefault();setAuthMode("reset");});
$("modeLink").addEventListener("click",e=>{e.preventDefault();setAuthMode(authMode==="signin"?"signup":"signin");});
$("homeLink").addEventListener("click",e=>{e.preventDefault(); if(typeof goHome==="function"&&S.profile) goHome();});
$("signOutBtn").addEventListener("click",async()=>{ await SB.auth.signOut(); location.reload(); });

/* ===================================================================
   CONSTANTS - the prototype's short frequency codes map to the enum in
   the database. Everything in memory uses the short code, as the
   prototype does; only the wire format uses the long one.
   =================================================================== */
const FREQ={d:'Daily',w:'Weekly',m:'Monthly',q:'Quarterly',s:'6-Month',a:'Annual'};
const FO={d:0,w:1,m:2,q:3,s:4,a:5};
const F2DB={d:'daily',w:'weekly',m:'monthly',q:'quarterly',s:'semiannual',a:'annual'};
const DB2F={daily:'d',weekly:'w',monthly:'m',quarterly:'q',semiannual:'s',annual:'a'};
const PERIOD={q:3,s:6,a:12};
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

const now=new Date();
const NOW={y:now.getFullYear(),m:now.getMonth()};          /* m is 0-based */
const pkey=(y,m)=>y+'-'+String(m+1).padStart(2,'0')+'-01'; /* sc_entries.period_start */
/* Scores are shown as a percentage on weekly scorecards, and as 0-10 on monthly ones (Life Balance). */
const ten=p=>p===null?'—':(isWeekly()?Math.round(p*100)+'%':(p*10).toFixed(1));
/* Change in a score, given in tenths (0-10 units): "+1.2", or "+12 pts" on weekly cards. */
const dfmt=d=>isWeekly()?Math.round(d*10)+' pts':d.toFixed(1);

const S={
  profile:null, isAdmin:false, templates:[], allCats:[], allLib:[], cards:[],
  template:null, cats:[], library:[],
  card:null, items:[], entries:{}, credit:{}, keepShown:{}, onlyUsing:true,          /* entries: "itemId|period" -> bool */
  tab:'checkin', view:{y:NOW.y,m:NOW.m}, wk:null,
  sortMode:'freq', editing:null, busy:false
};

/* ===================================================================
   DUE CYCLES - generalised from the prototype.

   The prototype hardcoded the closing months (quarterly Mar/Jun/Sep/Dec,
   semiannual Jun/Dec, annual Dec), which is the December pile-up spec
   section 4 says to avoid. Here each long-cycle item carries its own
   target_month and the rule falls out of it. With target_month = 12 this
   is byte-for-byte the prototype's behaviour.
   =================================================================== */
function isDue(freq,month0,targetMonth){
  if(freq==='d'||freq==='w'||freq==='m') return true;
  const p=PERIOD[freq]; if(!p) return true;
  const t=(targetMonth||12)-1;
  return ((month0-t)%p+p)%p===0;
}
/* Spread long-cycle items across the year instead of stacking them in
   December. Deterministic: same list in, same months out. */
function spreadTargetMonth(freq,idx){
  const p=PERIOD[freq]; if(!p) return null;
  return (idx%p)+1;
}

/* Checklist text: your rename, else the template's short label, else the full question. */
const label=i=>i.renamed_label||i.custom_label||i.lib_short||i.lib_label||'Untitled';
const fullQ=i=>(i.lib_label&&i.lib_label!==label(i))?i.lib_label:'';
const liveItems=()=>S.items.filter(i=>!i.removed_at);
function catItems(catId){
  const list=liveItems().filter(i=>i.category_id===catId);
  const az=(a,b)=>label(a).localeCompare(label(b));
  if(S.sortMode==='az')     return list.slice().sort(az);
  if(S.sortMode==='manual') return list.slice().sort((a,b)=>a.sort_order-b.sort_order||az(a,b));
  return list.slice().sort((a,b)=>FO[a.freq]-FO[b.freq]||az(a,b));
}
/* An entry is true (yes), false/missing (no) or 'na' (not applicable).
   N/A is stored as a row with value_bool null and is left out of the score. */
/* ===================================================================
   PERIODS. Monthly templates (Life Balance) score one month at a time.
   A weekly template (check_in_period = 'weekly') scores one Monday-to-Sunday
   week at a time. Its daily/weekly items are the score. Monthly, quarterly,
   6-month and yearly items sit in their own optional section: they are
   ticked against their own period, any time during it, and in the first-
   Friday week of a period the app asks about the one that just ended.
   =================================================================== */
const isWeekly=()=>!!(S.template&&S.template.check_in_period==='weekly');
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const addDays=(d,n)=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()+n);return x;};
const mondayOf=d=>addDays(d,-((d.getDay()+6)%7));
const shortDate=d=>MON[d.getMonth()]+' '+d.getDate();
const isShortCycle=i=>i.freq==='d'||i.freq==='w';
const CYC={m:1,q:3,s:6,a:12};
/* ISO week of the year (weeks start Monday; week 1 holds the year's first Thursday). */
function isoWeek(mon){
  const thu=addDays(mon,3);
  const doy=Math.round((new Date(thu.getFullYear(),thu.getMonth(),thu.getDate())-new Date(thu.getFullYear(),0,1))/86400000)+1;
  return Math.floor((doy-1)/7)+1;
}
function mkPWeek(mon){
  const fri=addDays(mon,4), wn=isoWeek(mon);
  return {weekly:true,key:ymd(mon),mon:mon,fri:fri,y:fri.getFullYear(),m:fri.getMonth(),week:wn,
          label:'W'+wn+': '+shortDate(mon)+' – '+shortDate(addDays(mon,6)),short:'W'+wn};
}
function mkPMonth(y,m){ return {weekly:false,key:pkey(y,m),y:y,m:m,label:MON[m]+' '+y,short:MON[m]}; }
const viewP=()=>isWeekly()?mkPWeek(S.wk||mondayOf(new Date())):mkPMonth(S.view.y,S.view.m);
/* First day of the month/quarter/half/year that contains the Friday, `back` periods earlier. */
function cycleStart(freq,fri,back){
  const p=CYC[freq];
  return new Date(fri.getFullYear(),fri.getMonth()-fri.getMonth()%p-back*p,1);
}
const cycleKey=(freq,fri,back)=>{const d=cycleStart(freq,fri,back);return pkey(d.getFullYear(),d.getMonth());};
function cycleName(freq,d){
  const y=d.getFullYear(), m=d.getMonth();
  return freq==='m'?MON[m]+' '+y : freq==='q'?'Q'+(Math.floor(m/3)+1)+' '+y
       : freq==='s'?(m<6?'1st':'2nd')+' half of '+y : ''+y;
}
/* The entry key an item is answered under, for the period being viewed. */
const ekey=(i,P)=>(!P.weekly||isShortCycle(i))?P.key:cycleKey(i.freq,P.fri,0);
const isDone=(i,P)=>S.entries[i.id+'|'+ekey(i,P)]===true;
const isNA=(i,P)=>S.entries[i.id+'|'+ekey(i,P)]==='na';
/* Does this item count toward the score of period P? */
const scored=(i,P)=>P.weekly?isShortCycle(i):isDue(i.freq,P.m,i.target_month);
const catTitle=c=>isWeekly()?String.fromCharCode(65+S.cats.indexOf(c))+'. '+c.name:c.name;

/* ===================================================================
   SCORING - ported unchanged from the prototype.
     category_score = completed_and_due / selected_and_due
     overall        = mean of live category scores (equal weight)
     empty categories are excluded, not zeroed
   =================================================================== */
/* Weekly cards: how the optional monthly/quarterly/6-month/yearly items touch
   this week's score. A "yes" counts once, in the week it was ticked (+1 done,
   +1 due). An item that is officially due this week, meaning the first-Friday
   week that closes its period, counts as due if it was not answered yes (or
   N/A). Anything else is left out, so an item that is not due yet costs nothing. */
function longAdjust(P){
  const out={};
  const add=(cid,d,u)=>{const o=out[cid]||(out[cid]={done:0,due:0});o.done+=d;o.due+=u;};
  const byId={};
  liveItems().forEach(i=>{ if(i.is_selected&&!isShortCycle(i)) byId[i.id]=i; });
  Object.keys(S.credit).forEach(k=>{
    if(S.credit[k]!==P.key||S.entries[k]!==true) return;
    const it=byId[k.split('|')[0]]; if(it) add(it.category_id,1,1);
  });
  const startD=S.card?new Date(S.card.started_at+"T00:00:00"):P.fri;
  Object.keys(byId).forEach(id=>{
    const it=byId[id], p=CYC[it.freq];
    if(!p||!(P.fri.getDate()<=7&&P.fri.getMonth()%p===0)) return;
    /* Do not penalise for a period that ended before the card was started. */
    if(cycleStart(it.freq,P.fri,1)<cycleStart(it.freq,startD,0)) return;
    const v=S.entries[id+'|'+cycleKey(it.freq,P.fri,1)];
    if(v!==true&&v!=='na') add(it.category_id,0,1);
  });
  return out;
}
function score(P){
  const cats=[], adj=P.weekly?longAdjust(P):{};
  S.cats.forEach(c=>{
    const all=catItems(c.id).filter(i=>!P.weekly||isShortCycle(i)), mine=all.filter(i=>i.is_selected);
    const dueItems=mine.filter(i=>scored(i,P)&&!isNA(i,P));
    const a=adj[c.id]||{done:0,due:0};
    const hit=dueItems.filter(i=>isDone(i,P)).length+a.done, due=dueItems.length+a.due;
    cats.push({id:c.id,name:c.name,pct:due?hit/due:null,
               done:hit,due:due,sel:mine.length,total:all.length});
  });
  const live=cats.filter(c=>c.pct!==null);
  return {cats,
    overall:live.length?live.reduce((a,c)=>a+c.pct,0)/live.length:null,
    tDone:cats.reduce((a,c)=>a+c.done,0),
    tDue :cats.reduce((a,c)=>a+c.due,0)};
}

/* ===================================================================
   CHARTS - ported unchanged from the prototype.
   =================================================================== */
function radar(cats,size,lbl){
  const live=cats.filter(c=>c.pct!==null);
  if(live.length<3) return '<div class="empty">Select items in at least three categories to draw your shape.</div>';
  const cx=size/2,cy=size/2,R=size/2-(lbl?46:6),n=live.length;
  const ang=i=>(Math.PI*2*i/n)-Math.PI/2, pt=(i,r)=>[cx+Math.cos(ang(i))*R*r,cy+Math.sin(ang(i))*R*r];
  let g=''; [.25,.5,.75].forEach(r=>g+='<circle cx="'+cx+'" cy="'+cy+'" r="'+(R*r)+'" fill="none" stroke="#293949"/>');
  g+='<circle cx="'+cx+'" cy="'+cy+'" r="'+R+'" fill="none" stroke="#3B5068" stroke-width="1.5" stroke-dasharray="3 4"/>';
  live.forEach((c,i)=>{const p=pt(i,1);g+='<line x1="'+cx+'" y1="'+cy+'" x2="'+p[0]+'" y2="'+p[1]+'" stroke="#293949"/>';});
  g+='<polygon points="'+live.map((c,i)=>pt(i,Math.max(c.pct,.02)).join(',')).join(' ')+'" fill="rgba(76,155,224,.22)" stroke="#4C9BE0" stroke-width="'+(lbl?2:1.5)+'" stroke-linejoin="round"/>';
  live.forEach((c,i)=>{const p=pt(i,Math.max(c.pct,.02));
    g+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="'+(lbl?3.5:2)+'" fill="'+(c.pct<.5?'#E0705F':'#4C9BE0')+'"/>';
    if(!lbl)return;
    const l=pt(i,1.32), anc=Math.abs(l[0]-cx)<8?'middle':(l[0]>cx?'start':'end');
    g+='<text x="'+l[0]+'" y="'+(l[1]-5)+'" text-anchor="'+anc+'" fill="#8494A3" font-size="10.5" font-weight="500">'+esc(c.name.replace('Family: ',''))+'</text>';
    g+='<text x="'+l[0]+'" y="'+(l[1]+8)+'" text-anchor="'+anc+'" fill="'+(c.pct<.5?'#E0705F':'#E8EDF2')+'" font-size="11.5" font-weight="800">'+ten(c.pct)+'</text>';
    g+='<text x="'+l[0]+'" y="'+(l[1]+20)+'" text-anchor="'+anc+'" fill="#8494A3" font-size="9.5">'+c.done+' of '+c.due+'</text>';});
  /* Labelled radars put their text at 1.32R, which runs past a "0 0 size size"
     viewBox and clips "Wealth" and "Family" at the left and right edges. Pad
     the box horizontally rather than pulling the labels inward, so the wheel
     keeps the prototype's proportions. */
  const pad=lbl?52:0, padY=lbl?14:0;
  return '<svg viewBox="'+(-pad)+' '+(-padY)+' '+(size+pad*2)+' '+(size+padY*2)+'" width="100%" style="max-width:'+(size+pad*2)+'px;display:block;margin:0 auto">'+g+'</svg>';
}
function lineChart(series,w,h,col,showLbl,labels){
  const n=series.length,P=6,B=showLbl?16:6,Tp=showLbl?14:6;
  const xs=i=>P+i*(w-2*P)/Math.max(1,n-1), ys=v=>(h-B)-v*(h-B-Tp);
  const pts=series.map((v,i)=>v===null?null:[xs(i),ys(v)]).filter(Boolean);
  let g='';
  [0,.5,1].forEach(r=>{const y=ys(r);g+='<line x1="'+P+'" y1="'+y+'" x2="'+(w-P)+'" y2="'+y+'" stroke="#293949" stroke-width="1" '+(r===0?'':'stroke-dasharray="2 4"')+'/>';});
  if(pts.length>1){
    const line=pts.map(p=>p.join(',')).join(' ');
    g+='<polygon points="'+xs(0)+','+(h-B)+' '+line+' '+xs(n-1)+','+(h-B)+'" fill="'+col+'" opacity=".13"/>';
    g+='<polyline points="'+line+'" fill="none" stroke="'+col+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
  }
  pts.forEach((p,i)=>{g+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="'+(i===pts.length-1?3.4:2.2)+'" fill="'+col+'"/>';});
  if(showLbl){
    series.forEach((v,i)=>{ if(v===null)return;
      g+='<text x="'+xs(i)+'" y="'+(ys(v)-7)+'" text-anchor="middle" fill="#E8EDF2" font-size="9.5" font-weight="800">'+ten(v)+'</text>';
      g+='<text x="'+xs(i)+'" y="'+(h-4)+'" text-anchor="middle" fill="#8494A3" font-size="9">'+esc(labels[i])+'</text>';});
  }
  return '<svg viewBox="0 0 '+w+' '+h+'" width="100%" style="display:block">'+g+'</svg>';
}

/* ===================================================================
   PERSISTENCE - online only. Optimistic in memory, written straight
   through to Supabase. No IndexedDB mirror: unlike time tracking, a
   monthly check-in is not something you do on a plane, and the tracker's
   sync engine brings a class of bugs (deletes not propagating) this app
   does not need to inherit.
   =================================================================== */
let saveTimer=null;
function saving(state,msg){
  const el=$("saving");
  clearTimeout(saveTimer);
  if(state==='off'){ el.style.display='none'; return; }
  el.className = state==='err' ? 'err' : '';
  el.textContent = msg || (state==='err' ? 'Could not save' : 'Saving...');
  el.style.display='block';
  saveTimer=setTimeout(()=>{el.style.display='none';}, state==='err'?6000:900);
}
async function run(promise){
  saving('on');
  const {data,error}=await promise;
  if(error){ console.error(error); saving('err','Could not save - '+error.message); throw error; }
  saving('on','Saved');
  return data;
}

async function loadAll(){
  const tz=(Intl.DateTimeFormat().resolvedOptions()||{}).timeZone||"America/Chicago";
  const {data:prof,error:pe}=await SB.rpc("sc_bootstrap_profile",{p_timezone:tz});
  if(pe) throw pe;
  S.profile=Array.isArray(prof)?prof[0]:prof;
  /* Admins (sql/08) can promote their own questions into the shared template. */
  try{ const {data:adm,error:ae}=await SB.rpc("sc_is_admin"); S.isAdmin=!ae&&adm===true; }catch(e){ S.isAdmin=false; }

  const r=await Promise.all([
    SB.from("sc_templates").select("*").eq("is_published",true).order("sort_order"),
    SB.from("sc_categories").select("*").order("sort_order"),
    SB.from("sc_library_items").select("*").eq("is_active",true).order("sort_order"),
    SB.from("sc_user_scorecards").select("*").eq("is_active",true).order("created_at")
  ]);
  r.forEach(x=>{ if(x.error) throw x.error; });
  S.templates=r[0].data||[];
  if(!S.templates.length) throw new Error("No scorecard templates found. Has the seed been run?");
  S.allCats=r[1].data||[]; S.allLib=r[2].data||[]; S.cards=r[3].data||[];
  /* One template: go straight in. Several: show the home screen. */
  if(S.templates.length===1) await openTemplate(S.templates[0].id);
}

/* Point the working state (S.template/cats/library/card/items) at one template. */
async function openTemplate(id){
  S.template=S.templates.find(t=>t.id===id);
  S.cats=S.allCats.filter(c=>c.template_id===id);
  const catIds={}; S.cats.forEach(c=>catIds[c.id]=1);
  S.library=S.allLib.filter(i=>catIds[i.category_id]);
  S.card=S.cards.find(c=>c.template_id===id)||null;
  S.items=[]; S.entries={}; S.credit={};
  S.tab='checkin'; S.view={y:NOW.y,m:NOW.m}; S.wk=mondayOf(new Date()); S.sortMode=defSort(); S.editing=null;
  if(S.card){
    await loadCard();
    const used={}; S.library.forEach(l=>used[l.category_id]=1); liveItems().forEach(i=>used[i.category_id]=1);
    S.cats=S.cats.filter(c=>used[c.id]);
  }
}
async function goTemplate(id){
  $("app").innerHTML='<div class="empty">Loading...</div>';
  try{ await openTemplate(id); }catch(e){ console.error(e); saving('err','Could not load - '+e.message); }
  render();
}
function goHome(){ S.template=null; S.card=null; render(); }

async function loadCard(synced){
  const r=await Promise.all([
    SB.from("sc_user_scorecard_items").select("*").eq("user_scorecard_id",S.card.id),
    SB.from("sc_entries").select("user_scorecard_item_id,period_start,value_bool,credit_week").eq("user_scorecard_id",S.card.id)
  ]);
  r.forEach(x=>{ if(x.error) throw x.error; });
  const libById={}; S.library.forEach(l=>libById[l.id]=l);
  const rows=r[0].data||[];

  /* Template questions added after this card was started (or that the card
     never received) are added now, so edits to a template reach existing
     users. Questions the template has retired drop out of the card below. */
  if(!synced){
    const have={}; rows.forEach(x=>{ if(x.library_item_id) have[x.library_item_id]=1; });
    const missing=S.library.filter(l=>!have[l.id]);
    if(missing.length){
      const counters={q:0,s:0,a:0};
      const add=missing.sort((a,b)=>a.sort_order-b.sort_order).map(l=>{
        const f=DB2F[l.default_frequency]||'m';
        let tm=l.default_target_month;
        if(!tm&&PERIOD[f]) tm=spreadTargetMonth(f,counters[f]++);
        return {user_scorecard_id:S.card.id, library_item_id:l.id, category_id:l.category_id,
          frequency:l.default_frequency, target_month:tm||null, target_value:l.default_target_value,
          is_selected:!!l.is_default_on, sort_order:l.sort_order};
      });
      for(let i=0;i<add.length;i+=100){
        const {error}=await SB.from("sc_user_scorecard_items").insert(add.slice(i,i+100));
        if(error) throw error;
      }
      return loadCard(true);
    }
  }

  S.items=rows.filter(x=>!x.library_item_id||libById[x.library_item_id]).map(x=>({
    id:x.id, category_id:x.category_id, library_item_id:x.library_item_id,
    custom_label:x.custom_label, renamed_label:x.renamed_label,
    lib_label:(x.library_item_id&&libById[x.library_item_id])?libById[x.library_item_id].label:null,
    lib_short:(x.library_item_id&&libById[x.library_item_id])?libById[x.library_item_id].short_label:null,
    lib_code:(x.library_item_id&&libById[x.library_item_id])?libById[x.library_item_id].code:null,
    freq:DB2F[x.frequency]||'m', target_month:x.target_month,
    is_selected:x.is_selected, sort_order:x.sort_order, removed_at:x.removed_at
  }));
  S.entries={}; S.credit={};
  (r[1].data||[]).forEach(e=>{
    const k=e.user_scorecard_item_id+'|'+e.period_start;
    S.entries[k]=(e.value_bool===null?'na':!!e.value_bool);
    if(e.credit_week) S.credit[k]=e.credit_week;
  });
}

/* Adoption: one card, one row per library item, first-run defaults on. */
async function adopt(){
  if(S.busy) return; S.busy=true;
  try{
    saving('on','Setting up...');
    const {data:card,error:ce}=await SB.from("sc_user_scorecards")
      .insert({template_id:S.template.id}).select().single();
    if(ce) throw ce;
    S.card=card; S.cards.push(card);
    const counters={q:0,s:0,a:0};
    const rows=[];
    S.cats.forEach(c=>{
      S.library.filter(l=>l.category_id===c.id)
        .sort((a,b)=>a.sort_order-b.sort_order)
        .forEach(l=>{
          const f=DB2F[l.default_frequency]||'m';
          let tm=l.default_target_month;
          if(!tm&&PERIOD[f]) tm=spreadTargetMonth(f,counters[f]++);
          rows.push({
            user_scorecard_id:card.id, library_item_id:l.id, category_id:c.id,
            frequency:l.default_frequency, target_month:tm||null,
            target_value:l.default_target_value, is_selected:!!l.is_default_on,
            sort_order:l.sort_order
          });
        });
    });
    for(let i=0;i<rows.length;i+=100){
      const {error}=await SB.from("sc_user_scorecard_items").insert(rows.slice(i,i+100));
      if(error) throw error;
    }
    await loadCard();
    saving('on','Ready'); S.tab='checkin';
  }catch(err){ console.error(err); saving('err','Setup failed - '+err.message); }
  finally{ S.busy=false; render(); }
}

async function tick(itemId,period,creditWeek){
  const it=S.items.find(i=>i.id===itemId); if(!it) return;
  const k=itemId+'|'+period;
  /* Cycle: not done -> yes -> N/A -> not done */
  const prev=S.entries[k], prevCredit=S.credit[k];
  const next=prev===true?'na':(prev==='na'?false:true);
  /* A monthly/quarterly/yearly "yes" is credited to the week it was ticked in. */
  const credit=(next===true&&creditWeek)?creditWeek:null;
  S.entries[k]=next;
  if(credit) S.credit[k]=credit; else delete S.credit[k];
  render();
  try{
    await run(SB.from("sc_entries").upsert({
      user_scorecard_id:S.card.id, user_scorecard_item_id:itemId,
      period_start:period, value_bool:(next==='na'?null:next), credit_week:credit
    },{onConflict:"user_scorecard_item_id,period_start"}));
  }catch(e){
    S.entries[k]=prev;
    if(prevCredit) S.credit[k]=prevCredit; else delete S.credit[k];
    render();
  }
}

async function patchItem(itemId,patch,localPatch){
  const it=S.items.find(i=>i.id===itemId); if(!it) return;
  const before=Object.assign({},it);
  Object.assign(it,localPatch||patch); render();
  try{ await run(SB.from("sc_user_scorecard_items").update(patch).eq("id",itemId)); }
  catch(e){ Object.assign(it,before); render(); }
}
function toggleSel(id){
  const it=S.items.find(i=>i.id===id);
  if(it.is_selected) S.keepShown[id]=1;   /* stays on screen until you leave Items, so it can be undone */
  patchItem(id,{is_selected:!it.is_selected});
}
/* "Show only what I'm using" hides switched-off items on the Items tab. Remembered in this browser. */
try{ if(localStorage.getItem('ces-only-using')==='0') S.onlyUsing=false; }catch(e){}
function setOnlyUsing(){
  S.onlyUsing=!S.onlyUsing; S.keepShown={}; S.editing=null;
  try{ localStorage.setItem('ces-only-using',S.onlyUsing?'1':'0'); }catch(e){}
  render();
}
const shownItems=catId=>{
  const all=catItems(catId);
  return S.onlyUsing?all.filter(i=>i.is_selected||S.keepShown[i.id]):all;
};
/* Delete one of the user's own added items. It is soft-deleted (entries are kept). */
async function deleteItem(id){
  const it=S.items.find(i=>i.id===id); if(!it||it.library_item_id) return;
  if(!confirm('Delete "'+label(it)+'" from your scorecard? It will no longer count toward your score.')) return;
  const before={removed_at:it.removed_at,is_selected:it.is_selected};
  it.removed_at=new Date().toISOString(); it.is_selected=false; render();
  try{
    await run(SB.from("sc_user_scorecard_items").update({removed_at:it.removed_at,is_selected:false}).eq("id",id));
  }catch(e){ Object.assign(it,before); render(); }
}
function setFreq(id,f){
  const it=S.items.find(i=>i.id===id);
  let tm=it.target_month;
  if(PERIOD[f]&&!tm) tm=spreadTargetMonth(f,liveItems().filter(x=>x.freq===f).length);
  if(!PERIOD[f]) tm=null;
  patchItem(id,{frequency:F2DB[f],target_month:tm},{freq:f,target_month:tm});
}
function saveName(id,v){
  const val=(v||'').trim(), it=S.items.find(i=>i.id===id);
  S.editing=null;
  if(it.library_item_id) patchItem(id,{renamed_label:(val&&val!==(it.lib_short||it.lib_label))?val:null});
  else if(val)           patchItem(id,{custom_label:val});
  else render();
}
async function pickAll(catId,on){
  const ids=catItems(catId).map(i=>i.id), idset={};
  ids.forEach(x=>idset[x]=1);
  const before=S.items.filter(i=>idset[i.id]).map(i=>({id:i.id,v:i.is_selected}));
  S.items.forEach(i=>{ if(idset[i.id]) i.is_selected=on; }); render();
  try{ await run(SB.from("sc_user_scorecard_items").update({is_selected:on}).in("id",ids)); }
  catch(e){ before.forEach(b=>{ S.items.find(i=>i.id===b.id).is_selected=b.v; }); render(); }
}
async function addItem(catId){
  const inp=$("ci-"+catId), sel=$("cf-"+catId);
  const text=(inp.value||'').trim(); if(!text) return;
  const f=sel.value;
  const tm=PERIOD[f]?spreadTargetMonth(f,liveItems().filter(x=>x.freq===f).length):null;
  inp.value='';
  try{
    const row=await run(SB.from("sc_user_scorecard_items").insert({
      user_scorecard_id:S.card.id, category_id:catId, custom_label:text,
      frequency:F2DB[f], target_month:tm, is_selected:true,
      sort_order:9000+liveItems().filter(i=>i.category_id===catId).length
    }).select().single());
    S.items.push({id:row.id,category_id:catId,library_item_id:null,custom_label:text,
      renamed_label:null,lib_label:null,lib_short:null,lib_code:null,freq:f,target_month:tm,is_selected:true,
      sort_order:row.sort_order,removed_at:null});
    render();
  }catch(e){}
}
async function resetCard(){
  if(!confirm("Clear every selection, rename, custom item and frequency change on this scorecard? Your check-in history stays.")) return;
  try{
    saving('on','Resetting...');
    /* Custom items are soft-deleted, never removed: their entries are part of
       past scores and those have to keep adding up. */
    const customIds=liveItems().filter(i=>!i.library_item_id).map(i=>i.id);
    if(customIds.length){
      const {error}=await SB.from("sc_user_scorecard_items")
        .update({removed_at:new Date().toISOString(),is_selected:false}).in("id",customIds);
      if(error) throw error;
    }
    for(const l of S.library){
      const it=S.items.find(i=>i.library_item_id===l.id&&!i.removed_at); if(!it) continue;
      const {error}=await SB.from("sc_user_scorecard_items").update({
        is_selected:!!l.is_default_on, renamed_label:null,
        frequency:l.default_frequency, sort_order:l.sort_order
      }).eq("id",it.id);
      if(error) throw error;
    }
    await loadCard(); S.sortMode=defSort(); S.editing=null; saving('on','Reset');
  }catch(e){ console.error(e); saving('err','Reset failed - '+e.message); }
  render();
}

/* ===================================================================
   SCREENS
   =================================================================== */
function periodBar(){
  if(isWeekly()){
    const start=mondayOf(S.card?new Date(S.card.started_at+"T00:00:00"):new Date());
    const cur=mondayOf(new Date());
    const atStart=S.wk<=start, atNow=S.wk>=cur;
    return '<div class="monthbar">'
      +'<button onclick="stepPeriod(-1)" '+(atStart?'disabled':'')+' title="Previous week">&lsaquo;</button>'
      +'<div class="mlbl">'+mkPWeek(S.wk).label+(atNow?'':' <span class="pill due">Backfill</span>')+'</div>'
      +'<button onclick="stepPeriod(1)" '+(atNow?'disabled':'')+' title="Next week">&rsaquo;</button></div>';
  }
  const start=S.card?new Date(S.card.started_at+"T00:00:00"):new Date(NOW.y,NOW.m,1);
  const atStart=S.view.y<start.getFullYear()||(S.view.y===start.getFullYear()&&S.view.m<=start.getMonth());
  const atNow=S.view.y===NOW.y&&S.view.m===NOW.m;
  return '<div class="monthbar">'
    +'<button onclick="stepPeriod(-1)" '+(atStart?'disabled':'')+' title="Previous month">&lsaquo;</button>'
    +'<div class="mlbl">'+MON[S.view.m]+' '+S.view.y+(atNow?'':' <span class="pill due">Backfill</span>')+'</div>'
    +'<button onclick="stepPeriod(1)" '+(atNow?'disabled':'')+' title="Next month">&rsaquo;</button></div>';
}
function stepPeriod(d){
  if(isWeekly()){ S.wk=addDays(S.wk,7*d); render(); return; }
  let m=S.view.m+d,y=S.view.y;
  if(m<0){m=11;y--} if(m>11){m=0;y++}
  S.view={y:y,m:m}; render();
}

/* One tickable row. `right` is the small text on the right-hand side. */
function itemBtn(i,key,due,right,credit){
  const v=S.entries[i.id+'|'+key], on=v===true, nap=due&&v==='na';
  return '<button class="item '+(on?'on':'')+' '+((due&&!nap)?'':'na')+'" '+(due?'onclick="tick(\''+i.id+'\',\''+key+'\',\''+(credit||'')+'\')"':'')+'>'
    +'<span class="box" '+(nap?'style="font-size:9px"':'')+'>'+(on?'✓':(nap?'N/A':''))+'</span><span class="ilabel">'+esc(label(i))+'</span>'
    +'<span class="freq">'+(nap?'Not applicable':right)+'</span></button>';
}

function checkin(s){
  const P=viewP(), W=P.weekly;
  let h=periodBar();
  h+='<div class="note">Tap once for <b>yes</b>, twice for <b>N/A</b>, three times to clear. '
    +(W?'N/A items are <b>greyed out and don\'t count</b>. Your score is this week\'s items. The optional monthly, quarterly and yearly ones below only count when you tick yes, or in the week they\'re due.'
       :'Items outside their cycle and items marked N/A are <b>greyed out and don\'t count</b>. The denominator is what you selected, not the whole library.')+'</div>';
  let any=false;
  S.cats.forEach(c=>{
    const mine=catItems(c.id).filter(i=>i.is_selected&&(!W||isShortCycle(i)));
    if(liveItems().some(i=>i.category_id===c.id&&i.is_selected)) any=true;
    if(!mine.length) return;
    const cs=s.cats.find(x=>x.id===c.id);
    h+='<div class="catblock"><div class="cathead"><div class="catname">'+esc(catTitle(c))+'</div><div class="catpct">'+(W?(cs.due?cs.done+'/'+cs.due:'—'):ten(cs.pct))+'</div></div>'
      +'<div class="catmeta">'+(W?cs.sel+' selected &middot; N/A answers not counted':cs.done+' of '+cs.due+' due &middot; '+cs.sel+' of '+cs.total+' selected')+'</div>'
      +'<div class="bar"><span style="width:'+((cs.pct||0)*100)+'%"></span></div>';
    mine.forEach(i=>{
      const due=W?true:isDue(i.freq,P.m,i.target_month);
      h+=itemBtn(i,ekey(i,P),due,due?FREQ[i.freq]:(i.target_month?MON[i.target_month-1]:'Not due'));
    });
    h+='</div>';
  });
  if(W) h+=longCycle(P);
  if(!any) h+='<div class="empty">Nothing selected yet. Open <b>Items</b> and pick what applies to you.</div>';
  return h;
}

/* Weekly template only: the optional monthly / quarterly / 6-month / yearly items. */
function longCycle(P){
  const groups=[['m','Monthly','month'],['q','Quarterly','quarter'],['s','Every 6 months','half-year'],['a','Yearly','year']];
  const catPos=id=>S.cats.findIndex(c=>c.id===id);
  let h='',any=false;
  groups.forEach(g=>{
    const f=g[0];
    const items=liveItems().filter(i=>i.is_selected&&i.freq===f)
      .sort((a,b)=>catPos(a.category_id)-catPos(b.category_id)||a.sort_order-b.sort_order);
    if(!items.length) return;
    if(!any){
      any=true;
      h+='<div class="seglbl" style="margin-top:30px">Beyond the week &middot; optional</div>'
        +'<div class="note" style="margin-top:8px">Tick one whenever you do it, any week. A yes adds to that week\'s score; leaving one blank costs nothing until it\'s due. '
        +'On the first Friday of a new period the one that just ended becomes due, and counts if you haven\'t done it.</div>';
    }
    const p=CYC[f], fri=P.fri;
    const closing=fri.getDate()<=7&&fri.getMonth()%p===0;
    const blocks=(closing?[1]:[]).concat([0]);
    blocks.forEach(back=>{
      const start=cycleStart(f,fri,back), key=pkey(start.getFullYear(),start.getMonth());
      const nm=cycleName(f,start);
      const na=items.filter(i=>S.entries[i.id+'|'+key]==='na').length;
      const done=items.filter(i=>S.entries[i.id+'|'+key]===true).length;
      const isClose=back===1;
      h+='<div class="catblock" style="margin-top:14px'+(isClose?';border:1px solid var(--gold);border-radius:12px;padding:12px':'')+'">'
        +'<div class="cathead"><div class="catname" style="font-size:'+(isClose?'15':'14')+'px">'
        +(isClose?'Close out '+esc(nm)+' &middot; '+g[1].toLowerCase():g[1]+' &middot; '+esc(nm))+'</div>'
        +'<div class="catpct" style="font-size:13px">'+done+' of '+(items.length-na)+'</div></div>'
        +'<div class="catmeta">'+(isClose?'Due this week. Answer for '+esc(nm)+' &mdash; anything not done counts against this week.'
           :'Do these once each '+g[2]+' &mdash; tick when you\'ve done it.')+'</div>';
      items.forEach(i=>{
        const c=S.cats.find(x=>x.id===i.category_id);
        h+=itemBtn(i,key,true,c?c.name:'',P.key);
      });
      h+='</div>';
    });
  });
  return h;
}

function wheel(s){
  const P=viewP();
  let h=periodBar();
  h+='<div class="wheelwrap"><div class="scoreline"><div class="n">'+ten(s.overall)+'</div>'
    +'<div class="d">'+esc(S.template.score_label)+' score &middot; '+esc(P.label)+'</div>'
    +'<div class="c">'+s.tDone+' of '+s.tDue+' items completed</div></div>'+radar(s.cats,320,true)
    +'<div class="legend"><span><i style="background:#3B5068"></i>Perfect</span><span><i style="background:#4C9BE0"></i>You</span></div>'
    +'</div><div class="catlist">';
  s.cats.filter(c=>c.pct!==null).sort((a,b)=>b.pct-a.pct).forEach(c=>{
    h+='<div class="catrow '+(c.pct<.5?'low':'')+'"><div class="nm">'+esc(c.name)+'</div>'
      +'<div class="ct">'+c.done+' of '+c.due+'</div><div class="tr"><span style="width:'+(c.pct*100)+'%"></span></div>'
      +'<div class="vl">'+ten(c.pct)+'</div></div>';});
  return h+'</div>';
}

/* Periods from the card's start up to the one being viewed. Weekly cards show
   the latest 12 weeks so the charts stay readable. */
function periodsSinceStart(){
  const out=[];
  if(isWeekly()){
    let mon=mondayOf(new Date(S.card.started_at+"T00:00:00"));
    while(mon<=S.wk){
      const P=mkPWeek(mon);
      out.push({P:P,label:P.short,y:P.y,m:P.m,s:score(P)});
      mon=addDays(mon,7);
      if(out.length>156) break;
    }
    return out.slice(-12);
  }
  const start=new Date(S.card.started_at+"T00:00:00");
  let y=start.getFullYear(), m=start.getMonth();
  while(y<S.view.y||(y===S.view.y&&m<=S.view.m)){
    const P=mkPMonth(y,m);
    out.push({P:P,label:MON[m],y:y,m:m,s:score(P)});
    m++; if(m>11){m=0;y++}
    if(out.length>60) break;
  }
  return out;
}

function history(){
  const ms=periodsSinceStart(), U=isWeekly()?'week':'month';
  if(!ms.length) return '<div class="empty">No history yet.</div>';
  const labels=ms.map(x=>x.label);
  const vals=ms.map(x=>x.s.overall);
  const live=vals.filter(v=>v!==null);
  const avg=live.length?live.reduce((a,b)=>a+b,0)/live.length:null;
  const best=ms.slice().sort((a,b)=>(b.s.overall||0)-(a.s.overall||0))[0];
  const worst=ms.slice().sort((a,b)=>(a.s.overall||0)-(b.s.overall||0))[0];
  const pos=vals.filter(v=>v!==null&&v>=.7).length;

  let h='<div class="histcard"><div class="eyebrow" style="margin-bottom:10px">'+esc(S.template.score_label)+' trend</div>'
    +lineChart(vals,400,132,'#4C9BE0',true,labels)+'</div>';
  h+='<div class="statgrid">'
    +'<div class="stat"><div class="sl">Average</div><div class="sv">'+ten(avg)+'</div></div>'
    +'<div class="stat"><div class="sl">Best '+U+'</div><div class="sv">'+ten(best.s.overall)+'<span class="sm">'+best.label+'</span></div></div>'
    +'<div class="stat"><div class="sl">Lowest '+U+'</div><div class="sv" style="color:var(--alert)">'+ten(worst.s.overall)+'<span class="sm">'+worst.label+'</span></div></div>'
    +'<div class="stat"><div class="sl">'+(isWeekly()?'70%':'7.0')+' or better</div><div class="sv">'+pos+'<span class="sm">of '+vals.length+' '+U+(vals.length===1?'':'s')+'</span></div></div></div>';

  const rows=S.cats.map(c=>{
    const ser=ms.map(x=>{const cc=x.s.cats.find(y=>y.id===c.id);return cc?cc.pct:null;});
    const cur=ser[ser.length-1], first=ser.find(v=>v!==null);
    return {c:c,ser:ser,cur:cur,
      delta:(cur!==null&&first!==undefined&&first!==null)?(cur-first)*10:null,
      last:ms[ms.length-1].s.cats.find(y=>y.id===c.id)};
  }).filter(r=>r.cur!==null);

  const moved=rows.filter(r=>r.delta!==null).sort((a,b)=>b.delta-a.delta);
  if(moved.length>1&&ms.length>1){
    const up=moved[0],dn=moved[moved.length-1];
    h+='<div class="statgrid">'
      +'<div class="stat"><div class="sl">Most improved</div><div class="sv" style="font-size:17px;color:var(--track)">'+esc(up.c.name.replace('Family: ',''))+'<span class="sm">'+(up.delta>=0?'+':'')+dfmt(up.delta)+' since '+labels[0]+'</span></div></div>'
      +'<div class="stat"><div class="sl">Biggest slide</div><div class="sv" style="font-size:17px;color:'+(dn.delta<0?'var(--alert)':'var(--muted)')+'">'+esc(dn.c.name.replace('Family: ',''))+'<span class="sm">'+(dn.delta>=0?'+':'')+dfmt(dn.delta)+' since '+labels[0]+'</span></div></div></div>';
  }

  h+='<div class="eyebrow" style="margin:26px 0 12px">Every category, '+(isWeekly()?'week by week':'month by month')+'</div>';
  rows.forEach(r=>{
    const col=r.cur<.5?'#E0705F':(r.cur>=.85?'#3FA88F':'#4C9BE0');
    h+='<div class="ctrend"><div class="cth"><div class="ctn">'+esc(catTitle(r.c))+'</div><div class="ctd">'
      +(r.delta===null?'':(r.delta>0?'<span style="color:var(--track)">&#9650; '+dfmt(r.delta)+'</span>':(r.delta<0?'<span style="color:var(--alert)">&#9660; '+dfmt(Math.abs(r.delta))+'</span>':'<span>no change</span>')))
      +'</div><div class="ctv" style="color:'+col+'">'+ten(r.cur)+'</div></div>'
      +'<div class="ctc">'+lineChart(r.ser,300,58,col,false,labels)+'</div>'
      +'<div class="ctvals">'+r.ser.map((v,i)=>'<span class="'+(i===r.ser.length-1?'now':'')+'"><b>'+ms[i].label+'</b>'+ten(v)+'</span>').join('')+'</div>'
      +'<div class="ctfoot">'+r.last.done+' of '+r.last.due+' due this '+U+' &middot; '+r.last.sel+' of '+r.last.total+' selected</div></div>';
  });

  h+='<div class="eyebrow" style="margin:26px 0 12px">'+(isWeekly()?'Week by week':'Month by month')+'</div><div class="mgrid">';
  for(let i=ms.length-1;i>=0;i--){const x=ms[i];
    h+='<div class="mcard '+((x.P.key===viewP().key)?'cur':'')+'"><div class="mn">'+x.label+'</div>'
      +'<div class="ms">'+ten(x.s.overall)+'</div><div class="mc">'+x.s.tDone+' of '+x.s.tDue+'</div>'
      +radar(x.s.cats,140,false)+'</div>';}
  h+='</div>';

  h+='<div class="histcard" style="margin-top:16px"><div class="eyebrow" style="margin-bottom:12px">Category streaks</div>';
  const st=[];
  S.cats.forEach(c=>{ let run=0;
    for(let i=ms.length-2;i>=0;i--){ const cc=ms[i].s.cats.find(x=>x.id===c.id); if(cc&&cc.pct===1)run++; else break; }
    if(run)st.push({n:c.name,run:run});});
  if(!st.length) h+='<div style="font-size:13px;color:var(--muted);line-height:1.5">No categories at 100% yet.</div>';
  else st.sort((a,b)=>b.run-a.run).forEach(x=>{
    h+='<div class="hrow"><div style="flex:1;font-size:14px">'+esc(x.n)+'</div><div style="font-size:12.5px;color:var(--gold)">'+x.run+' '+U+(x.run>1?'s':'')+' at 100%</div></div>';});
  return h+'</div>';
}

function itemsScreen(){
  let h='<div class="note">These are suggestions, not requirements. Keep what applies, rename anything with <b>&#9998;</b>, change the frequency, and add your own.'
    +(S.isAdmin?'<br><br><b style="color:var(--gold)">Admin:</b> a gold toggle at the end of each row shows where a question lives. <b>On</b> = it is part of the global template that every user gets. <b>Off</b> = it is only on your scorecard; turn it on to share it. When you edit wording with &#9998;, <b>Everyone</b> changes it for all users and <b>Just me</b> changes only your own copy (tagged <i>Edited</i>).':'')+'</div>';
  h+='<div class="seglbl" style="margin-top:0">Sort within each category</div><div class="seg">';
  [['freq','Frequency'],['az','A – Z'],['manual','My order']].forEach(function(p){
    h+='<button class="'+(S.sortMode===p[0]?'on':'')+'" onclick="setSort(\''+p[0]+'\')">'+p[1]+'</button>';});
  h+='</div>';
  h+='<div class="selrow '+(S.onlyUsing?'on':'')+'" style="margin-top:14px;cursor:pointer" onclick="setOnlyUsing()">'
    +'<span class="tog"></span><span class="ilabel">Show only what I&rsquo;m using</span></div>';
  S.cats.forEach(c=>{
    const all=catItems(c.id), mine=shownItems(c.id), nOn=all.filter(i=>i.is_selected).length;
    h+='<div class="catblock" style="margin-top:24px"><div class="cathead"><div class="catname">'+esc(catTitle(c))+'</div>'
      +'<div style="font-size:12px;color:var(--muted);font-weight:600">'+nOn+' of '+all.length+'</div></div>'
      +'<div class="pickrow">'
      +(S.onlyUsing?'':'<button class="pick" '+(nOn===all.length?'disabled':'')+' onclick="pickAll(\''+c.id+'\',true)">Select all</button>')
      +'<button class="pick" '+(nOn===0?'disabled':'')+' onclick="pickAll(\''+c.id+'\',false)">Clear all</button>'
      +(S.isAdmin&&S.sortMode==='manual'?'<button class="pick" style="color:var(--gold)" onclick="saveDefaultOrder(\''+c.id+'\')">Save as default order</button>':'')
      +'</div><div style="display:flex;flex-direction:column;gap:2px">';
    mine.forEach(i=>{
      if(S.editing===i.id){
        h+='<div class="selrow on"><input class="renameinp" id="rn" value="'+esc(label(i))+'"'
          +' onkeydown="if(event.key===\'Enter\')this.blur();if(event.key===\'Escape\'){S.editing=null;render()}"'
          +' onblur="saveName(\''+i.id+'\',this.value)">'
          +(S.isAdmin&&i.library_item_id
             ?'<button class="trkbtn" style="width:auto;padding:0 8px" title="Only on your scorecard" onmousedown="saveName(\''+i.id+'\',document.getElementById(\'rn\').value)">Just me</button>'
              +'<button class="trkbtn" style="width:auto;padding:0 8px;color:var(--gold);border-color:var(--gold)" title="Changes it for every user" onmousedown="saveGlobalName(\''+i.id+'\',document.getElementById(\'rn\').value)">Everyone</button>'
             :'<button class="trkbtn" onmousedown="saveName(\''+i.id+'\',document.getElementById(\'rn\').value)">✓</button>')
          +'</div>';
        return;
      }
      const tag=!i.library_item_id?'<span class="custom-tag">Yours</span>'
               :(i.renamed_label?'<span class="custom-tag">Edited</span>':'');
      const canMove=S.sortMode==='manual'&&!S.editing, pos=mine.indexOf(i);
      h+='<div class="selrow '+(i.is_selected?'on':'')+'" data-row="'+i.id+'">'
        +(canMove?'<span class="grip" title="Drag to reorder" onpointerdown="dragStart(event,\''+c.id+'\')">&#8801;</span>':'')
        +(canMove?'<span class="mv"><button title="Move up" '+(pos===0?'disabled':'')+' onclick="moveItem(\''+i.id+'\',-1)">&#9650;</button>'
          +'<button title="Move down" '+(pos===mine.length-1?'disabled':'')+' onclick="moveItem(\''+i.id+'\',1)">&#9660;</button></span>':'')
        +'<span class="tog" onclick="toggleSel(\''+i.id+'\')"></span>'
        +'<span class="ilabel" onclick="toggleSel(\''+i.id+'\')">'+esc(label(i))+tag
        +(fullQ(i)?'<span style="display:block;font-size:11.5px;color:var(--muted);font-weight:400;margin-top:2px">'+esc(fullQ(i))+'</span>':'')+'</span>'
        +'<button class="trkbtn" title="Rename" onclick="S.editing=\''+i.id+'\';render();var e=document.getElementById(\'rn\');if(e){e.focus();e.select();}">&#9998;</button>'
        +(!i.library_item_id?'<button class="trkbtn" title="Delete this item" style="color:var(--alert)" onclick="deleteItem(\''+i.id+'\')">&#10005;</button>':'')
        +'<select class="fsel" onchange="setFreq(\''+i.id+'\',this.value)">'
        +freqKeys().map(f=>'<option value="'+f+'" '+(i.freq===f?'selected':'')+'>'+FREQ[f]+'</option>').join('')
        +'</select>'
        +(canGlobal(i)?'<span class="gtog '+(isGlobal(i)?'on':'')+'" title="'+(isGlobal(i)?'Global template question - tap to remove it for everyone':'Only on your scorecard - tap to add it to the global template')+'" onclick="toggleGlobal(\''+i.id+'\')"></span>':'')
        +'</div>';
    });
    if(!mine.length) h+='<div style="font-size:12.5px;color:var(--muted);padding:6px 10px">Nothing selected here. Turn off &ldquo;Show only what I\'m using&rdquo; above to pick items.</div>';
    h+='</div><div class="addwrap"><input id="ci-'+c.id+'" placeholder="Add your own..." onkeydown="if(event.key===\'Enter\')addItem(\''+c.id+'\')">'
      +'<select id="cf-'+c.id+'">'+freqKeys().map(f=>'<option value="'+f+'" '+(f===(isWeekly()?'w':'m')?'selected':'')+'>'+FREQ[f]+'</option>').join('')+'</select>'
      +'<button onclick="addItem(\''+c.id+'\')">Add</button></div></div>';
  });
  h+='<button class="resetbtn" onclick="resetCard()">Reset this scorecard to the template</button>';
  return h;
}
/* Every scorecard opens in "My order": the template's order until the user moves things. */
function defSort(){ return 'manual'; }
const freqKeys=()=>Object.keys(FREQ);
/* Admin only: a question an admin added ("Yours") can be made part of the shared
   template. Only questions promoted this way (code 'custom-...') can be switched back. */
const isGlobal=i=>!!i.library_item_id;
const canGlobal=i=>S.isAdmin;
async function saveGlobalName(id,v){
  const val=(v||'').trim();
  S.editing=null;
  if(!val){ render(); return; }
  if(!confirm('Change this question to "'+val+'" for every user?')){ render(); return; }
  try{
    await run(SB.rpc("sc_edit_global",{p_item:id,p_text:val}));
    const {data,error}=await SB.from("sc_library_items").select("*").eq("is_active",true).order("sort_order");
    if(error) throw error;
    S.allLib=data||[]; S.library=S.allLib.filter(l=>S.cats.some(c=>c.id===l.category_id));
    await loadCard(true);
    saving('on','Saved for everyone');
  }catch(e){ console.error(e); }
  render();
}
async function toggleGlobal(id){
  const it=S.items.find(i=>i.id===id); if(!it) return;
  const on=!isGlobal(it);
  if(!confirm(on?'Add "'+label(it)+'" to the global template? Every user will get this question.'
                 :'Remove "'+label(it)+'" from the global template? Other users will stop seeing it. It stays on your own scorecard.')) return;
  try{
    await run(SB.rpc("sc_set_global",{p_item:id,p_on:on}));
    const tid=S.template.id, tab=S.tab, sort=S.sortMode;
    const r=await Promise.all([
      SB.from("sc_categories").select("*").order("sort_order"),
      SB.from("sc_library_items").select("*").eq("is_active",true).order("sort_order")
    ]);
    r.forEach(x=>{ if(x.error) throw x.error; });
    S.allCats=r[0].data||[]; S.allLib=r[1].data||[];
    await openTemplate(tid); S.tab=tab; S.sortMode=sort;
  }catch(e){ console.error(e); }
  render();
}
/* ---- Reordering (Items screen, "My order" only) ---------------------------
   sort_order is per user item. Moving renumbers the category 0..n-1. */
async function applyOrder(catId,ids){
  const list=catItems(catId);
  if(ids.length<list.length){   /* only the visible rows were reordered: hidden ones keep their slots */
    const vis={}; ids.forEach(x=>vis[x]=1);
    let k=0; ids=list.map(x=>vis[x.id]?ids[k++]:x.id);
  }
  if(ids.length!==list.length||S.sortMode!=='manual'){ render(); return; }
  const changes=[];
  ids.forEach((id,n)=>{ const it=S.items.find(x=>x.id===id); if(it&&it.sort_order!==n) changes.push({it:it,was:it.sort_order,n:n}); });
  changes.forEach(c=>{ c.it.sort_order=c.n; }); render();
  if(!changes.length) return;
  try{
    await Promise.all(changes.map(c=>run(SB.from("sc_user_scorecard_items").update({sort_order:c.n}).eq("id",c.it.id))));
  }catch(e){ changes.forEach(c=>{ c.it.sort_order=c.was; }); render(); }
}
function moveItem(id,dir){
  const it=S.items.find(i=>i.id===id); if(!it) return;
  const ids=shownItems(it.category_id).map(x=>x.id), i=ids.indexOf(id), j=i+dir;
  if(i<0||j<0||j>=ids.length) return;
  ids.splice(j,0,ids.splice(i,1)[0]);
  return applyOrder(it.category_id,ids);
}
let DRAG=null;
function dragStart(e,catId){
  e.preventDefault();
  const h=e.currentTarget, row=h.closest('[data-row]');
  DRAG={catId:catId,row:row,list:row.parentNode};
  row.classList.add('dragging');
  h.setPointerCapture(e.pointerId);
  h.onpointermove=dragMove; h.onpointerup=dragEnd; h.onpointercancel=dragEnd;
}
function dragMove(e){
  if(!DRAG) return;
  const y=e.clientY;
  if(y<90) window.scrollBy(0,-12); else if(y>window.innerHeight-90) window.scrollBy(0,12);
  let before=null;
  const rows=DRAG.list.querySelectorAll('[data-row]');
  for(let k=0;k<rows.length;k++){
    if(rows[k]===DRAG.row) continue;
    const b=rows[k].getBoundingClientRect();
    if(y<b.top+b.height/2){ before=rows[k]; break; }
  }
  if(before) DRAG.list.insertBefore(DRAG.row,before); else DRAG.list.appendChild(DRAG.row);
}
function dragEnd(){
  if(!DRAG) return;
  const d=DRAG; DRAG=null; d.row.classList.remove('dragging');
  const ids=[].map.call(d.list.querySelectorAll('[data-row]'),r=>r.getAttribute('data-row'));
  applyOrder(d.catId,ids);
}
/* Admin: make this category's order the default for the shared template. */
async function saveDefaultOrder(catId){
  if(!confirm("Use this order as the default for everyone? New scorecards will start in it. People who already have a scorecard keep their own order.")) return;
  try{
    await run(SB.rpc("sc_set_default_order",{p_items:catItems(catId).map(i=>i.id)}));
    const {data,error}=await SB.from("sc_library_items").select("*").eq("is_active",true).order("sort_order");
    if(error) throw error;
    S.allLib=data||[]; S.library=S.allLib.filter(l=>S.cats.some(c=>c.id===l.category_id));
    saving('on','Default order saved');
  }catch(e){ console.error(e); }
}
function setSort(m){ S.sortMode=m; S.editing=null; render(); }

function render(){
  const app=$("app");
  if(S.tab!=='items') S.keepShown={};
  if(!S.template){
    let h='<div class="h1">Scorecards</div><div class="sub">Choose a scorecard &middot; signed in as '+esc(S.profile.email||'')+'</div>';
    S.templates.forEach(t=>{
      const started=S.cards.some(c=>c.template_id===t.id);
      h+='<button class="card" style="display:block;width:100%;text-align:left;cursor:pointer;color:inherit;font:inherit" onclick="goTemplate(\''+t.id+'\')">'
        +'<div class="eyebrow" style="margin-bottom:6px">'+(started?'In progress':'Not started')+'</div>'
        +'<div style="font-size:17px;font-weight:700;margin-bottom:6px">'+esc(t.name)+'</div>'
        +'<div style="font-size:13.5px;line-height:1.5;color:var(--muted)">'+esc(t.description||'')+'</div></button>';
    });
    app.innerHTML=h+'<div style="text-align:center;font-size:10.5px;color:var(--muted);margin-top:30px">v'+APP_RELEASE+' &middot; '+esc(BUILD_ID)+'</div>';
    return;
  }
  const back='';
  if(!S.card){
    const n=S.library.filter(l=>l.is_default_on).length;
    app.innerHTML=back+'<div class="h1">'+esc(S.template.name)+'</div>'
      +'<div class="sub">'+esc(S.template.description||'')+'</div>'
      +'<div class="card"><div class="eyebrow" style="margin-bottom:10px">What you get</div>'
      +'<div style="font-size:13.5px;line-height:1.6;color:var(--muted)">'
      +S.cats.length+' categories &middot; '+S.library.length+' suggested items &middot; '
      +'<b style="color:var(--bone)">'+n+' switched on to start</b>.<br>'
      +'Nothing is required. Add, rename, drop or re-time anything on the Items tab.</div></div>'
      +'<button class="bigbtn" id="adoptBtn" '+(S.busy?'disabled':'')+'>Start my '+esc(S.template.name)+'</button>';
    const b=$("adoptBtn"); if(b) b.addEventListener("click",adopt);
    return;
  }
  const s=score(viewP());
  const tabs=[['checkin','Check-in'],['score',S.template.score_label],['history','History'],['items','Items']];
  let h=back+'<div class="h1">'+esc(S.template.name)+'</div>'
    +'<div class="sub">'+MON[NOW.m]+' '+NOW.y+' &middot; signed in as '+esc(S.profile.email||'')+'</div><div class="tabs">';
  tabs.forEach(function(t){ h+='<button class="tab '+(S.tab===t[0]?'on':'')+'" onclick="S.tab=\''+t[0]+'\';render()">'+esc(t[1])+'</button>'; });
  h+='</div>';
  h += S.tab==='checkin' ? checkin(s)
     : S.tab==='score'   ? wheel(s)
     : S.tab==='history' ? history()
     :                     itemsScreen();
  h+='<div style="text-align:center;font-size:10.5px;color:var(--muted);margin-top:30px">v'+APP_RELEASE+' &middot; '+esc(BUILD_ID)+'</div>';
  app.innerHTML=h;
}

let appEntered=false;
async function enterAppSafe(email){
  if(appEntered) return;
  appEntered=true;
  $("loginGate").style.display="none";
  $("appRoot").style.display="";
  $("app").innerHTML='<div class="empty">Loading...</div>';
  try{ await loadAll(); render(); }
  catch(err){
    console.error("load failed",err);
    $("app").innerHTML='<div class="card"><div class="eyebrow" style="color:var(--alert);margin-bottom:8px">Could not load</div>'
      +'<div style="font-size:13px;color:var(--muted)">'+esc(err.message||err)+'</div></div>';
  }
}
function hashParam(h,k){
  const parts=String(h||"").replace("#","").split("&");
  for(const p of parts){ const i=p.indexOf("="); if(i>0&&p.slice(0,i)===k) return decodeURIComponent(p.slice(i+1).split("+").join(" ")); }
  return "";
}
(async function(){
  const gate=$("loginGate"), hash=location.hash||"";
  SB.auth.onAuthStateChange((ev,session)=>{
    if(ev==="PASSWORD_RECOVERY"){ gate.style.display="flex"; setAuthMode("newpass"); return; }
    /* getSession() can transiently return null during a token refresh. If a
       session shows up afterwards, enter rather than stranding the user. */
    if(session&&!appEntered&&authMode!=="newpass"){ enterAppSafe(session.user.email); }
  });
  if(hashParam(hash,"error")||hashParam(hash,"error_code")){
    gate.style.display="flex"; setAuthMode("signin");
    $("loginErr").textContent=hashParam(hash,"error_description")||"That link is invalid or has expired. Please request a new one.";
    history.replaceState(null,"",location.pathname+location.search);
    return;
  }
  if(hashParam(hash,"type")==="recovery"){ gate.style.display="flex"; setAuthMode("newpass"); return; }
  const {data}=await SB.auth.getSession();
  if(data&&data.session){ await enterAppSafe(data.session.user.email); }
  else { gate.style.display="flex"; setAuthMode("signin"); }
})();

if("serviceWorker" in navigator && location.protocol==="https:"){
  window.addEventListener("load",()=>navigator.serviceWorker.register("/sw.js").catch(e=>console.warn("sw",e)));
}
