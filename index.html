        const key=ekey(i,P), v=S.entries[i.id+'|'+key], fut=isFutureP(P);
        if(!fut&&v!=='na'){ rp++; colPoss[ci]++; if(v===true){ rd++; colDone[ci]++; } }
        h+='<td class="c '+(v===true?'on':(v==='na'?'na':''))+(fut?' fut':'')+'"'+(fut?'':' onclick="gridTap(\''+i.id+'\',\''+key+'\')"')+'>'+(v===true?'&#10003;':(v==='na'?'N/A':''))+'</td>';
      });
      allDone+=rd; allPoss+=rp;
      h+='<td class="tot">'+rd+'/'+rp+'</td><td class="tot">'+(rp?Math.round(rd/rp*100)+'%':'&ndash;')+'</td></tr>';
    });
  });
  h+='<tr class="sum"><td class="nm" style="background:var(--raise)">Total</td>'+cols.map((P,ci)=>'<td>'+(colPoss[ci]?colDone[ci]:'')+'</td>').join('')
    +'<td class="tot">'+allDone+'/'+allPoss+'</td><td class="tot">'+(allPoss?Math.round(allDone/allPoss*100)+'%':'&ndash;')+'</td></tr>';
  h+='<tr class="sum"><td class="nm" style="background:var(--raise)">%</td>'+cols.map((P,ci)=>'<td>'+(colPoss[ci]?Math.round(colDone[ci]/colPoss[ci]*100):'')+'</td>').join('')+'<td class="tot"></td><td class="tot"></td></tr>';
  h+='</tbody></table></div>';
  let best=-1,bi=-1,perfect=0,live=0;
  cols.forEach((P,ci)=>{ if(!colPoss[ci]) return; live++; if(colDone[ci]>best){best=colDone[ci];bi=ci;} if(colDone[ci]===colPoss[ci]) perfect++; });
  const bl=bi<0?'':(isDaily()?DOW[cols[bi].mon.getDay()]+' '+cols[bi].mon.getDate():(isWeekly()?'W'+cols[bi].week:MON[cols[bi].m]));
  h+='<div class="gsum statgrid">'
    +'<div class="stat"><div class="sl">Overall</div><div class="sv">'+(allPoss?Math.round(allDone/allPoss*100)+'%':'&mdash;')+'<span class="sm">'+allDone+' of '+allPoss+'</span></div></div>'
    +'<div class="stat"><div class="sl">Perfect '+U+'s</div><div class="sv">'+perfect+'<span class="sm">of '+live+'</span></div></div>'
    +'<div class="stat"><div class="sl">Best '+U+'</div><div class="sv">'+(bi<0?'&mdash;':best)+'<span class="sm">'+esc(bl)+(bi<0?'':' &middot; '+Math.round(best/colPoss[bi]*100)+'%')+'</span></div></div>'
    +'<div class="stat"><div class="sl">Average per '+U+'</div><div class="sv">'+(live?(allDone/live).toFixed(1):'&mdash;')+'<span class="sm">items done</span></div></div></div>';
  return h;
}
/* Jump from the calendar to that day / week / month on the check-in tab. */
function calJump(k){
  if(!isWeekly()){ const p=k.split('-'); S.view={y:+p[0],m:+p[1]-1}; }
  else { const d=new Date(k+'T00:00:00'); if(isDaily()) S.day=d; else S.wk=mondayOf(d); }
  S.tab='checkin'; S.stripScroll=null; window.scrollTo(0,0); render();
}
function calCls(sc){ return sc===null?'':(sc>=.85?'g':(sc>=.5?'b':'r')); }
function monthCalendar(){
  const c=cm();
  const startKey=S.card?S.card.started_at:'0000-00-00';
  let h='<div class="gnav"><button class="iconbtn" onclick="calNav(-1)" aria-label="Previous">&lsaquo;</button><div class="gt">'+(isWeekly()?MONFULL[c.m]+' '+c.y:c.y)+'</div><button class="iconbtn" onclick="calNav(1)" aria-label="Next">&rsaquo;</button></div>';
  if(!isWeekly()){
    h+='<div class="cal calmon">';
    for(let m=0;m<12;m++){
      const P=mkPMonth(c.y,m), fut=isFutureP(P)||P.key<startKey.slice(0,8)+"01", sc=fut?null:score(P).overall;
      const cur=(S.view.y===c.y&&S.view.m===m);
      h+='<button class="d '+calCls(sc)+(fut?' dim':'')+(cur?' sel':'')+'" '+(fut?'disabled':'onclick="calJump(\''+P.key+'\')"')+'>'+MON[m]+'<small>'+(sc===null?'':ten(sc))+'</small></button>';
    }
    return h+'</div>';
  }
  h+='<div class="cal">'+['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(d=>'<div class="dh">'+d+'</div>').join('');
  const first=new Date(c.y,c.m,1), dim=new Date(c.y,c.m+1,0).getDate(), t0=today0();
  for(let i=0;i<(first.getDay()+6)%7;i++) h+='<div class="blank"></div>';
  let perfect=0,tot=0,n=0; const wkScore={};
  for(let d=1;d<=dim;d++){
    const dt=new Date(c.y,c.m,d), k=ymd(dt), fut=dt>t0, before=k<startKey;
    let sc=null;
    if(!fut&&!before){
      if(isDaily()) sc=score(mkPDay(dt)).overall;
      else{ const mk=ymd(mondayOf(dt)); if(!(mk in wkScore)) wkScore[mk]=score(mkPWeek(mondayOf(dt))).overall; sc=wkScore[mk]; }
    }
    if(isDaily()&&sc!==null){ n++; tot+=sc; if(sc>=1) perfect++; }
    const sel=isDaily()?(S.day&&ymd(S.day)===k):(S.wk&&ymd(S.wk)===ymd(mondayOf(dt)));
    h+='<button class="d '+calCls(sc)+(sc!==null&&sc>=1&&isDaily()?' p':'')+((fut||before)?' dim':'')+(sel?' sel':'')+'" '+(fut?'disabled':'onclick="calJump(\''+k+'\')"')+'>'+d+'<small>'+(sc===null?'':Math.round(sc*100)+'%')+'</small></button>';
  }
  h+='</div><div class="legend"><span><i style="background:rgba(63,168,143,.6)"></i>85%+</span><span><i style="background:rgba(72,160,206,.6)"></i>50&ndash;84%</span><span><i style="background:rgba(224,112,95,.6)"></i>under 50%</span>'+(isDaily()?'<span><i style="background:var(--gold)"></i>perfect</span>':'<span>colour = that week&rsquo;s score</span>')+'</div>';
  if(isDaily()&&n) h+='<div class="statgrid" style="margin-top:14px"><div class="stat"><div class="sl">Perfect days</div><div class="sv">'+perfect+'<span class="sm">of '+n+'</span></div></div><div class="stat"><div class="sl">Month average</div><div class="sv">'+Math.round(tot/n*100)+'%</div></div></div>';
  return h+'<div style="font-size:calc(13px*var(--z));color:var(--muted);margin-top:12px">Tap a day to open it.</div>';
}

/* (named historyScreen so it does not shadow window.history, which the address-bar updates use) */
function histTrends(){
  const ms=periodsSinceStart(), U=PWORD(), UC=U.charAt(0).toUpperCase()+U.slice(1);
  if(!ms.length) return '<div class="empty">No history yet.</div>';
  const labels=ms.map(x=>x.label);
  const vals=ms.map(x=>x.s.overall);
  const live=vals.filter(v=>v!==null);
  const avg=live.length?live.reduce((a,b)=>a+b,0)/live.length:null;
  const best=ms.slice().sort((a,b)=>(b.s.overall||0)-(a.s.overall||0))[0];
  const worst=ms.slice().sort((a,b)=>(a.s.overall||0)-(b.s.overall||0))[0];
  const pos=vals.filter(v=>v!==null&&v>=.7).length;

  let h='<div class="histcard"><div class="eyebrow" style="margin-bottom:10px">'+esc(S.template.score_label)+' trend</div>'
    +lineChart(vals,400,132,'#48A0CE',true,labels)+'</div>';
  h+='<div class="statgrid">'
    +'<div class="stat"><div class="sl">Average</div><div class="sv">'+ten(avg)+'</div></div>'
    +'<div class="stat"><div class="sl">Best '+U+'</div><div class="sv">'+ten(best.s.overall)+'<span class="sm">'+best.label+'</span></div></div>'
    +'<div class="stat"><div class="sl">Lowest '+U+'</div><div class="sv" style="color:var(--alert)">'+ten(worst.s.overall)+'<span class="sm">'+worst.label+'</span></div></div>'
    +'<div class="stat"><div class="sl">'+(isWeekly()?'70%':'7.0')+' or better</div><div class="sv">'+pos+'<span class="sm">of '+vals.length+' '+U+(vals.length===1?'':'s')+'</span></div></div></div>';

  const rows=S.cats.map(c=>{
    const ser=ms.map(x=>{const cc=x.s.cats.find(y=>y.id===c.id);return cc?cc.pct:null;});
    const cur=ser[ser.length-1], first=ser.find(v=>v!==null);
    return {c:c,ser:ser,cur:cur,
      delta:(cur!==null&&first!==undefined&&first!==null)?(cur-first)*10:null,
      last:ms[ms.length-1].s.cats.find(y=>y.id===c.id)};
  }).filter(r=>r.cur!==null);

  const moved=rows.filter(r=>r.delta!==null).sort((a,b)=>b.delta-a.delta);
  if(moved.length>1&&ms.length>1){
    const up=moved[0],dn=moved[moved.length-1];
    h+='<div class="statgrid">'
      +'<div class="stat"><div class="sl">Most improved</div><div class="sv" style="font-size:calc(18px*var(--z));color:var(--track)">'+esc(up.c.name.replace('Family: ',''))+'<span class="sm">'+(up.delta>=0?'+':'')+dfmt(up.delta)+' since '+labels[0]+'</span></div></div>'
      +'<div class="stat"><div class="sl">Biggest slide</div><div class="sv" style="font-size:calc(18px*var(--z));color:'+(dn.delta<0?'var(--alert)':'var(--muted)')+'">'+esc(dn.c.name.replace('Family: ',''))+'<span class="sm">'+(dn.delta>=0?'+':'')+dfmt(dn.delta)+' since '+labels[0]+'</span></div></div></div>';
  }

  h+='<div class="eyebrow" style="margin:26px 0 12px">Every category, '+U+' by '+U+'</div>';
  rows.forEach(r=>{
    const col=r.cur<.5?'#E0705F':(r.cur>=.85?'#3FA88F':'#48A0CE');
    h+='<div class="ctrend"><div class="cth"><div class="ctn">'+esc(catTitle(r.c))+'</div><div class="ctd">'
      +(r.delta===null?'':(r.delta>0?'<span style="color:var(--track)">&#9650; '+dfmt(r.delta)+'</span>':(r.delta<0?'<span style="color:var(--alert)">&#9660; '+dfmt(Math.abs(r.delta))+'</span>':'<span>no change</span>')))
      +'</div><div class="ctv" style="color:'+col+'">'+ten(r.cur)+'</div></div>'
      +'<div class="ctc">'+lineChart(r.ser,300,58,col,false,labels)+'</div>'
      +'<div class="ctvals">'+r.ser.map((v,i)=>'<span class="'+(i===r.ser.length-1?'now':'')+'"><b>'+ms[i].label+'</b>'+ten(v)+'</span>').join('')+'</div>'
      +'<div class="ctfoot">'+r.last.done+' of '+r.last.due+' due this '+U+' &middot; '+r.last.sel+' of '+r.last.total+' selected</div></div>';
  });

  h+='<div class="eyebrow" style="margin:26px 0 12px">'+UC+' by '+U+'</div><div class="mgrid">';
  for(let i=ms.length-1;i>=0;i--){const x=ms[i];
    h+='<div class="mcard '+((x.P.key===viewP().key)?'cur':'')+'"><div class="mn">'+x.label+'</div>'
      +'<div class="ms">'+ten(x.s.overall)+'</div><div class="mc">'+x.s.tDone+' of '+x.s.tDue+'</div>'
      +radar(x.s.cats,140,false)+'</div>';}
  h+='</div>';

  h+='<div class="histcard" style="margin-top:16px"><div class="eyebrow" style="margin-bottom:12px">Category streaks</div>';
  const st=[];
  S.cats.forEach(c=>{ let run=0;
    for(let i=ms.length-2;i>=0;i--){ const cc=ms[i].s.cats.find(x=>x.id===c.id); if(cc&&cc.pct===1)run++; else break; }
    if(run)st.push({n:c.name,run:run});});
  if(!st.length) h+='<div style="font-size:calc(15px*var(--z));color:var(--muted);line-height:1.5">No categories at 100% yet.</div>';
  else st.sort((a,b)=>b.run-a.run).forEach(x=>{
    h+='<div class="hrow"><div style="flex:1;font-size:calc(15.5px*var(--z))">'+esc(x.n)+'</div><div style="font-size:calc(13.5px*var(--z));color:var(--gold)">'+x.run+' '+U+(x.run>1?'s':'')+' at 100%</div></div>';});
  return h+'</div>';
}

/* ---- Reordering (Items screen, "My order" only) ---------------------------
   sort_order is per user item. Moving renumbers the category 0..n-1. */
async function applyOrder(catId,ids){
  const list=catItems(catId);
  if(ids.length<list.length){   /* only the visible rows were reordered: hidden ones keep their slots */
    const vis={}; ids.forEach(x=>vis[x]=1);
    let k=0; ids=list.map(x=>vis[x.id]?ids[k++]:x.id);
  }
  if(ids.length!==list.length||S.sortMode!=='manual'){ render(); return; }
  const changes=[];
  ids.forEach((id,n)=>{ const it=S.items.find(x=>x.id===id); if(it&&it.sort_order!==n) changes.push({it:it,was:it.sort_order,n:n}); });
  changes.forEach(c=>{ c.it.sort_order=c.n; }); render();
  if(!changes.length) return;
  try{
    await Promise.all(changes.map(c=>run(SB.from("sc_user_scorecard_items").update({sort_order:c.n}).eq("id",c.it.id))));
  }catch(e){ changes.forEach(c=>{ c.it.sort_order=c.was; }); render(); }
}
function moveItem(id,dir){
  const it=S.items.find(i=>i.id===id); if(!it) return;
  const ids=shownItems(it.category_id).map(x=>x.id), i=ids.indexOf(id), j=i+dir;
  if(i<0||j<0||j>=ids.length) return;
  ids.splice(j,0,ids.splice(i,1)[0]);
  return applyOrder(it.category_id,ids);
}
/* Drag to reorder. The grabbed row follows the pointer with a CSS transform and is never moved in
   the DOM until you let go (moving the element that holds the pointer breaks the drag on desktop). */
let DRAG=null;
function dragStart(e,catId){
  e.preventDefault();
  if(S.sortMode!=='manual'){ setSort('manual'); return; }   /* first touch switches to My order; drag again */
  const h=e.currentTarget, row=h.closest('[data-row]');
  DRAG={catId:catId,row:row,list:row.parentNode,startY:e.clientY,y:e.clientY,scroll0:window.scrollY,before:null,timer:null,grip:h,pid:e.pointerId};
  row.classList.add('dragging');
  document.body.style.userSelect='none';
  try{ h.setPointerCapture(e.pointerId); }catch(err){}
  window.addEventListener('pointermove',dragMove,{passive:false});
  window.addEventListener('pointerup',dragEnd);
  window.addEventListener('pointercancel',dragEnd);
  DRAG.timer=setInterval(dragTick,30);
}
function dragMove(e){ if(!DRAG) return; e.preventDefault(); DRAG.y=e.clientY; dragTick(); }
function dragTick(){
  const d=DRAG; if(!d) return;
  if(d.y<90) window.scrollBy(0,-14); else if(d.y>window.innerHeight-90) window.scrollBy(0,14);
  d.row.style.transform='translateY('+((d.y-d.startY)+(window.scrollY-d.scroll0))+'px)';
  const rows=[].filter.call(d.list.querySelectorAll('[data-row]'),r=>r!==d.row);
  rows.forEach(r=>r.classList.remove('drop-before','drop-after'));
  d.before=null;
  for(let k=0;k<rows.length;k++){
    const b=rows[k].getBoundingClientRect();
    if(d.y<b.top+b.height/2){ d.before=rows[k]; break; }
  }
  if(d.before) d.before.classList.add('drop-before'); else if(rows.length) rows[rows.length-1].classList.add('drop-after');
}
function dragEnd(){
  const d=DRAG; if(!d) return; DRAG=null;
  clearInterval(d.timer);
  window.removeEventListener('pointermove',dragMove);
  window.removeEventListener('pointerup',dragEnd);
  window.removeEventListener('pointercancel',dragEnd);
  try{ d.grip.releasePointerCapture(d.pid); }catch(err){}
  document.body.style.userSelect='';
  d.row.classList.remove('dragging'); d.row.style.transform='';
  const rows=[].filter.call(d.list.querySelectorAll('[data-row]'),r=>r!==d.row);
  rows.forEach(r=>r.classList.remove('drop-before','drop-after'));
  const ids=rows.map(r=>r.getAttribute('data-row'));
  const at=d.before?ids.indexOf(d.before.getAttribute('data-row')):ids.length;
  ids.splice(at,0,d.row.getAttribute('data-row'));
  applyOrder(d.catId,ids);
}

/* ---- Version stamp: the build time, shown as YYYY/MMDD HH:MM in the viewer's own time ---- */
function fmtBuild(id){
  const m=/^(\d{4})(\d{2})(\d{2})(\d{2})(\d{2})(\d{2})?(?!\d)/.exec(id||'');
  if(!m) return 'dev build';
  const d=new Date(Date.UTC(+m[1],+m[2]-1,+m[3],+m[4],+m[5],m[6]?+m[6]:0)), p=n=>String(n).padStart(2,'0');
  return d.getFullYear()+'/'+p(d.getMonth()+1)+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes())+(m[6]?':'+p(d.getSeconds()):'');
}

async function createScorecard(){
  const f=S.form, name=($("fName").value||'').trim(), period=$("fPeriod").value, msg=$("fMsg");
  if(!name){ msg.textContent='Give it a name.'; return; }
  msg.textContent='';
  try{
    let id;
    if(f.type==='copy') id=await run(SB.rpc("sc_copy_template",{p_source:f.src,p_name:name,p_period:period}));
    else{
      const secs=(($("fSecs").value)||'').split(/\n|,/).map(x=>x.trim()).filter(Boolean);
      id=await run(SB.rpc("sc_create_template",{p_name:name,p_period:period,p_sections:secs}));
    }
    S.form=null;
    await refreshData(id);
  }catch(e){ msg.textContent=(e&&e.message)||'Could not create it.'; }
}
async function renameScorecard(id){
  const t=S.templates.find(x=>x.id===id); if(!t) return;
  const n=prompt('Rename this scorecard',t.name); if(n===null||!n.trim()) return;
  try{ await run(SB.rpc("sc_rename_template",{p_id:id,p_name:n.trim()})); await refreshData(null); }catch(e){}
}
async function deleteScorecard(id){
  const t=S.templates.find(x=>x.id===id); if(!t) return;

  try{ await run(SB.rpc("sc_delete_template",{p_id:id})); await refreshData(null); }catch(e){}

let appEntered=false;
async function enterAppSafe(email){
  if(appEntered) return;
  appEntered=true;
  $("loginGate").style.display="none";
  $("appRoot").style.display="";
  $("app").innerHTML='<div class="empty">Loading...</div>';
  try{ await loadAll(); await applyStart(); render(); }
  catch(err){
    console.error("load failed",err);
    $("app").innerHTML='<div class="card"><div class="eyebrow" style="color:var(--alert);margin-bottom:8px">Could not load</div>'
      +'<div style="font-size:calc(15px*var(--z));color:var(--muted)">'+esc(err.message||err)+'</div></div>';
  }
}
function hashParam(h,k){
  const parts=String(h||"").replace("#","").split("&");
  for(const p of parts){ const i=p.indexOf("="); if(i>0&&p.slice(0,i)===k) return decodeURIComponent(p.slice(i+1).split("+").join(" ")); }
  return "";
}
(async function(){
  const gate=$("loginGate"), hash=location.hash||"";
  SB.auth.onAuthStateChange((ev,session)=>{
    if(ev==="PASSWORD_RECOVERY"){ gate.style.display="flex"; setAuthMode("newpass"); return; }
    /* getSession() can transiently return null during a token refresh. If a
       session shows up afterwards, enter rather than stranding the user. */
    if(session&&!appEntered&&authMode!=="newpass"){ enterAppSafe(session.user.email); }
  });
  if(hashParam(hash,"error")||hashParam(hash,"error_code")){
    gate.style.display="flex"; setAuthMode("signin");
    $("loginErr").textContent=hashParam(hash,"error_description")||"That link is invalid or has expired. Please request a new one.";
    history.replaceState(null,"",location.pathname+location.search);
    return;
  }
  if(hashParam(hash,"type")==="recovery"){ gate.style.display="flex"; setAuthMode("newpass"); return; }
  const {data}=await SB.auth.getSession();
  if(data&&data.session){ await enterAppSafe(data.session.user.email); }
  else { gate.style.display="flex"; setAuthMode("signin"); }
})();

if("serviceWorker" in navigator && location.protocol==="https:"){
  window.addEventListener("load",()=>navigator.serviceWorker.register("/sw.js").catch(e=>console.warn("sw",e)));
