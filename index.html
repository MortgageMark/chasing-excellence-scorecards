<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chasing Excellence Scorecards</title>
<meta name="description" content="Recurring self-assessment across the areas that make a whole life.">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#102937">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Scorecards">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Ported from life-balance-scorecard-prototype.html. Palette is spec section 2. */
:root{--z:1;--ink:#102937;--slate:#163347;--raise:#1C4259;--line:#2A4A5E;--bone:#EEF3F3;--muted:#8FA6B3;--accent:#48A0CE;--alert:#E0705F;--track:#3FA88F;--gold:#D9A441;--well:#0C2230;--navbg:rgba(22,33,45,.96);--r:14px}
:root[data-theme=light]{--ink:#F2F5F7;--slate:#FFFFFF;--raise:#E1EAEF;--line:#C8D5DD;--bone:#102937;--muted:#587080;--accent:#1F7FB0;--alert:#C4503F;--track:#2B8A72;--gold:#A87614;--well:#E8EEF2;--navbg:rgba(255,255,255,.96)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{font-size:calc(16px*var(--z));background:var(--ink);color:var(--bone);font-family:Arial,'Helvetica Neue',Helvetica,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;padding:0 0 calc(120px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.wrap{max-width:460px;margin:0 auto;padding:0 18px}
.top{padding-top:env(safe-area-inset-top);position:sticky;top:0;z-index:20;background:rgba(13,22,32,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top-in{max-width:460px;margin:0 auto;padding:14px 18px;display:flex;align-items:center;gap:12px;position:relative}
.hdrtitle{font-family:'League Spartan',system-ui,sans-serif;font-weight:600;font-size:calc(21px*var(--z));line-height:1.1;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#homeLink{display:block;line-height:0;flex:none}#homeLink img{display:block;height:40px;width:auto}
.brandmark{font-family:'League Spartan',system-ui;font-weight:600;font-size:calc(15px*var(--z));letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.brandsub{font-size:calc(13px*var(--z));color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
.top-sp{flex:1}
.iconbtn{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);display:grid;place-items:center;color:var(--muted);font-size:calc(16.5px*var(--z))}
.iconbtn:hover{color:var(--bone);border-color:var(--muted)}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--accent);color:var(--ink);font-weight:800;font-size:calc(16.5px*var(--z));display:grid;place-items:center;text-transform:uppercase;flex:none}
.menu{position:absolute;right:14px;top:60px;width:270px;max-width:calc(100vw - 28px);background:var(--slate);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.45);padding:6px;z-index:40}
.menu .who{padding:10px 12px;font-size:calc(13.5px*var(--z));color:var(--muted);border-bottom:1px solid var(--line);margin-bottom:4px;word-break:break-all}
.menu button{display:block;width:100%;text-align:left;padding:14px 14px;border-radius:8px;font-size:calc(15.5px*var(--z));color:var(--bone)}
.menu button:hover{background:var(--raise)}
.menu button.danger{color:var(--alert)}
.menu .ver{margin-top:4px;padding:10px 14px 6px;border-top:1px solid var(--line);font-size:calc(12px*var(--z));color:var(--muted);font-variant-numeric:tabular-nums}
.overlay{position:fixed;inset:0;background:rgba(5,10,16,.72);z-index:60;display:flex;align-items:flex-start;justify-content:center;padding:calc(40px + env(safe-area-inset-top)) 16px 40px;overflow:auto}
.modal{background:var(--slate);border:1px solid var(--line);border-radius:14px;width:100%;max-width:440px;padding:20px}
.modal h2{font-family:'League Spartan',system-ui;font-weight:600;font-size:calc(20px*var(--z));margin:0 0 14px}
.modal label{display:block;font-size:calc(13px*var(--z));letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:14px 0 6px}
.modal input,.modal select,.modal textarea,.formfld{width:100%;background:var(--ink);border:1px solid var(--line);border-radius:9px;padding:11px 12px;color:var(--bone);font:inherit;font-size:calc(15.5px*var(--z))}
.modal .row{display:flex;gap:8px;margin-top:16px}
.modal .row button{flex:1;padding:12px;border-radius:10px;font-weight:600;font-size:calc(15.5px*var(--z));background:var(--ink);border:1px solid var(--line);color:var(--bone)}
.modal .row button.primary{background:var(--accent);color:var(--ink);border-color:var(--accent)}
.todcol{margin:6px 0 12px}.todcol>span{display:block;font-size:calc(14px*var(--z));margin-bottom:6px}.todcol>div{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:34px;height:34px;border-radius:50%;border:2px solid transparent}.sw.on{border-color:var(--bone)}
.modal .msg{font-size:calc(13.5px*var(--z));color:var(--muted);margin-top:8px;min-height:16px}
.cardact{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.h1{font-family:'League Spartan',system-ui;font-weight:600;font-size:calc(30px*var(--z));line-height:1.05;letter-spacing:0;margin:26px 0 4px}
.sub{color:var(--muted);font-size:calc(15px*var(--z));margin-bottom:22px}
.eyebrow{font-size:calc(12px*var(--z));letter-spacing:.2em;text-transform:uppercase;color:var(--gold);font-weight:700}
.card{background:var(--slate);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px;width:100%;text-align:left;display:block}
.pill{font-size:calc(12px*var(--z));letter-spacing:.1em;text-transform:uppercase;font-weight:600;padding:4px 9px;border-radius:100px}
.pill.due{background:rgba(72,160,206,.14);color:var(--accent)}
.bottomnav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom));width:min(440px,calc(100% - 20px));z-index:30;display:flex;gap:2px;background:var(--navbg);backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:26px;padding:6px;box-shadow:0 10px 34px rgba(0,0,0,.5)}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px 7px;border-radius:20px;color:var(--muted);font-size:calc(11px*var(--z));font-weight:500}
.nb.on{background:var(--raise);color:var(--accent)}
.nb svg{display:block}
.daystrip{margin:6px -18px 2px}
.daystrip .days{display:flex;overflow-x:auto;scroll-snap-type:x proximity;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding:0 12px}
.daystrip .days::-webkit-scrollbar{display:none}
.wkarrow{width:30px;height:48px;color:var(--muted);font-size:calc(24px*var(--z));flex:none}
.wkarrow:disabled{opacity:.25}
.dcell{flex:0 0 54px;display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 3px 7px;border-radius:24px;scroll-snap-align:center}
.dcell.fut{opacity:.65}
.dcell.sel{background:var(--raise);outline:1px solid var(--line)}
.dcell .dl{font-size:calc(13px*var(--z));color:var(--muted)}
.dcell .dc{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:calc(15px*var(--z));font-weight:600;border:2px solid var(--line);color:var(--bone)}
.dcell .dc.full{background:var(--accent);border-color:var(--accent);color:var(--ink)}
.dcell .dc.part{border-color:transparent;background:radial-gradient(circle,var(--ink) 57%,transparent 60%),conic-gradient(var(--accent) calc(var(--p)*1%),var(--line) 0)}
.dcell .dc.miss{border-color:var(--alert);color:var(--alert)}
.dcell .dc.zero{border-color:var(--muted)}
.daylabel{display:flex;align-items:center;gap:10px;margin:8px 2px 16px;font-size:calc(15px*var(--z));font-weight:600}
.dayprog{margin-left:auto;color:var(--muted);font-weight:500;font-size:calc(14px*var(--z))}
.todhead{display:flex;justify-content:space-between;align-items:center;border:1px solid;border-radius:12px;padding:11px 14px;margin:18px 0 8px;font-weight:600;font-size:calc(15px*var(--z))}
.todhead b{font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:2px;background:var(--slate);border:1px solid var(--line);border-radius:11px;padding:3px;margin:18px 0 22px}
.tab{flex:1;padding:13px 2px;border-radius:8px;font-size:calc(13px*var(--z));font-weight:500;color:var(--muted);transition:.14s;white-space:nowrap}
.tab.on{background:var(--raise);color:var(--bone)}
.monthbar{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.monthbar .mlbl{flex:1;text-align:center;font-family:'League Spartan',system-ui;font-weight:600;font-size:calc(16.5px*var(--z))}
.monthbar button{width:46px;height:42px;border:1px solid var(--line);border-radius:8px;color:var(--muted)}
.monthbar button:hover:not(:disabled){color:var(--bone);border-color:var(--muted)}
.monthbar button:disabled{opacity:.3;cursor:default}
.catblock{margin-bottom:26px}
.cathead{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
.catname{font-family:'League Spartan',system-ui;font-weight:600;font-size:calc(17px*var(--z));flex:1}
.catpct{font-family:'League Spartan',system-ui;font-weight:600;font-size:calc(17px*var(--z));font-variant-numeric:tabular-nums}
.catmeta{font-size:calc(13px*var(--z));color:var(--muted);margin-bottom:10px}
.bar{height:3px;background:var(--line);border-radius:2px;overflow:hidden;margin-bottom:12px}
.bar span{display:block;height:100%;background:var(--accent);transition:width .35s cubic-bezier(.4,0,.2,1)}
.item{display:flex;align-items:center;gap:12px;padding:16px 14px;border-radius:14px;width:100%;text-align:left;background:var(--slate)}
.swrow{position:relative;border-radius:14px;overflow:hidden;margin-bottom:8px}
.swbg{position:absolute;inset:0;display:flex;align-items:center;opacity:0;font-weight:600;font-size:calc(15px*var(--z));color:#fff}
.swbg.r{background:var(--track);justify-content:flex-start;padding-left:20px}
.swbg.l{background:#5E7482;justify-content:flex-end;padding-right:20px}
.swrow.dr .swbg.r,.swrow.dl .swbg.l{opacity:1}
.swrow .item{position:relative;z-index:1;touch-action:pan-y;user-select:none;-webkit-user-select:none;transition:transform .18s ease}
.swrow .item.dragging{transition:none}
.item .ilabel .sub{display:block;font-size:calc(13px*var(--z));color:var(--muted);margin-top:3px;text-decoration:none}
.st{flex:none;width:32px;height:32px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:calc(16px*var(--z));font-weight:700}
.st.on{background:var(--accent);border-color:var(--accent);color:var(--ink)}
.st.nap{border-style:dashed;font-size:calc(10.5px*var(--z));font-weight:600;color:var(--muted)}
.sheet{position:fixed;inset:0;z-index:70;background:var(--ink);flex-direction:column}
.sheethead{display:flex;align-items:center;gap:12px;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;flex:none}
.sheetx{width:48px;height:48px;border-radius:50%;background:var(--slate);color:var(--bone);font-size:calc(20px*var(--z));flex:none}
.sheettitle{flex:1;text-align:center;font-family:'League Spartan',system-ui,sans-serif;font-weight:600;font-size:calc(19px*var(--z));padding-right:48px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheetbody{flex:1;overflow-y:auto;padding:6px 16px calc(110px + env(safe-area-inset-bottom));max-width:480px;width:100%;margin:0 auto}
.sheetcard{background:var(--slate);border-radius:20px;padding:4px 16px;margin-bottom:14px}
.srow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.srow:last-child{border-bottom:0}
.sk{font-weight:600;font-size:calc(16px*var(--z))}
.sv2{display:flex;justify-content:flex-end;flex-wrap:wrap;gap:6px;min-width:0}
.nameline{gap:14px}
.isub{display:block;font-size:calc(13px*var(--z));color:var(--muted);font-weight:400;margin-top:3px}
.ilabel{cursor:pointer}
.addplus{flex:none;width:38px;height:38px;border-radius:50%;background:var(--accent);color:var(--ink);font-size:26px;font-weight:600;line-height:1;display:grid;place-items:center}
.itop{display:flex;gap:10px;align-items:center}
.itop select{flex:1;min-width:0;padding:9px 10px;font-size:calc(14px*var(--z))}
.itop2{display:flex;gap:8px;margin:8px 0 0;flex-wrap:wrap}
.chip{padding:7px 12px;border-radius:100px;border:1px solid var(--line);background:var(--well);color:var(--muted);font-size:calc(13px*var(--z));font-weight:600}
.chip.on{background:rgba(72,160,206,.16);border-color:var(--accent);color:var(--accent)}
.iconbtn2{flex:none;width:64px;height:64px;border-radius:16px;border:1.5px dashed var(--gold);font-size:34px;display:grid;place-items:center;background:transparent}
.sheetname{flex:1;min-width:0;background:transparent;border:0;border-bottom:1px solid var(--line);color:var(--bone);font:inherit;font-size:calc(18px*var(--z));font-weight:600;padding:8px 0}
.swrow2{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;max-width:230px}
.swrow2 .sw{width:30px;height:30px}
.swrow2 .sw.auto{background:transparent;border:1.5px dashed var(--muted);color:var(--muted);font-size:13px;font-weight:700}
.tpills{display:flex;flex-wrap:wrap;gap:8px;padding:0 0 14px}
.tp{padding:11px 16px;border-radius:999px;background:var(--ink);border:1px solid var(--line);color:var(--muted);font-size:calc(15px*var(--z));font-weight:500}
.tp.on{background:var(--gold);border-color:var(--gold);color:var(--ink);font-weight:700}
.sheetfoot{position:absolute;left:0;right:0;bottom:0;padding:14px 16px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(rgba(16,41,55,0),var(--ink) 35%);display:flex;justify-content:center}
.sheetfoot button{width:min(300px,100%);padding:16px;border-radius:999px;background:var(--gold);color:var(--ink);font-weight:700;font-size:calc(17px*var(--z))}
.catfold{width:100%;text-align:left;align-items:center;gap:10px;padding:8px 0;color:inherit}
.catfold .chev{flex:none;width:18px;color:var(--muted);font-size:calc(16px*var(--z))}
.pills{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0 18px}
.pills::-webkit-scrollbar{display:none}
.pl{flex:none;padding:10px 16px;border-radius:999px;border:1px solid var(--line);color:var(--muted);font-size:calc(14px*var(--z));font-weight:500;white-space:nowrap}
.pl.on{background:var(--raise);color:var(--bone);border-color:var(--accent)}
.plsep{flex:none;width:1px;background:var(--line);margin:4px 2px}
.hidenote{display:block;width:100%;text-align:center;color:var(--muted);padding:16px;font-size:calc(14px*var(--z))}
.allclear{color:var(--muted);padding:4px 4px 12px;font-size:calc(14px*var(--z))}
.item:hover{background:var(--slate)}
.item.na{opacity:.5;cursor:default}.item.na:hover{background:none}
.box{width:24px;height:24px;flex:none;margin-top:1px;border:1.5px solid var(--line);border-radius:5px;display:grid;place-items:center;font-size:calc(13px*var(--z));color:var(--ink);transition:.14s}
.item.on .box{background:var(--accent);border-color:var(--accent)}
.item.na .box{border-style:dashed}
.ilabel{font-size:calc(15.5px*var(--z));line-height:1.35;flex:1;min-width:0}
.item.on .ilabel{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.freq{font-size:calc(12px*var(--z));letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);padding:3px 8px;border-radius:5px;flex:none;margin-top:1px}
.wheelwrap{background:var(--slate);border:1px solid var(--line);border-radius:var(--r);padding:20px 12px 12px;margin-bottom:16px}
.scoreline{text-align:center;margin-bottom:6px}
.scoreline .n{font-family:'League Spartan',system-ui;font-weight:600;font-size:calc(56px*var(--z));line-height:1;letter-spacing:0;font-variant-numeric:tabular-nums}
.scoreline .d{font-size:calc(15px*var(--z));color:var(--muted);margin-top:2px}
.scoreline .c{font-size:calc(13.5px*var(--z));color:var(--accent);margin-top:5px;font-variant-numeric:tabular-nums}
.legend{display:flex;justify-content:center;gap:16px;font-size:calc(13px*var(--z));color:var(--muted);margin-top:4px}
.legend i{display:inline-block;width:14px;height:2px;vertical-align:middle;margin-right:5px}
.catlist{background:var(--slate);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.catrow{display:flex;align-items:center;gap:11px;padding:12px 15px;border-bottom:1px solid var(--line)}
.catrow:last-child{border-bottom:none}
.catrow .nm{flex:1;font-size:calc(15.5px*var(--z))}
.catrow .ct{font-size:calc(13px*var(--z));color:var(--muted);font-variant-numeric:tabular-nums;width:42px;text-align:right}
.catrow .tr{width:52px;height:3px;background:var(--line);border-radius:2px;overflow:hidden}
.catrow .tr span{display:block;height:100%;background:var(--accent)}
.catrow .vl{font-family:'League Spartan',system-ui;font-weight:600;font-size:calc(16.5px*var(--z));width:34px;text-align:right;font-variant-numeric:tabular-nums}
.low .vl{color:var(--alert)}.low .tr span{background:var(--alert)}
.histcard{background:var(--slate);border:1px solid var(--line);border-radius:var(--r);padding:18px 16px;margin-bottom:14px}
.hrow{display:flex;align-items:center;gap:12px;padding:9px 0}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
/* ---- History: grid tracker + month calendar ---- */
.wrap.wide{max-width:1100px}
.hseg{display:flex;gap:6px;margin-bottom:14px}
.hseg button{flex:1;padding:11px 4px;border-radius:9px;font-size:calc(14.5px*var(--z));font-weight:600;color:var(--muted);background:var(--well);border:1px solid var(--line)}
.hseg button.on{background:rgba(72,160,206,.16);border-color:var(--accent);color:var(--accent)}
.gnav{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.gnav .gt{flex:1;text-align:center;font-family:'League Spartan',system-ui,sans-serif;font-weight:600;font-size:calc(19px*var(--z))}
.gtools{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.gtools button{padding:8px 12px;border-radius:9px;font-size:calc(13.5px*var(--z));font-weight:600;color:var(--muted);background:var(--well);border:1px solid var(--line)}
.gtools button.on{background:rgba(72,160,206,.16);border-color:var(--accent);color:var(--accent)}
.gridscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);border-radius:12px;background:var(--slate)}
table.grid{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
.grid th,.grid td{border:1px solid var(--line);text-align:center;padding:0;font-size:calc(12.5px*var(--z))}
.grid th{background:var(--raise);color:var(--muted);font-weight:600;padding:5px 2px;min-width:30px;line-height:1.15}
.grid th small{display:block;font-size:.85em;font-weight:400}
.dayrow{display:flex;gap:6px;margin-top:8px}
.dayb{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--well);color:var(--muted);font-weight:700;font-size:calc(14px*var(--z))}
.dayb.on{background:var(--accent);border-color:var(--accent);color:var(--ink)}
.grid th.today{color:var(--gold)}
.grid td.nm{text-align:left;padding:7px 8px;min-width:128px;max-width:170px;position:sticky;left:0;background:var(--slate);z-index:2;font-size:calc(13.5px*var(--z))}
.grid th.nm{position:sticky;left:0;z-index:3;text-align:left;padding-left:8px}
.grid tr.cat td{background:var(--raise);color:var(--gold);font-size:calc(11.5px*var(--z));letter-spacing:.12em;text-transform:uppercase;font-weight:700;text-align:left;padding:5px 8px;position:static}
.grid td.c{height:34px;min-width:30px;cursor:pointer;color:var(--ink);font-weight:800}
.grid td.c.on{background:var(--track)}
.grid td.c.na{background:var(--well);color:var(--muted);font-weight:600;font-size:calc(10px*var(--z))}
.grid td.c.fut{opacity:.35;cursor:default}
.grid td.c.off{color:var(--line);cursor:default;background:var(--well)}
.grid td.tot,.grid th.tot{background:var(--raise);color:var(--bone);font-weight:700;min-width:44px;padding:0 4px}
.grid tr.sum td{background:var(--raise);font-weight:700;color:var(--bone);height:30px}
.gsum{margin-top:14px}
.printonly{display:none}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dh{text-align:center;font-size:calc(11.5px*var(--z));letter-spacing:.1em;color:var(--muted);text-transform:uppercase;padding-bottom:2px}
.cal button.d{aspect-ratio:1/1;border-radius:9px;border:1px solid var(--line);background:var(--slate);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:calc(14px*var(--z));line-height:1}
.cal button.d small{font-size:calc(10.5px*var(--z));color:var(--muted);font-weight:600}
.cal button.d.g{background:rgba(63,168,143,.30);border-color:rgba(63,168,143,.7)}
.cal button.d.b{background:rgba(72,160,206,.22);border-color:rgba(72,160,206,.6)}
.cal button.d.r{background:rgba(224,112,95,.22);border-color:rgba(224,112,95,.6)}
.cal button.d.p{box-shadow:inset 0 0 0 2px var(--gold)}
.cal button.d.dim{opacity:.35}
.cal button.d.sel{outline:2px solid var(--accent)}
.cal .blank{visibility:hidden}
.calmon{grid-template-columns:repeat(3,1fr)}
.calmon button.d{aspect-ratio:auto;padding:16px 4px;font-size:calc(15px*var(--z))}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:calc(12px*var(--z));color:var(--muted);margin-top:12px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
@media print{
  @page{size:landscape;margin:10mm}
  html,body{background:#fff!important;color:#000!important;padding:0!important}
  .top,.bottomnav,#saving,.noprint,.footer{display:none!important}
  .wrap{max-width:none!important;padding:0!important}
  .printonly{display:block;margin-bottom:8px;font-size:14pt;font-weight:700;color:#000}
  .gridscroll{overflow:visible;border:none;background:#fff}
  table.grid{font-size:9pt}
  .grid th,.grid td{border:1px solid #444!important;color:#000!important;background:#fff!important}
  .grid th,.grid tr.cat td,.grid td.tot,.grid tr.sum td{background:#e6e6e6!important}
  .grid td.nm{position:static;max-width:none}
  .grid th.nm{position:static}
  .grid td.c{height:24px}
  .grid td.c.on{background:#bfe6d8!important}
  .grid td.c.na{background:#f0f0f0!important}
  .grid td.c.fut{opacity:1}
  .gsum .stat{border:1px solid #444;background:#fff}
  .gsum .stat *{color:#000!important}
}

.mcard{background:var(--slate);border:1px solid var(--line);border-radius:12px;padding:12px 8px 8px;text-align:center}
.mcard.cur{border-color:rgba(72,160,206,.45)}
.mcard .mn{font-size:calc(13px*var(--z));letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.mcard .ms{font-family:'League Spartan',system-ui;font-weight:600;font-size:calc(24px*var(--z));line-height:1;margin-top:3px;font-variant-numeric:tabular-nums}
.mcard .mc{font-size:calc(12px*var(--z));color:var(--muted);margin-bottom:4px;font-variant-numeric:tabular-nums}
.selrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px 9px;padding:12px 10px;border-radius:10px;background:var(--ink)}
.schedsum{flex:0 0 100%;text-align:left;padding:9px 0 5px !important;font-size:calc(13px*var(--z));color:var(--muted);padding:2px 0 0 0;line-height:1.4}
.schedsum span{color:var(--accent);margin-left:4px}
.sched{flex:0 0 100%;display:grid;grid-template-columns:96px 1fr;gap:14px 10px;align-items:center;padding:8px 0 4px;border-top:1px solid var(--line);margin-top:4px}
.ico{font-size:calc(22px*var(--z));line-height:1.1;flex:none;width:32px;text-align:center}
.iconpick{grid-column:1/3;display:flex;flex-wrap:wrap;gap:6px;padding:4px 0}
.iconpick button{width:46px;height:46px;border:1px solid var(--line);border-radius:10px;font-size:24px;background:var(--ink)}
.iconpick button.none{width:auto;padding:0 14px;font-size:calc(14px*var(--z));color:var(--muted)}
.sched .k{font-size:calc(12px*var(--z));letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.selrow:hover{background:var(--slate)}
.tog{width:48px;height:28px;border-radius:100px;background:var(--line);flex:none;position:relative;transition:.18s;cursor:pointer}
.tog::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--muted);transition:.18s}
.selrow.on .tog{background:rgba(72,160,206,.3)}
.selrow.on .tog::after{transform:translateX(20px);background:var(--accent)}
.grip.dim{opacity:.55}
.grip{flex:none;width:34px;padding:8px 0;text-align:center;color:var(--muted);font-size:calc(18px*var(--z));line-height:1;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.mv{flex:none;display:flex;flex-direction:column;gap:2px}
.mv button{width:34px;height:20px;border:1px solid var(--line);border-radius:4px;color:var(--muted);font-size:calc(12px*var(--z));line-height:1;display:grid;place-items:center;padding:0}
.mv button:disabled{opacity:.3}
.selrow.dragging{opacity:.8;background:var(--raise);outline:1px solid var(--accent);position:relative;z-index:5;box-shadow:0 6px 18px rgba(0,0,0,.4)}
.selrow.drop-before{box-shadow:0 -2px 0 var(--accent)}
.selrow.drop-after{box-shadow:0 2px 0 var(--accent)}
.gtog{width:44px;height:26px;border-radius:100px;background:var(--line);flex:none;position:relative;transition:.18s;cursor:pointer}
.gtog::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--muted);transition:.18s}
.gtog.on{background:rgba(217,164,65,.3)}
.gtog.on::after{transform:translateX(18px);background:var(--gold)}
.fsel{min-height:42px;background:var(--ink);border:1px solid var(--line);border-radius:9px;color:var(--muted);font:inherit;font-size:calc(12px*var(--z));padding:8px 8px;flex:none;width:auto;cursor:pointer}
.selrow.on .fsel{color:var(--bone)}
.trkbtn{flex:none;width:42px;height:40px;border:1px solid var(--line);border-radius:7px;font-size:calc(13px*var(--z));color:var(--muted);display:grid;place-items:center}
.addwrap{display:flex;gap:7px;margin:10px 0 4px}
.addwrap input{flex:1;background:var(--ink);border:1px solid var(--line);border-radius:9px;padding:14px 12px;color:var(--bone);font:inherit;font-size:calc(15px*var(--z));min-width:0}
.addwrap select{flex:none;width:96px;background:var(--ink);border:1px solid var(--line);border-radius:9px;color:var(--bone);font:inherit;font-size:calc(13.5px*var(--z));padding:0 5px}
.addwrap button{background:var(--accent);color:var(--ink);font-weight:600;padding:0 18px;border-radius:9px;font-size:calc(15px*var(--z))}
.custom-tag{font-size:calc(12px*var(--z));letter-spacing:.08em;text-transform:uppercase;color:var(--accent);border:1px solid rgba(72,160,206,.35);padding:2px 5px;border-radius:4px;margin-left:6px}
.note{background:rgba(72,160,206,.07);border:1px solid rgba(72,160,206,.22);border-radius:11px;padding:13px 15px;font-size:calc(13.5px*var(--z));color:var(--muted);line-height:1.5;margin-bottom:18px}
.note b{color:var(--accent);font-weight:600}
.empty{text-align:center;color:var(--muted);font-size:calc(15px*var(--z));padding:30px 20px;line-height:1.6}
.seg{display:flex;gap:7px;margin-top:12px}
.seg button{flex:1;padding:15px 4px;border-radius:9px;font-size:calc(15px*var(--z));font-weight:500;color:var(--muted);background:var(--well);border:1px solid var(--line);transition:.14s}
.seg button:hover{color:var(--bone);border-color:#3E6178}
.seg button.on{background:rgba(72,160,206,.16);border-color:var(--accent);color:var(--accent);font-weight:600}
.seglbl{font-size:calc(12px*var(--z));letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-top:22px}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.stat{background:var(--slate);border:1px solid var(--line);border-radius:12px;padding:13px 14px}
.stat .sl{font-size:calc(12px*var(--z));letter-spacing:.13em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:6px}
.stat .sv{font-family:'League Spartan',system-ui;font-weight:600;font-size:calc(24px*var(--z));line-height:1.1;font-variant-numeric:tabular-nums}
.stat .sm{display:block;font-family:Arial,Helvetica,sans-serif;font-weight:400;font-size:calc(13px*var(--z));color:var(--muted);margin-top:3px}
.ctrend{background:var(--slate);border:1px solid var(--line);border-radius:12px;padding:14px 14px 11px;margin-bottom:10px}
.cth{display:flex;align-items:baseline;gap:10px;margin-bottom:2px}
.ctn{font-family:'League Spartan',system-ui;font-weight:600;font-size:calc(16.5px*var(--z));flex:1}
.ctd{font-size:calc(13px*var(--z));color:var(--muted)}
.ctv{font-family:'League Spartan',system-ui;font-weight:600;font-size:calc(19px*var(--z));font-variant-numeric:tabular-nums}
.ctc{margin:2px -4px 0}
.ctvals{display:flex;justify-content:space-between;gap:2px;margin-top:2px}
.ctvals span{flex:1;text-align:center;font-size:calc(12px*var(--z));color:var(--muted);font-variant-numeric:tabular-nums}
.ctvals span b{display:block;font-size:calc(12px*var(--z));letter-spacing:.08em;text-transform:uppercase;font-weight:600;opacity:.7;margin-bottom:1px}
.ctvals span.now{color:var(--bone)}
.ctfoot{font-size:calc(13px*var(--z));color:var(--muted);margin-top:9px;padding-top:9px;border-top:1px solid var(--line)}
.pickrow{display:flex;gap:7px;margin:-2px 0 10px}
.pick{padding:11px 16px !important;font-size:calc(13px*var(--z));color:var(--muted);border:1px solid var(--line);border-radius:7px;padding:5px 11px;background:var(--well);transition:.14s}
.pick:hover:not(:disabled){color:var(--accent);border-color:var(--accent)}
.pick:disabled{opacity:.32;cursor:default}
.resetbtn{width:100%;margin-top:14px;padding:16px;border:1px solid var(--line);border-radius:11px;color:var(--muted);font-size:calc(15px*var(--z));background:var(--well);transition:.14s}
.resetbtn:hover{color:var(--alert);border-color:var(--alert)}
.renameinp{flex:1;background:var(--well);border:1px solid var(--accent);border-radius:8px;padding:8px 10px;color:var(--bone);font:inherit;font-size:calc(15.5px*var(--z));min-width:0}
.bigbtn{width:100%;padding:18px;border-radius:11px;background:var(--accent);color:var(--ink);font-weight:600;font-size:calc(16.5px*var(--z))}
.bigbtn:disabled{opacity:.55;cursor:default}
#saving{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;z-index:60;background:var(--raise);border:1px solid var(--line);border-radius:100px;padding:8px 16px;font-size:calc(13.5px*var(--z));color:var(--muted);display:none}
#saving.err{color:var(--alert);border-color:var(--alert)}
.login{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:20px;background:var(--ink);z-index:50}
.login .box{width:100%;max-width:380px;background:var(--slate);border:1px solid var(--line);border-radius:16px;padding:28px}
.login h1{font-family:'League Spartan',system-ui;font-weight:600;font-size:calc(20px*var(--z));letter-spacing:0}
.login .brand{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.login .logo{width:44px;height:44px;flex:0 0 auto}
.login p{margin:0 0 20px;color:var(--muted);font-size:calc(15px*var(--z))}
label{display:block;font-size:calc(13.5px*var(--z));color:var(--muted);margin:0 0 6px}
.login input{width:100%;padding:11px 12px;background:var(--ink);color:var(--bone);border:1px solid var(--line);border-radius:10px;font-size:calc(17px*var(--z));font-family:inherit}
.login input:focus{outline:none;border-color:var(--accent)}
#emailWrap,#passWrap,#pass2Wrap{margin-bottom:14px}
.btn{padding:11px 16px;border-radius:10px;border:1px solid var(--line);background:var(--slate);color:var(--bone);font-size:calc(15.5px*var(--z))}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--ink);font-weight:600}
.btn:disabled{opacity:.6;cursor:default}
.err{color:var(--alert);font-size:calc(15px*var(--z));margin-top:10px;min-height:18px}
.ok{color:var(--track);font-size:calc(15px*var(--z));margin-top:10px;min-height:18px}
.authlinks{display:flex;justify-content:space-between;margin-top:16px;font-size:calc(15px*var(--z))}
.authlinks a{color:var(--accent);text-decoration:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<body>

<!-- ================= LOGIN GATE ================= -->
<div class="login" id="loginGate">
  <div class="box">
    <div class="brand"><img class="logo" src="/ce-mark-blue.png" alt="Chasing Excellence"><h1>Scorecards</h1></div>
    <p id="authSub">Sign in to track your scorecards across every device.</p>
    <div id="emailWrap"><label>Email</label>
      <input id="loginEmail" type="email" autocomplete="username" placeholder="you@example.com"></div>
    <div id="passWrap"><label id="passLabel">Password</label>
      <input id="loginPass" type="password" autocomplete="current-password" placeholder="••••••••"></div>
    <div id="pass2Wrap" style="display:none"><label id="pass2Label">Confirm password</label>
      <input id="loginPass2" type="password" autocomplete="new-password" placeholder="••••••••"></div>
    <button class="btn pri" id="loginBtn" style="width:100%;margin-top:20px">Sign in</button>
    <div class="err" id="loginErr"></div>
    <div class="ok" id="loginOk"></div>
    <div class="authlinks">
      <a href="#" id="forgotLink">Forgot password?</a>
      <a href="#" id="modeLink">Create account</a>
    </div>
    <p style="font-size:calc(13px*var(--z));color:var(--muted);margin:18px 0 0">
      Same account as Daily Time Tracker. Different site, so you sign in once here too.</p>
  </div>
</div>

<!-- ================= APP ================= -->
<div id="appRoot" style="display:none">
  <div class="top"><div class="top-in">
    <a href="/" id="homeLink" title="All scorecards"><img src="/ce-mark-blue.png" alt="Chasing Excellence" width="40" height="40"></a>
    <div class="hdrtitle" id="hdrTitle">Scorecards</div>
  </div></div>
  <div class="wrap" id="app"></div>
  <nav class="bottomnav" id="bottomNav" style="display:none"></nav>
  <div class="sheet" id="sheet" style="display:none"></div>
</div>
<div id="saving"></div>

let authMode="signin";
const AUTH_UI={
  signin :{sub:"Sign in to track your scorecards across every device.",btn:"Sign in",         passLabel:"Password",    email:true, pass:true, pass2:false,forgot:"Forgot password?",mode:"Create account"},
  signup :{sub:"Create an account to start your first scorecard.",     btn:"Create account",  passLabel:"Password",    email:true, pass:true, pass2:true, forgot:"",                mode:"Back to sign in"},
  reset  :{sub:"Enter your email and we will send you a reset link.",  btn:"Send reset link", passLabel:"Password",    email:true, pass:false,pass2:false,forgot:"",                mode:"Back to sign in"},
  newpass:{sub:"Choose a new password for your account.",              btn:"Update password", passLabel:"New password",email:false,pass:true, pass2:true, forgot:"",                mode:""}
};
function setAuthMode(m){
  authMode=m; const u=AUTH_UI[m]; if(!u) return;
  const show=(id,on)=>{const el=$(id); if(el) el.style.display=on?"":"none";};
  $("authSub").textContent=u.sub; $("loginBtn").textContent=u.btn; $("loginBtn").disabled=false;
  $("passLabel").textContent=u.passLabel;
  show("emailWrap",u.email); show("passWrap",u.pass); show("pass2Wrap",u.pass2);
  const fl=$("forgotLink"); fl.textContent=u.forgot; show("forgotLink",!!u.forgot);
  const ml=$("modeLink");   ml.textContent=u.mode;   show("modeLink",!!u.mode);
  $("loginErr").textContent=""; $("loginOk").textContent="";
  $("loginPass").setAttribute("autocomplete",m==="signin"?"current-password":"new-password");
  if(!u.pass)  $("loginPass").value="";
  if(!u.pass2) $("loginPass2").value="";
}
async function doAuth(){
  const btn=$("loginBtn"), err=$("loginErr"), ok=$("loginOk");
  const email=$("loginEmail").value.trim(), pass=$("loginPass").value, pass2=$("loginPass2").value;
  const restore=AUTH_UI[authMode].btn;
  err.textContent=""; ok.textContent="";
  const fail=m=>{err.textContent=m; btn.textContent=restore; btn.disabled=false;};
  if(btn.disabled) return;
  btn.disabled=true;
  try{
    if(authMode==="signin"){
      if(!email||!pass) return fail("Enter your email and password.");
      btn.textContent="Signing in...";
      const {data,error}=await SB.auth.signInWithPassword({email,password:pass});
      if(error) return fail(error.message);
      await enterAppSafe(data.user.email); return;
    }
    if(authMode==="signup"){
      if(!email) return fail("Enter your email.");
      if(pass.length<6) return fail("Password must be at least 6 characters.");
      if(pass!==pass2) return fail("Those passwords do not match.");
      btn.textContent="Creating account...";
      const {data,error}=await SB.auth.signUp({email,password:pass,options:{emailRedirectTo:location.origin}});
      if(error) return fail(error.message);
      if(data&&data.session){ await enterAppSafe(data.user.email); return; }
      ok.textContent="Account created. Check "+email+" for a confirmation link, then sign in.";
      btn.textContent=restore; btn.disabled=false; return;
    }
    if(authMode==="reset"){
      if(!email) return fail("Enter your email.");
      btn.textContent="Sending...";
      const {error}=await SB.auth.resetPasswordForEmail(email,{redirectTo:location.origin});
      if(error) return fail(error.message);
      ok.textContent="If an account exists for "+email+", a reset link is on its way.";
      btn.textContent=restore; btn.disabled=false; return;
    }
    if(authMode==="newpass"){
      if(pass.length<6) return fail("Password must be at least 6 characters.");
      if(pass!==pass2) return fail("Those passwords do not match.");
      btn.textContent="Updating...";
      const {error}=await SB.auth.updateUser({password:pass});
      if(error) return fail(error.message);
      history.replaceState(null,"",location.pathname+location.search);
      const {data}=await SB.auth.getSession();
      if(data&&data.session){ await enterAppSafe(data.session.user.email); return; }
      ok.textContent="Password updated. Sign in with your new password.";
      btn.disabled=false; setTimeout(()=>setAuthMode("signin"),1400); return;
    }
  }catch(ex){ return fail((ex&&ex.message)||"Something went wrong. Please try again."); }
}
$("loginBtn").addEventListener("click",doAuth);

});

/* ===================================================================
   DUE CYCLES - generalised from the prototype.

   The prototype hardcoded the closing months (quarterly Mar/Jun/Sep/Dec,
   semiannual Jun/Dec, annual Dec), which is the December pile-up spec
   section 4 says to avoid. Here each long-cycle item carries its own
   target_month and the rule falls out of it. With target_month = 12 this
   is byte-for-byte the prototype's behaviour.
   =================================================================== */
function isDue(freq,month0,targetMonth){
  if(freq==='d'||freq==='w'||freq==='m') return true;
  const p=PERIOD[freq]; if(!p) return true;
  const t=(targetMonth||12)-1;
  return ((month0-t)%p+p)%p===0;
}
/* Spread long-cycle items across the year instead of stacking them in
   December. Deterministic: same list in, same months out. */
function spreadTargetMonth(freq,idx){
  const p=PERIOD[freq]; if(!p) return null;
  return (idx%p)+1;
}

const liveItems=()=>S.items.filter(i=>!i.removed_at);
function catItems(catId){
  const list=liveItems().filter(i=>i.category_id===catId);
  const az=(a,b)=>label(a).localeCompare(label(b));
  if(S.sortMode==='az')     return list.slice().sort(az);
  if(S.sortMode==='manual') return list.slice().sort((a,b)=>a.sort_order-b.sort_order||az(a,b));
  if(S.sortMode==='active') return list.slice().sort((a,b)=>(b.is_selected?1:0)-(a.is_selected?1:0)||a.sort_order-b.sort_order||az(a,b));
  if(S.sortMode==='tod'){ const t=i=>{ const k=TODS.findIndex(x=>x[0]===todOf(i)); return k<0?9:k; }; return list.slice().sort((a,b)=>t(a)-t(b)||a.sort_order-b.sort_order||az(a,b)); }
  return list.slice().sort((a,b)=>FO[a.freq]-FO[b.freq]||az(a,b));
}

/* ===================================================================
   PERIODS. Monthly templates (Life Balance) score one month at a time.
   A weekly template (check_in_period = 'weekly') scores one Monday-to-Sunday
   week at a time. Its daily/weekly items are the score. Monthly, quarterly,
   6-month and yearly items sit in their own optional section: they are
   ticked against their own period, any time during it, and in the first-
   Friday week of a period the app asks about the one that just ended.
   =================================================================== */
/* check_in_period: 'monthly' (0-10 scores, one entry per month), 'weekly' or 'daily'. Weekly and daily
   share one style: percentages, an optional section for longer-cycle items. isWeekly() means "that style". */
const kind=()=>(S.template&&S.template.check_in_period)||'monthly';
const isWeekly=()=>kind()!=='monthly';
const isDaily=()=>kind()==='daily';
const PWORD=()=>isDaily()?'day':(isWeekly()?'week':'month');
const PNOUN=()=>isDaily()?'today':'this week';
const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const addDays=(d,n)=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()+n);return x;};
const mondayOf=d=>addDays(d,-((d.getDay()+6)%7));
const shortDate=d=>MON[d.getMonth()]+' '+d.getDate();
/* "Short" items are scored every period: daily + weekly items on a weekly card, daily items on a daily card. */
const isShortCycle=i=>isDaily()?i.freq==='d':(i.freq==='d'||i.freq==='w');
const CYC={w:0,m:1,q:3,s:6,a:12};
/* ISO week of the year (weeks start Monday; week 1 holds the year's first Thursday). */
function isoWeek(mon){
  const thu=addDays(mon,3);
  const doy=Math.round((new Date(thu.getFullYear(),thu.getMonth(),thu.getDate())-new Date(thu.getFullYear(),0,1))/86400000)+1;
  return Math.floor((doy-1)/7)+1;
}
function mkPWeek(mon){
  const fri=addDays(mon,4), wn=isoWeek(mon);
  return {weekly:true,key:ymd(mon),mon:mon,fri:fri,y:fri.getFullYear(),m:fri.getMonth(),week:wn,
          label:'W'+wn+': '+shortDate(mon)+' – '+shortDate(addDays(mon,6)),short:'W'+wn};
}
function mkPDay(d){
  return {weekly:true,kind:'daily',key:ymd(d),mon:d,fri:d,y:d.getFullYear(),m:d.getMonth(),
          label:DOW[d.getDay()]+', '+shortDate(d),short:(d.getMonth()+1)+'/'+d.getDate()};
}
function mkPMonth(y,m){ return {weekly:false,key:pkey(y,m),y:y,m:m,label:MON[m]+' '+y,short:MON[m]}; }
const today0=()=>{const n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate());};
const viewP=()=>isDaily()?mkPDay(S.day||today0()):(isWeekly()?mkPWeek(S.wk||mondayOf(new Date())):mkPMonth(S.view.y,S.view.m));
/* First day of the month/quarter/half/year that contains the Friday, `back` periods earlier. */
function cycleStart(freq,fri,back){
  if(freq==='w') return addDays(mondayOf(fri),-7*back);
  const p=CYC[freq];
  return new Date(fri.getFullYear(),fri.getMonth()-fri.getMonth()%p-back*p,1);
}
const cycleKey=(freq,fri,back)=>{const d=cycleStart(freq,fri,back);return freq==='w'?ymd(d):pkey(d.getFullYear(),d.getMonth());};
function cycleName(freq,d){
  const y=d.getFullYear(), m=d.getMonth();
  return freq==='w'?'W'+isoWeek(d)+' ('+shortDate(d)+' – '+shortDate(addDays(d,6))+')'
       : freq==='m'?MON[m]+' '+y : freq==='q'?'Q'+(Math.floor(m/3)+1)+' '+y
       : freq==='s'?(m<6?'1st':'2nd')+' half of '+y : ''+y;
}

   be given another due day (due_dow: 1 Mon ... 7 Sun, 6 = the weekend), e.g. "Call Family" due Saturday. */
const DOWSHORT=['','Mon','Tue','Wed','Thu','Fri','the weekend','Sun'];
const DOWLATE=['','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const MONFULL=['January','February','March','April','May','June','July','August','September','October','November','December'];
const ORD=['1st','2nd','3rd','4th','5th','6th','7th','8th','9th','10th','11th','12th'];
/* due_at / late_at: weekly 1-7 (Mon-Sun, due 6 = the weekend); monthly = day 1-31 (31 = last day);
   quarterly / 6-month / yearly = month*100 + day (month counted from 0 within the period). */
const defaultLate=(f,due)=>{
  if(f==='w') return 7; if(f==='m') return 31;
  const p=CYC[f]||1, last=(p-1)*100+31;
  if(due==null) return last;
  const d=new Date(2023,Math.floor(due/100),due%100||1); d.setDate(d.getDate()+90);
  const m=(d.getFullYear()-2023)*12+d.getMonth();
  return m>=p?last:m*100+d.getDate();
};
const dueAt=it=>it.due_at!=null?it.due_at:1;
const lateAt=it=>it.late_at!=null?it.late_at:defaultLate(it.freq,dueAt(it));
function monthDay(st,m,d){
  const y=st.getFullYear(), mo=st.getMonth()+m, dim=new Date(y,mo+1,0).getDate();
  return new Date(y,mo,Math.min(d,dim));
}
function instanceDates(it,key){
  const st=new Date(key+'T00:00:00'); let due,late;
  if(it.freq==='w'){ due=addDays(st,dueAt(it)-1); late=addDays(st,lateAt(it)-1); }
  else{
    const dv=dueAt(it), lv=lateAt(it);
    due=monthDay(st,Math.floor(dv/100),dv%100||1); late=monthDay(st,Math.floor(lv/100),lv%100||1);
  }
  if(late<due) late=due;
  return {due:due,late:late};
}
/* Words for a due / late setting, e.g. "Sat", "the 15th", "2nd month, day 15", "Dec 31". */
function whenText(it,v,isLate){
  if(it.freq==='w') return isLate?DOWLATE[v]:DOWSHORT[v];
  const m=Math.floor(v/100), d=v%100||1;
  if(it.freq==='m') return d>=31?'last day':'day '+d;
  if(it.freq==='a') return MONFULL[m].slice(0,3)+' '+(d>=31?'31':d);
  return ORD[m]+' month, '+(d>=31?'last day':'day '+d);
}
/* 'done' | 'na' | 'notdue' | 'due' | 'late' for one answer, as of the day being viewed. */
function rowState(it,key,ref){
  const v=S.entries[it.id+'|'+key];
  if(v===true) return 'done';
  if(v==='na') return 'na';
  const d=instanceDates(it,key), r=ymd(ref);
  return r<ymd(d.due)?'notdue':(r>ymd(d.late)?'late':'due');
}
/* Small text on the right of a longer-cycle row. */
function rowTag(it,key,ref,isPrior){
  const st=rowState(it,key,ref), d=instanceDates(it,key);
  const late='<span style="color:var(--alert);font-weight:600">Late</span>';
  if(isPrior) return (st==='late'?late+' &middot; ':'')+cycleName(it.freq,new Date(key+'T00:00:00'));
  if(st==='notdue') return 'Due '+(it.freq==='w'?DOWSHORT[dueAt(it)]:shortDate(d.due));
  return FREQ[it.freq]+(it.due_at!=null&&dueAt(it)>1?' &middot; due '+(it.freq==='w'?DOWSHORT[dueAt(it)]:shortDate(d.due)):'');
}
/* Unanswered items from the period just before this one: they are Late until done. */
function lateRows(P,catId){
  const out=[], startD=S.card?new Date(S.card.started_at+"T00:00:00"):P.fri;
  catItems(catId).forEach(i=>{
    if(!i.is_selected||isShortCycle(i)||CYC[i.freq]===undefined) return;
    if(cycleStart(i.freq,P.fri,1)<cycleStart(i.freq,startD,0)) return;
    const k=cycleKey(i.freq,P.fri,1), v=S.entries[i.id+'|'+k];
    if(v!==true&&v!=='na') out.push({it:i,key:k});
  });
  return out;
}
/* The entry key an item is answered under, for the period being viewed. */
const ekey=(i,P)=>(!P.weekly||isShortCycle(i))?P.key:cycleKey(i.freq,P.fri,0);
const isDone=(i,P)=>S.entries[i.id+'|'+ekey(i,P)]===true;
const isNA=(i,P)=>S.entries[i.id+'|'+ekey(i,P)]==='na';
/* Does this item count toward the score of period P? */
/* Days of the week an item is due (days = '12345', 1 = Mon ... 7 = Sun). Only daily items on daily cards use it; blank = every day. */
const isoDow=d=>((d.getDay()+6)%7)+1;
const hasDays=i=>!!i.days&&i.days.length<7&&isDaily()&&i.freq==='d';
const onDay=(i,P)=>!hasDays(i)||P.kind!=='daily'||i.days.indexOf(String(isoDow(P.mon)))>=0;
const scored=(i,P)=>P.weekly?(isShortCycle(i)&&onDay(i,P)):isDue(i.freq,P.m,i.target_month);
const catTitle=c=>isWeekly()?String.fromCharCode(65+S.cats.indexOf(c))+'. '+c.name:c.name;

/* ===================================================================
   SCORING - ported unchanged from the prototype.
     category_score = completed_and_due / selected_and_due
     overall        = mean of live category scores (equal weight)
     empty categories are excluded, not zeroed
   =================================================================== */
/* Weekly cards: how the optional monthly/quarterly/6-month/yearly items touch
   this week's score. A "yes" counts once, in the week it was ticked (+1 done,
   +1 due). An item that is officially due this week, meaning the first-Friday
   week that closes its period, counts as due if it was not answered yes (or
   N/A). Anything else is left out, so an item that is not due yet costs nothing. */
/* Is the period that just ended officially due for this item in week P? (first-Friday week,
   and the period did not end before the card was started) */
function closingFor(it,P){
  const p=CYC[it.freq];
  if(isDaily()||!p||!(P.fri.getDate()<=7&&P.fri.getMonth()%p===0)) return false;
  const startD=S.card?new Date(S.card.started_at+"T00:00:00"):P.fri;
  return cycleStart(it.freq,P.fri,1)>=cycleStart(it.freq,startD,0);
}
/* The longer-cycle items that count toward a section this week: ticked yes this week, or due now
   and not done. Items marked N/A while due are included (greyed) so they can be changed back. */
function longCounted(P){
  const out={};
  const push=(it,key)=>{ (out[it.category_id]||(out[it.category_id]=[])).push({it:it,key:key}); };
  liveItems().forEach(it=>{
    if(!it.is_selected||isShortCycle(it)||CYC[it.freq]===undefined) return;
    const ck=cycleKey(it.freq,P.fri,0), pk=cycleKey(it.freq,P.fri,1);
    const credited=k=>S.entries[it.id+'|'+k]===true&&S.credit[it.id+'|'+k]===P.key;
    if(closingFor(it,P)){
      const v=S.entries[it.id+'|'+pk];
      if(v!==true||credited(pk)) push(it,pk);
    }
    if(credited(ck)) push(it,ck);
  });
  return out;
}
function longAdjust(P){
  const out={};
  const add=(cid,d,u)=>{const o=out[cid]||(out[cid]={done:0,due:0});o.done+=d;o.due+=u;};
  const byId={};
  liveItems().forEach(i=>{ if(i.is_selected&&!isShortCycle(i)) byId[i.id]=i; });
  Object.keys(S.credit).forEach(k=>{
    if(S.credit[k]!==P.key||S.entries[k]!==true) return;
    const it=byId[k.split('|')[0]]; if(it) add(it.category_id,1,1);
  });
  Object.keys(byId).forEach(id=>{
    const it=byId[id];
    /* closingFor also skips periods that ended before the card was started. */
    if(!closingFor(it,P)) return;
    const v=S.entries[id+'|'+cycleKey(it.freq,P.fri,1)];
    if(v!==true&&v!=='na') add(it.category_id,0,1);
  });
  return out;
}
function score(P){
  const cats=[], adj=P.weekly?longAdjust(P):{};
  S.cats.forEach(c=>{
    const all=catItems(c.id).filter(i=>!P.weekly||isShortCycle(i)), mine=all.filter(i=>i.is_selected);
    const dueItems=mine.filter(i=>scored(i,P)&&!isNA(i,P));
    const a=adj[c.id]||{done:0,due:0};
    const hit=dueItems.filter(i=>isDone(i,P)).length+a.done, due=dueItems.length+a.due;
    cats.push({id:c.id,name:c.name,pct:due?hit/due:null,
               done:hit,due:due,sel:mine.length,total:all.length,xdue:a.due});
  });
  const live=cats.filter(c=>c.pct!==null);
  return {cats,
    overall:live.length?live.reduce((a,c)=>a+c.pct,0)/live.length:null,
    tDone:cats.reduce((a,c)=>a+c.done,0),
    tDue :cats.reduce((a,c)=>a+c.due,0)};
}

/* ===================================================================
   CHARTS - ported unchanged from the prototype.
   =================================================================== */
function radar(cats,size,lbl){
  const live=cats.filter(c=>c.pct!==null);
  if(live.length<3) return '<div class="empty">Select items in at least three categories to draw your shape.</div>';
  const cx=size/2,cy=size/2,R=size/2-(lbl?46:6),n=live.length;
  const ang=i=>(Math.PI*2*i/n)-Math.PI/2, pt=(i,r)=>[cx+Math.cos(ang(i))*R*r,cy+Math.sin(ang(i))*R*r];
  let g=''; [.25,.5,.75].forEach(r=>g+='<circle cx="'+cx+'" cy="'+cy+'" r="'+(R*r)+'" fill="none" stroke="#2A4A5E"/>');
  g+='<circle cx="'+cx+'" cy="'+cy+'" r="'+R+'" fill="none" stroke="#3E6178" stroke-width="1.5" stroke-dasharray="3 4"/>';
  live.forEach((c,i)=>{const p=pt(i,1);g+='<line x1="'+cx+'" y1="'+cy+'" x2="'+p[0]+'" y2="'+p[1]+'" stroke="#2A4A5E"/>';});
  g+='<polygon points="'+live.map((c,i)=>pt(i,Math.max(c.pct,.02)).join(',')).join(' ')+'" fill="rgba(72,160,206,.22)" stroke="#48A0CE" stroke-width="'+(lbl?2:1.5)+'" stroke-linejoin="round"/>';
  live.forEach((c,i)=>{const p=pt(i,Math.max(c.pct,.02));
    g+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="'+(lbl?3.5:2)+'" fill="'+(c.pct<.5?'#E0705F':'#48A0CE')+'"/>';
    if(!lbl)return;
    const l=pt(i,1.32), anc=Math.abs(l[0]-cx)<8?'middle':(l[0]>cx?'start':'end');
    g+='<text x="'+l[0]+'" y="'+(l[1]-5)+'" text-anchor="'+anc+'" fill="#8FA6B3" font-size="10.5" font-weight="500">'+esc(c.name.replace('Family: ',''))+'</text>';
    g+='<text x="'+l[0]+'" y="'+(l[1]+8)+'" text-anchor="'+anc+'" fill="'+(c.pct<.5?'#E0705F':'#EEF3F3')+'" font-size="11.5" font-weight="800">'+ten(c.pct)+'</text>';
    g+='<text x="'+l[0]+'" y="'+(l[1]+20)+'" text-anchor="'+anc+'" fill="#8FA6B3" font-size="9.5">'+c.done+' of '+c.due+'</text>';});
  /* Labelled radars put their text at 1.32R, which runs past a "0 0 size size"
     viewBox and clips "Wealth" and "Family" at the left and right edges. Pad
     the box horizontally rather than pulling the labels inward, so the wheel
     keeps the prototype's proportions. */
  const pad=lbl?52:0, padY=lbl?14:0;
  return '<svg viewBox="'+(-pad)+' '+(-padY)+' '+(size+pad*2)+' '+(size+padY*2)+'" width="100%" style="max-width:'+(size+pad*2)+'px;display:block;margin:0 auto">'+g+'</svg>';
}
function lineChart(series,w,h,col,showLbl,labels){
  const n=series.length,P=6,B=showLbl?16:6,Tp=showLbl?14:6;
  const xs=i=>P+i*(w-2*P)/Math.max(1,n-1), ys=v=>(h-B)-v*(h-B-Tp);
  const pts=series.map((v,i)=>v===null?null:[xs(i),ys(v)]).filter(Boolean);
  let g='';
  [0,.5,1].forEach(r=>{const y=ys(r);g+='<line x1="'+P+'" y1="'+y+'" x2="'+(w-P)+'" y2="'+y+'" stroke="#2A4A5E" stroke-width="1" '+(r===0?'':'stroke-dasharray="2 4"')+'/>';});
  if(pts.length>1){
    const line=pts.map(p=>p.join(',')).join(' ');
    g+='<polygon points="'+xs(0)+','+(h-B)+' '+line+' '+xs(n-1)+','+(h-B)+'" fill="'+col+'" opacity=".13"/>';
    g+='<polyline points="'+line+'" fill="none" stroke="'+col+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
  }
  pts.forEach((p,i)=>{g+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="'+(i===pts.length-1?3.4:2.2)+'" fill="'+col+'"/>';});
  if(showLbl){
    series.forEach((v,i)=>{ if(v===null)return;
      g+='<text x="'+xs(i)+'" y="'+(ys(v)-7)+'" text-anchor="middle" fill="#EEF3F3" font-size="9.5" font-weight="800">'+ten(v)+'</text>';
      g+='<text x="'+xs(i)+'" y="'+(h-4)+'" text-anchor="middle" fill="#8FA6B3" font-size="9">'+esc(labels[i])+'</text>';});
  }
  return '<svg viewBox="0 0 '+w+' '+h+'" width="100%" style="display:block">'+g+'</svg>';
}

/* ===================================================================
   PERSISTENCE - online only. Optimistic in memory, written straight
   through to Supabase. No IndexedDB mirror: unlike time tracking, a
   monthly check-in is not something you do on a plane, and the tracker's
   sync engine brings a class of bugs (deletes not propagating) this app
   does not need to inherit.
   =================================================================== */
let saveTimer=null;
function saving(state,msg){
  const el=$("saving");
  clearTimeout(saveTimer);
  if(state==='off'){ el.style.display='none'; return; }
  el.className = state==='err' ? 'err' : '';
  el.textContent = msg || (state==='err' ? 'Could not save' : 'Saving...');
  el.style.display='block';
  saveTimer=setTimeout(()=>{el.style.display='none';}, state==='err'?6000:900);
}
async function run(promise){
  saving('on');
  const {data,error}=await promise;
  if(error){ console.error(error); saving('err','Could not save - '+error.message); throw error; }
  saving('on','Saved');
  return data;
}

async function loadAll(){
  const tz=(Intl.DateTimeFormat().resolvedOptions()||{}).timeZone||"America/Chicago";
  const {data:prof,error:pe}=await SB.rpc("sc_bootstrap_profile",{p_timezone:tz});
  if(pe) throw pe;
  S.profile=Array.isArray(prof)?prof[0]:prof;
  /* Admins (sql/08) can promote their own questions into the shared template. */
  try{ const {data:adm,error:ae}=await SB.rpc("sc_is_admin"); S.isAdmin=!ae&&adm===true; }catch(e){ S.isAdmin=false; }

  const r=await Promise.all([
    SB.from("sc_templates").select("*").eq("is_published",true).order("sort_order"),
    SB.from("sc_categories").select("*").order("sort_order"),
    SB.from("sc_library_items").select("*").eq("is_active",true).order("sort_order"),
    SB.from("sc_user_scorecards").select("*").eq("is_active",true).order("created_at")
  ]);
  r.forEach(x=>{ if(x.error) throw x.error; });
  S.templates=r[0].data||[];
  if(!S.templates.length) throw new Error("No scorecard templates found. Has the seed been run?");
  S.allCats=r[1].data||[]; S.allLib=r[2].data||[]; S.cards=r[3].data||[];
  /* One template: go straight in. Several: show the home screen. */
  if(S.templates.length===1) await openTemplate(S.templates[0].id);
}

/* Point the working state (S.template/cats/library/card/items) at one template. */
/* Keep the address in step with the open scorecard so "Add to Home Screen" from that page opens it directly. */
function setUrl(id){ try{ history.replaceState(null,'',id?('?s='+encodeURIComponent(id)):location.pathname); }catch(e){} }
async function openTemplate(id){
  setUrl(id);
  S.template=S.templates.find(t=>t.id===id);
  S.cats=S.allCats.filter(c=>c.template_id===id);
  const catIds={}; S.cats.forEach(c=>catIds[c.id]=1);
  S.library=S.allLib.filter(i=>catIds[i.category_id]);
  S.card=S.cards.find(c=>c.template_id===id)||null;
  S.items=[]; S.entries={}; S.credit={};
  S.tab='checkin'; S.stripScroll=null; S.view={y:NOW.y,m:NOW.m}; S.wk=mondayOf(new Date()); S.day=today0(); S.sortMode=defSort(); S.editing=null;
  if(S.card){
    await loadCard();
    const used={}; S.library.forEach(l=>used[l.category_id]=1); liveItems().forEach(i=>used[i.category_id]=1);
    if(!S.template.owner) S.cats=S.cats.filter(c=>used[c.id]);
  }
}
/* Re-read everything (after creating, renaming or deleting) and reopen a scorecard, or go home. */
async function refreshData(openId,tab){
  await loadAll();
  if(openId&&S.templates.some(t=>t.id===openId)){ await openTemplate(openId); if(tab) S.tab=tab; }
  else { S.template=null; S.card=null; S.tab='home'; setUrl(null); }
  render();
}
/* On launch: open the scorecard named in the address (?s=), else this device's chosen start scorecard. */
async function applyStart(){
  if(S.template) return;
  let id=null;
  try{ id=new URLSearchParams(location.search).get('s'); }catch(e){}
  if(!id){ try{ id=localStorage.getItem('ces-start'); }catch(e){} }
  if(id&&S.templates.some(t=>t.id===id)) await openTemplate(id);
}
async function goTemplate(id){
  $("app").innerHTML='<div class="empty">Loading...</div>';
  try{ await openTemplate(id); }catch(e){ console.error(e); saving('err','Could not load - '+e.message); }
  render();
}
function goHome(){ S.template=null; S.card=null; S.tab='home'; setUrl(null); render(); }

async function loadCard(synced){
  const r=await Promise.all([
    SB.from("sc_user_scorecard_items").select("*").eq("user_scorecard_id",S.card.id),
    SB.from("sc_entries").select("user_scorecard_item_id,period_start,value_bool,credit_week").eq("user_scorecard_id",S.card.id)
  ]);
  r.forEach(x=>{ if(x.error) throw x.error; });
  const libById={}; S.library.forEach(l=>libById[l.id]=l);
  const rows=r[0].data||[];

  /* Template questions added after this card was started (or that the card
     never received) are added now, so edits to a template reach existing
     users. Questions the template has retired drop out of the card below. */
  if(!synced){
    const have={}; rows.forEach(x=>{ if(x.library_item_id) have[x.library_item_id]=1; });
    const missing=S.library.filter(l=>!have[l.id]);
    if(missing.length){
      const counters={q:0,s:0,a:0};
      const add=missing.sort((a,b)=>a.sort_order-b.sort_order).map(l=>{
        const f=DB2F[l.default_frequency]||'m';
        let tm=l.default_target_month;
        if(!tm&&PERIOD[f]) tm=spreadTargetMonth(f,counters[f]++);
        return {user_scorecard_id:S.card.id, library_item_id:l.id, category_id:l.category_id,
          frequency:l.default_frequency, target_month:tm||null, target_value:l.default_target_value,
          is_selected:!!l.is_default_on, sort_order:l.sort_order};
      });
      for(let i=0;i<add.length;i+=100){
        const {error}=await SB.from("sc_user_scorecard_items").insert(add.slice(i,i+100));
        if(error) throw error;
      }
      return loadCard(true);
    }
  }

  S.items=rows.filter(x=>!x.library_item_id||libById[x.library_item_id]).map(x=>({
    id:x.id, category_id:x.category_id, library_item_id:x.library_item_id,
    custom_label:x.custom_label, renamed_label:x.renamed_label,
    lib_label:(x.library_item_id&&libById[x.library_item_id])?libById[x.library_item_id].label:null,
    lib_short:(x.library_item_id&&libById[x.library_item_id])?libById[x.library_item_id].short_label:null,
    lib_code:(x.library_item_id&&libById[x.library_item_id])?libById[x.library_item_id].code:null,
    due_at:(()=>{ const L=(x.library_item_id&&libById[x.library_item_id])||{}; return x.due_at!=null?x.due_at:(x.due_dow!=null?x.due_dow:(L.due_at!=null?L.due_at:L.due_dow!=null?L.due_dow:null)); })(),
    late_at:(()=>{ const L=(x.library_item_id&&libById[x.library_item_id])||{}; return x.late_at!=null?x.late_at:(L.late_at!=null?L.late_at:null); })(),
    tod:(()=>{ const L=(x.library_item_id&&libById[x.library_item_id])||{}; return x.tod!=null?x.tod:(L.tod!=null?L.tod:null); })(),
    icon:(()=>{ const L=(x.library_item_id&&libById[x.library_item_id])||{}; return x.icon!=null?x.icon:(L.icon!=null?L.icon:null); })(),
    color:(()=>{ const L=(x.library_item_id&&libById[x.library_item_id])||{}; return x.color!=null?x.color:(L.color!=null?L.color:null); })(),
    days:(()=>{ const L=(x.library_item_id&&libById[x.library_item_id])||{}; return x.days!=null?x.days:(L.days!=null?L.days:null); })(),
    freq:DB2F[x.frequency]||'m', target_month:x.target_month,
    is_selected:x.is_selected, sort_order:x.sort_order, removed_at:x.removed_at
  }));
  S.items.forEach(i=>{ if(i.icon==null) i.icon=guessIcon(label(i)); });
  S.entries={}; S.credit={};
  (r[1].data||[]).forEach(e=>{
    const k=e.user_scorecard_item_id+'|'+e.period_start;
    S.entries[k]=(e.value_bool===null?'na':!!e.value_bool);
    if(e.credit_week) S.credit[k]=e.credit_week;
  });
}

/* Adoption: one card, one row per library item, first-run defaults on. */
async function adopt(){
  if(S.busy) return; S.busy=true;
  try{
    saving('on','Setting up...');
    const {data:card,error:ce}=await SB.from("sc_user_scorecards")
      .insert({template_id:S.template.id}).select().single();
    if(ce) throw ce;
    S.card=card; S.cards.push(card);
    const counters={q:0,s:0,a:0};
    const rows=[];
    S.cats.forEach(c=>{
      S.library.filter(l=>l.category_id===c.id)
        .sort((a,b)=>a.sort_order-b.sort_order)
        .forEach(l=>{
          const f=DB2F[l.default_frequency]||'m';
          let tm=l.default_target_month;
          if(!tm&&PERIOD[f]) tm=spreadTargetMonth(f,counters[f]++);
          rows.push({
            user_scorecard_id:card.id, library_item_id:l.id, category_id:c.id,
            frequency:l.default_frequency, target_month:tm||null,

    }

async function tick(itemId,period,creditWeek,force){
  const it=S.items.find(i=>i.id===itemId); if(!it) return;
  if(isFutureDay()) return;
  const k=itemId+'|'+period;
  const prev=S.entries[k], prevCredit=S.credit[k];
  /* Tap or swipe right: done (again = undo). Swipe left: not applicable (again = undo). */
  const next=force==='na'?(prev==='na'?false:'na'):(prev===true?false:true);
  /* A monthly/quarterly/yearly "yes" is credited to the week it was ticked in. */
  const credit=(next===true&&creditWeek)?creditWeek:null;
  S.entries[k]=next;
  if(credit) S.credit[k]=credit; else delete S.credit[k];
  render();
  try{
    await run(SB.from("sc_entries").upsert({
      user_scorecard_id:S.card.id, user_scorecard_item_id:itemId,
      period_start:period, value_bool:(next==='na'?null:next), credit_week:credit
    },{onConflict:"user_scorecard_item_id,period_start"}));
  }catch(e){
    S.entries[k]=prev;
    if(prevCredit) S.credit[k]=prevCredit; else delete S.credit[k];
    render();
  }
}

  try{ await run(SB.from("sc_user_scorecard_items").update(patch).eq("id",itemId)); }

/* Rows of the Repeats / Due / Late editor for one item. */
function schedParts(i){
  const f=i.freq, p=CYC[f]||1;
  const sel=(which,part,opts,cur)=>'<select class="fsel" style="width:auto;min-width:0" onchange="setSched(\''+i.id+'\',\''+which+'\',\''+part+'\',this.value)">'
    +opts.map(o=>'<option value="'+o[0]+'" '+(o[0]===cur?'selected':'')+'>'+o[1]+'</option>').join('')+'</select>';
  const days=[];for(let d=1;d<=28;d++)days.push([d,String(d)]);days.push([31,'last day']);
  const mons=[];for(let m=0;m<p;m++)mons.push([m,f==='a'?MONFULL[m]:ORD[m]+' month']);
  const field=(which,cur)=>{
    if(f==='w') return sel(which,'v',which==='due'?[[1,'Monday'],[2,'Tuesday'],[3,'Wednesday'],[4,'Thursday'],[5,'Friday'],[6,'the weekend (Sat)'],[7,'Sunday']]
                                                  :[[1,'Monday'],[2,'Tuesday'],[3,'Wednesday'],[4,'Thursday'],[5,'Friday'],[6,'Saturday'],[7,'Sunday']],cur);
    if(f==='m') return sel(which,'v',days,cur);
    return sel(which,'m',mons,Math.floor(cur/100))+' '+sel(which,'d',days,cur%100||1);
  };
  return {
    repeat:'<select class="fsel" style="width:auto" onchange="setFreq(\''+i.id+'\',this.value)">'+freqKeys().map(x=>'<option value="'+x+'" '+(i.freq===x?'selected':'')+'>'+FREQ[x]+'</option>').join('')+'</select>',
    due:field('due',dueAt(i)), late:field('late',lateAt(i))
  };
}

function periodBar(){
  if(isDaily()){
    const st=S.card?new Date(S.card.started_at+"T00:00:00"):today0();
    const atStart=ymd(S.day)<=ymd(st), atNow=ymd(S.day)>=ymd(today0());
    return '<div class="monthbar">'
      +'<button onclick="stepPeriod(-1)" '+(atStart?'disabled':'')+' title="Previous day">&lsaquo;</button>'
      +'<div class="mlbl">'+mkPDay(S.day).label+(atNow?'':' <span class="pill due">Backfill</span>')+'</div>'
      +'<button onclick="stepPeriod(1)" '+(atNow?'disabled':'')+' title="Next day">&rsaquo;</button></div>';
  }
  if(isWeekly()){
    const start=mondayOf(S.card?new Date(S.card.started_at+"T00:00:00"):new Date());
    const cur=mondayOf(new Date());
    const atStart=S.wk<=start, atNow=S.wk>=cur;
    return '<div class="monthbar">'
      +'<button onclick="stepPeriod(-1)" '+(atStart?'disabled':'')+' title="Previous week">&lsaquo;</button>'
      +'<div class="mlbl">'+mkPWeek(S.wk).label+(atNow?'':' <span class="pill due">Backfill</span>')+'</div>'
      +'<button onclick="stepPeriod(1)" '+(atNow?'disabled':'')+' title="Next week">&rsaquo;</button></div>';
  }
  const start=S.card?new Date(S.card.started_at+"T00:00:00"):new Date(NOW.y,NOW.m,1);
  const atStart=S.view.y<start.getFullYear()||(S.view.y===start.getFullYear()&&S.view.m<=start.getMonth());
  const atNow=S.view.y===NOW.y&&S.view.m===NOW.m;
  return '<div class="monthbar">'
    +'<button onclick="stepPeriod(-1)" '+(atStart?'disabled':'')+' title="Previous month">&lsaquo;</button>'
    +'<div class="mlbl">'+MON[S.view.m]+' '+S.view.y+(atNow?'':' <span class="pill due">Backfill</span>')+'</div>'
    +'<button onclick="stepPeriod(1)" '+(atNow?'disabled':'')+' title="Next month">&rsaquo;</button></div>';
}
function stepPeriod(d){
  if(isDaily()){ S.day=addDays(S.day,d); render(); return; }
  if(isWeekly()){ S.wk=addDays(S.wk,7*d); render(); return; }
  let m=S.view.m+d,y=S.view.y;
  if(m<0){m=11;y--} if(m>11){m=0;y++}
  S.view={y:y,m:m}; render();
}

function rowTap(el){ if(Date.now()-SWIPED<500) return; tick(el.dataset.id,el.dataset.key,el.dataset.cr); }
let SW=null;
try{
  document.addEventListener('pointerdown',e=>{
    const it=e.target.closest&&e.target.closest('.swrow.swp .item'); if(!it) return;
    if(e.clientX<22||e.clientX>window.innerWidth-22) return;           /* leave the phone's edge-swipe alone */
    SW={el:it,wrap:it.parentNode,x:e.clientX,y:e.clientY,dx:0,on:false};
  });

    if(!SW.on){

    SWIPED=Date.now();
    s0.el.classList.remove('dragging'); s0.el.style.transform=''; s0.wrap.classList.remove('dr','dl');

/* The longer-cycle rows that belong under a section this week/day: counted ones, plus (if switched on)
   every longer item of the section and anything Late. */
function extraRows(c,P,counted){
  const W=P.weekly; let extra=counted[c.id]||[];
  if(W&&S.showLonger){
    const have={}; extra.forEach(x=>{ have[x.it.id+'|'+x.key]=1; });
    const add=[];
    catItems(c.id).forEach(i=>{
      if(!i.is_selected||isShortCycle(i)||CYC[i.freq]===undefined) return;
      const k=cycleKey(i.freq,P.fri,0);
      if(!have[i.id+'|'+k]) add.push({it:i,key:k});
    });
    lateRows(P,c.id).forEach(x=>{ if(!have[x.it.id+'|'+x.key]) add.push(x); });
    const order={}; catItems(c.id).forEach((i,n)=>{ order[i.id]=n; });
    extra=extra.concat(add).sort((x,y)=>(order[x.it.id]-order[y.it.id])||(x.key<y.key?-1:1));
  }
  /* "Only show what's due now" (daily cards): hide longer items whose due day has not arrived. */
  if(W&&S.dueOnly&&isDaily()) extra=extra.filter(x=>rowState(x.it,x.key,P.fri)!=='notdue');
  return extra;
}
/* Daily cards: the days as a row you scroll sideways. Full = everything done, partial ring = some

function dayStrip(s){

  const last=addDays(today,14);

  for(let d=first; ymd(d)<=ymd(last); d=addDays(d,1)){
    const key=ymd(d), sel=key===ymd(S.day), fut=key>ymd(today), sc=score(mkPDay(d));
    let st='none', pct=0;
    if(!fut&&sc.tDue){ pct=Math.round(100*sc.tDone/sc.tDue); st=sc.tDone>=sc.tDue?'full':(sc.tDone>0?'part':(key<ymd(today)?'miss':'zero')); }
    h+='<button class="dcell'+(sel?' sel':'')+(fut?' fut':'')+'" onclick="pickDay(\''+key+'\')">'

const rowVal=r=>S.entries[r.it.id+'|'+r.key];

/* Every row for the day, in section order: the day's own items plus any longer-cycle rows. */
function dayRowsData(P,counted){
  const rows=[];
  S.cats.forEach(c=>{
    catItems(c.id).filter(i=>i.is_selected&&isShortCycle(i)&&onDay(i,P)).forEach(i=>rows.push({it:i,key:ekey(i,P),right:'',credit:''}));
    extraRows(c,P,counted).forEach(x=>{
      const prior=x.key!==cycleKey(x.it.freq,P.fri,0);
      rows.push({it:x.it,key:x.key,right:rowTag(x.it,x.key,P.fri,prior),credit:P.key});
    });

/* "Time of day" shows Morning / Afternoon / Evening headers; "Clean" is the same order with no headers. */
function rowsView(P,counted,headers){

  const slot=(list,t)=>list.filter(r=>todOf(r.it)===t);

function checkin(s){
  const P=viewP(), W=P.weekly, daily=isDaily();
  let h=daily?dayStrip(s)+lookBar():periodBar();

  else{
    let hidTotal=0;
    S.cats.forEach(c=>{
      let mine=catItems(c.id).filter(i=>i.is_selected&&(!W||(isShortCycle(i)&&onDay(i,P))));
      let extra=extraRows(c,P,counted);
      const nAll=mine.length+extra.length;
      if(!nAll) return;
      if(daily&&S.hideDone){
        const m0=mine.length+extra.length;
        mine=mine.filter(i=>!isResolved({it:i,key:ekey(i,P)}));
        extra=extra.filter(x=>!isResolved(x));
        hidTotal+=m0-mine.length-extra.length;
      }
      const cs=s.cats.find(x=>x.id===c.id);
      const head=daily?fmtScore(cs.done,cs.due):(W?(cs.due?cs.done+'/'+cs.due:'—'):ten(cs.pct));
      h+='<div class="catblock"><div class="cathead"><div class="catname">'+esc(catTitle(c))+'</div><div class="catpct">'+head+'</div></div>';
      if(!(daily&&S.score==='off')){
        h+='<div class="catmeta">'+(W?cs.sel+' '+PNOUN()+(cs.xdue?' + '+cs.xdue+' due or ticked from your longer list':'')+' &middot; N/A answers not counted':cs.done+' of '+cs.due+' due &middot; '+cs.sel+' of '+cs.total+' selected')+'</div>'
          +'<div class="bar"><span style="width:'+((cs.pct||0)*100)+'%"></span></div>';
      }
      mine.forEach(i=>{
        const due=W?true:isDue(i.freq,P.m,i.target_month);
        h+=itemBtn(i,ekey(i,P),due,(isDaily()&&i.freq==='d')?'':(due?FREQ[i.freq]:(i.target_month?MON[i.target_month-1]:'Not due')));
      });
      if(extra.length){
        h+='<div class="catmeta" style="margin:12px 0 4px;color:var(--gold)">'+(S.showLonger?'Weekly, monthly &amp; longer &mdash; tick when you do them':'From your longer list &mdash; due or ticked '+PNOUN())+'</div>';
        extra.forEach(x=>{
          const prior=x.key!==cycleKey(x.it.freq,P.fri,0);
          h+=itemBtn(x.it,x.key,true,rowTag(x.it,x.key,P.fri,prior),P.key);
        });
      }
      if(daily&&S.hideDone&&!mine.length&&!extra.length) h+='<div class="allclear">All done &#10003;</div>';
      h+='</div>';
    });
    if(daily&&S.hideDone&&hidTotal>0) h+='<button class="hidenote" onclick="toggleHideDone()">&#10003; '+hidTotal+' done &middot; show</button>';
  }
  if(W) h+=longCycle(P,counted);

  return h;
}

/* Weekly template only: the optional monthly / quarterly / 6-month / yearly items. */
function longCycle(P,counted){
  const groups=[['m','Monthly','month'],['q','Quarterly','quarter'],['s','Every 6 months','half-year'],['a','Yearly','year']];
  if(isDaily()) groups.unshift(['w','Weekly','week']);
  const catPos=id=>S.cats.findIndex(c=>c.id===id);
  let h='',any=false;
  const shown={};
  Object.keys(counted||{}).forEach(cid=>counted[cid].forEach(x=>{ shown[x.it.id+'|'+x.key]=1; }));
  groups.forEach(g=>{
    const f=g[0];
    const items=liveItems().filter(i=>i.is_selected&&i.freq===f)
      .sort((a,b)=>catPos(a.category_id)-catPos(b.category_id)||a.sort_order-b.sort_order);
    if(!items.length) return;
    if(!any){
      any=true;
      h+='<div class="seglbl" style="margin-top:30px">Beyond the week &middot; optional</div>'
        +'<div class="note" style="margin-top:8px">'+(isDaily()?'Tick one whenever you do it. A yes adds to that day\'s score; leaving one blank costs nothing.':'Tick one whenever you do it, any week. A yes adds to that week\'s score; leaving one blank costs nothing until it\'s due. On the first Friday of a new period the one that just ended becomes due, and counts if you haven\'t done it.')+'</div>';
    }
    const p=CYC[f], fri=P.fri;
    const closing=p>0&&!isDaily()&&fri.getDate()<=7&&fri.getMonth()%p===0;
    const blocks=(closing?[1]:[]).concat([0]);
    blocks.forEach(back=>{
      const start=cycleStart(f,fri,back), key=cycleKey(f,fri,back);
      const nm=cycleName(f,start);
      const na=items.filter(i=>S.entries[i.id+'|'+key]==='na').length;
      const done=items.filter(i=>S.entries[i.id+'|'+key]===true).length;
      const isClose=back===1;
      const vis=items.filter(i=>!shown[i.id+'|'+key]&&!(S.dueOnly&&isDaily()&&rowState(i,key,P.fri)==='notdue'));
      if(!vis.length) return;
      h+='<div class="catblock" style="margin-top:14px'+(isClose?';border:1px solid var(--gold);border-radius:12px;padding:12px':'')+'">'
        +'<div class="cathead"><div class="catname" style="font-size:'+(isClose?'15':'14')+'px">'
        +(isClose?'Close out '+esc(nm)+' &middot; '+g[1].toLowerCase():g[1]+' &middot; '+esc(nm))+'</div>'
        +'<div class="catpct" style="font-size:calc(15px*var(--z))">'+done+' of '+(items.length-na)+'</div></div>'
        +'<div class="catmeta">'+(isClose?'Due this week. Answer for '+esc(nm)+' &mdash; anything not done counts against this week.'
           :'Do these once each '+g[2]+' &mdash; tick when you\'ve done it.')+'</div>';
      vis.forEach(i=>{
        const c=S.cats.find(x=>x.id===i.category_id);
        h+=itemBtn(i,key,true,c?c.name:'',P.key);
      });
      h+='</div>';
    });
  });
  return h;
}

/* Periods from the card's start up to the one being viewed. Weekly cards show
   the latest 12 weeks so the charts stay readable. */
function periodsSinceStart(){
  const out=[];
  if(isDaily()){
    let d=new Date(S.card.started_at+"T00:00:00");
    while(ymd(d)<=ymd(S.day)){
      const P=mkPDay(d);
      out.push({P:P,label:P.short,y:P.y,m:P.m,s:score(P)});
      d=addDays(d,1);
      if(out.length>800) break;
    }
    return out.slice(-14);
  }
  if(isWeekly()){
    let mon=mondayOf(new Date(S.card.started_at+"T00:00:00"));
    while(mon<=S.wk){
      const P=mkPWeek(mon);
      out.push({P:P,label:P.short,y:P.y,m:P.m,s:score(P)});
      mon=addDays(mon,7);
      if(out.length>156) break;
    }
    return out.slice(-12);
  }
  const start=new Date(S.card.started_at+"T00:00:00");
  let y=start.getFullYear(), m=start.getMonth();
  while(y<S.view.y||(y===S.view.y&&m<=S.view.m)){
    const P=mkPMonth(y,m);
    out.push({P:P,label:MON[m],y:y,m:m,s:score(P)});
    m++; if(m>11){m=0;y++}
    if(out.length>60) break;
  }
  return out;
}
