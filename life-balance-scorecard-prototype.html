<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chasing Excellence Scorecards</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400;12..96,75..100,600;12..96,75..100,800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#0D1620;--slate:#16212D;--raise:#1E2B39;--line:#293949;--bone:#E8EDF2;--muted:#8494A3;--accent:#4C9BE0;--alert:#E0705F;--track:#3FA88F;--gold:#E0A93F;--r:14px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--ink);color:var(--bone);font-family:'Instrument Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{min-height:100vh;padding:0 0 90px}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.wrap{max-width:460px;margin:0 auto;padding:0 18px}
.top{position:sticky;top:0;z-index:20;background:rgba(20,24,28,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top-in{max-width:460px;margin:0 auto;padding:14px 18px;display:flex;align-items:center;gap:12px}
.brandmark{font-family:'Bricolage Grotesque';font-weight:800;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.brandsub{font-size:11px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
.top-sp{flex:1}
.iconbtn{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);display:grid;place-items:center;color:var(--muted);font-size:15px}
.iconbtn:hover{color:var(--bone);border-color:var(--muted)}
.h1{font-family:'Bricolage Grotesque';font-weight:800;font-size:30px;line-height:1.05;letter-spacing:-.02em;margin:26px 0 4px}
.sub{color:var(--muted);font-size:13.5px;margin-bottom:22px}
.eyebrow{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:600}
.card{background:var(--slate);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px;width:100%;text-align:left;display:block;transition:border-color .16s,transform .16s}
.card:hover{border-color:#3B5068;transform:translateY(-1px)}
.card-top{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.pill{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;padding:4px 9px;border-radius:100px}
.pill.due{background:rgba(76,155,224,.14);color:var(--accent)}
.pill.done{background:rgba(63,168,143,.14);color:var(--track)}
.card-body{display:flex;align-items:center;gap:16px}
.card-name{font-family:'Bricolage Grotesque';font-weight:600;font-size:19px;letter-spacing:-.01em;margin-bottom:6px}
.bigscore{font-family:'Bricolage Grotesque';font-weight:800;font-size:38px;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.delta{font-size:12.5px;color:var(--muted);margin-top:5px}
.delta .up{color:var(--track)}.delta .down{color:var(--alert)}
.lowest{font-size:12.5px;color:var(--muted);margin-top:7px;padding-top:9px;border-top:1px solid var(--line)}
.lowest b{color:var(--alert);font-weight:600}
.addbtn{width:100%;padding:15px;border:1px dashed var(--line);border-radius:var(--r);color:var(--muted);font-size:14px;font-weight:500;transition:.16s}
.addbtn:hover{border-color:var(--accent);color:var(--accent)}
.tabs{display:flex;gap:2px;background:var(--slate);border:1px solid var(--line);border-radius:11px;padding:3px;margin:18px 0 22px}
.tab{flex:1;padding:9px 2px;border-radius:8px;font-size:11.5px;font-weight:500;color:var(--muted);transition:.14s;white-space:nowrap}
.tab.on{background:var(--raise);color:var(--bone)}
.catblock{margin-bottom:26px}
.cathead{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
.catname{font-family:'Bricolage Grotesque';font-weight:600;font-size:16px;flex:1}
.catpct{font-family:'Bricolage Grotesque';font-weight:800;font-size:16px;font-variant-numeric:tabular-nums}
.catmeta{font-size:11px;color:var(--muted);margin-bottom:10px}
.bar{height:3px;background:var(--line);border-radius:2px;overflow:hidden;margin-bottom:12px}
.bar span{display:block;height:100%;background:var(--accent);transition:width .35s cubic-bezier(.4,0,.2,1)}
.item{display:flex;align-items:flex-start;gap:11px;padding:10px 12px;border-radius:10px;width:100%;text-align:left;transition:background .14s}
.item:hover{background:var(--slate)}
.item.na{opacity:.5;cursor:default}.item.na:hover{background:none}
.item.auto{cursor:default}.item.auto:hover{background:none}
.box{width:19px;height:19px;flex:none;margin-top:1px;border:1.5px solid var(--line);border-radius:5px;display:grid;place-items:center;font-size:11px;color:var(--ink);transition:.14s}
.item.on .box{background:var(--accent);border-color:var(--accent)}
.item.na .box{border-style:dashed}
.item.auto .box{border-style:dotted;background:none}
.item.auto.on .box{background:var(--track);border-color:var(--track);border-style:solid}
.ilabel{font-size:14px;line-height:1.35;flex:1}
.item.on .ilabel{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.item.auto.on .ilabel{text-decoration:none;color:var(--bone)}
.freq{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);padding:2px 6px;border-radius:5px;flex:none;margin-top:1px}
.freq.trk{color:var(--track);border-color:rgba(63,168,143,.4)}
.wheelwrap{background:var(--slate);border:1px solid var(--line);border-radius:var(--r);padding:20px 12px 12px;margin-bottom:16px}
.scoreline{text-align:center;margin-bottom:6px}
.scoreline .n{font-family:'Bricolage Grotesque';font-weight:800;font-size:56px;line-height:1;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.scoreline .d{font-size:13px;color:var(--muted);margin-top:2px}
.scoreline .c{font-size:12px;color:var(--accent);margin-top:5px;font-variant-numeric:tabular-nums}
.legend{display:flex;justify-content:center;gap:16px;font-size:11px;color:var(--muted);margin-top:4px}
.legend i{display:inline-block;width:14px;height:2px;vertical-align:middle;margin-right:5px}
.catlist{background:var(--slate);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.catrow{display:flex;align-items:center;gap:11px;padding:12px 15px;border-bottom:1px solid var(--line)}
.catrow:last-child{border-bottom:none}
.catrow .nm{flex:1;font-size:14px}
.catrow .ct{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;width:42px;text-align:right}
.catrow .tr{width:52px;height:3px;background:var(--line);border-radius:2px;overflow:hidden}
.catrow .tr span{display:block;height:100%;background:var(--accent)}
.catrow .vl{font-family:'Bricolage Grotesque';font-weight:800;font-size:15px;width:34px;text-align:right;font-variant-numeric:tabular-nums}
.low .vl{color:var(--alert)}.low .tr span{background:var(--alert)}
.histcard{background:var(--slate);border:1px solid var(--line);border-radius:var(--r);padding:18px 16px;margin-bottom:14px}
.hrow{display:flex;align-items:center;gap:12px;padding:9px 0}
.hmon{font-size:12px;color:var(--muted);width:34px;flex:none}
.htr{flex:1;height:22px;background:var(--ink);border-radius:5px;overflow:hidden}
.htr span{display:block;height:100%;background:linear-gradient(90deg,#2C6FA6,var(--accent));border-radius:5px}
.hvl{font-family:'Bricolage Grotesque';font-weight:800;font-size:14px;width:32px;text-align:right;font-variant-numeric:tabular-nums}
.hnow .hmon,.hnow .hvl{color:var(--accent)}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mcard{background:var(--slate);border:1px solid var(--line);border-radius:12px;padding:12px 8px 8px;text-align:center}
.mcard.cur{border-color:rgba(76,155,224,.45)}
.mcard .mn{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.mcard .ms{font-family:'Bricolage Grotesque';font-weight:800;font-size:24px;line-height:1;margin-top:3px;font-variant-numeric:tabular-nums}
.mcard .mc{font-size:10.5px;color:var(--muted);margin-bottom:4px;font-variant-numeric:tabular-nums}
.selrow{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:10px;background:var(--ink)}
.selrow:hover{background:var(--slate)}
.selrow.dragging{opacity:.65;background:var(--raise);box-shadow:0 6px 18px rgba(0,0,0,.4)}
.grip{flex:none;width:20px;color:var(--line);font-size:14px;cursor:grab;touch-action:none;text-align:center;line-height:1}
.selrow.on .grip{color:var(--muted)}
.tog{width:36px;height:21px;border-radius:100px;background:var(--line);flex:none;position:relative;transition:.18s;cursor:pointer}
.tog::after{content:'';position:absolute;top:3px;left:3px;width:15px;height:15px;border-radius:50%;background:var(--muted);transition:.18s}
.selrow.on .tog{background:rgba(76,155,224,.3)}
.selrow.on .tog::after{transform:translateX(15px);background:var(--accent)}
.fsel{background:var(--ink);border:1px solid var(--line);border-radius:7px;color:var(--muted);font:inherit;font-size:10.5px;padding:4px 3px;flex:none;width:80px;cursor:pointer}
.selrow.on .fsel{color:var(--bone)}
.trkbtn{flex:none;width:28px;height:25px;border:1px solid var(--line);border-radius:7px;font-size:11px;color:var(--muted);display:grid;place-items:center}
.trkbtn.on{color:var(--track);border-color:rgba(63,168,143,.5);background:rgba(63,168,143,.12)}
.addwrap{display:flex;gap:7px;margin:10px 0 4px}
.addwrap input{flex:1;background:var(--ink);border:1px solid var(--line);border-radius:9px;padding:10px 11px;color:var(--bone);font:inherit;font-size:13.5px;min-width:0}
.addwrap select{flex:none;width:92px;background:var(--ink);border:1px solid var(--line);border-radius:9px;color:var(--bone);font:inherit;font-size:12.5px;padding:0 5px}
.addwrap button{background:var(--accent);color:var(--ink);font-weight:600;padding:0 14px;border-radius:9px;font-size:13.5px}
.custom-tag{font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);border:1px solid rgba(76,155,224,.35);padding:2px 5px;border-radius:4px;margin-left:6px}
.libcard{background:var(--slate);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px;width:100%;text-align:left}
.libcard.have{opacity:.5}
.libname{font-family:'Bricolage Grotesque';font-weight:600;font-size:17px;margin-bottom:5px}
.libdesc{font-size:13px;color:var(--muted);line-height:1.45}
.libmeta{font-size:11px;color:var(--muted);margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.note{background:rgba(76,155,224,.07);border:1px solid rgba(76,155,224,.22);border-radius:11px;padding:13px 15px;font-size:12.5px;color:var(--muted);line-height:1.5;margin-bottom:18px}
.note b{color:var(--accent);font-weight:600}
.back{font-size:13px;color:var(--muted);padding:14px 0 0;display:inline-block;cursor:pointer}
.back:hover{color:var(--bone)}
.empty{text-align:center;color:var(--muted);font-size:13.5px;padding:30px 20px;line-height:1.6}
.today-hd{display:flex;align-items:flex-end;gap:14px;background:var(--slate);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:16px}
.today-n{font-family:'Bricolage Grotesque';font-weight:800;font-size:40px;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.today-l{font-size:12.5px;color:var(--muted);padding-bottom:4px;line-height:1.4}
.trow{display:flex;align-items:center;gap:11px;padding:11px 12px;border-radius:10px;width:100%;text-align:left;transition:background .14s}
.trow:hover{background:var(--slate)}
.trow .meta{font-size:11px;color:var(--muted);margin-top:3px}
.trow.on .ilabel{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.mini{height:3px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:5px;max-width:150px}
.mini span{display:block;height:100%;background:var(--track)}
.mini span.short{background:var(--alert)}
.streak{font-size:11px;color:var(--gold);flex:none;font-weight:600}
.dots{display:flex;gap:3px;flex-wrap:wrap;margin-top:12px}
.dot{width:8px;height:8px;border-radius:2px;background:var(--line)}
.dot.hit{background:var(--track)}
.dot.today{outline:1.5px solid var(--accent);outline-offset:1px}
.seg{display:flex;gap:7px;margin-top:12px}
.seg button{flex:1;padding:11px 4px;border-radius:9px;font-size:13px;font-weight:500;color:var(--muted);
  background:#0A1119;border:1px solid var(--line);transition:.14s}
.seg button:hover{color:var(--bone);border-color:#3B5068}
.seg button.on{background:rgba(76,155,224,.16);border-color:var(--accent);color:var(--accent);font-weight:600}
.seglbl{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-top:22px}

.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.stat{background:var(--slate);border:1px solid var(--line);border-radius:12px;padding:13px 14px}
.stat .sl{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:6px}
.stat .sv{font-family:'Bricolage Grotesque';font-weight:800;font-size:24px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat .sm{display:block;font-family:'Instrument Sans';font-weight:400;font-size:11px;color:var(--muted);margin-top:3px}
.ctrend{background:var(--slate);border:1px solid var(--line);border-radius:12px;padding:14px 14px 11px;margin-bottom:10px}
.cth{display:flex;align-items:baseline;gap:10px;margin-bottom:2px}
.ctn{font-family:'Bricolage Grotesque';font-weight:600;font-size:15px;flex:1}
.ctd{font-size:11.5px;color:var(--muted)}
.ctv{font-family:'Bricolage Grotesque';font-weight:800;font-size:19px;font-variant-numeric:tabular-nums}
.ctc{margin:2px -4px 0}
.ctvals{display:flex;justify-content:space-between;gap:2px;margin-top:2px}
.ctvals span{flex:1;text-align:center;font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.ctvals span b{display:block;font-size:9px;letter-spacing:.08em;text-transform:uppercase;font-weight:600;opacity:.7;margin-bottom:1px}
.ctvals span.now{color:var(--bone)}
.pickrow{display:flex;gap:7px;margin:-2px 0 10px}
.pick{font-size:11.5px;color:var(--muted);border:1px solid var(--line);border-radius:7px;padding:5px 11px;background:#0A1119;transition:.14s}
.pick:hover:not(:disabled){color:var(--accent);border-color:var(--accent)}
.pick:disabled{opacity:.32;cursor:default}
.resetbtn{width:100%;margin-top:14px;padding:13px;border:1px solid var(--line);border-radius:11px;
  color:var(--muted);font-size:13px;background:#0A1119;transition:.14s}
.resetbtn:hover{color:var(--alert);border-color:var(--alert)}
.renameinp{flex:1;background:#0A1119;border:1px solid var(--accent);border-radius:8px;
  padding:8px 10px;color:var(--bone);font:inherit;font-size:14px;min-width:0}
.ctfoot{font-size:11px;color:var(--muted);margin-top:9px;padding-top:9px;border-top:1px solid var(--line)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

</div></div>

  const pts=series.map((v,i)=>v===null?null:[xs(i),ys(v)]).filter(Boolean);
  let g='';
  [0,.5,1].forEach(r=>{const y=ys(r);g+=`<line x1="${P}" y1="${y}" x2="${w-P}" y2="${y}" stroke="#293949" stroke-width="1" ${r===0?'':'stroke-dasharray="2 4"'}/>`});
  if(pts.length>1){
    const line=pts.map(p=>p.join(',')).join(' ');
    g+=`<polygon points="${xs(0)},${h-B} ${line} ${xs(n-1)},${h-B}" fill="${col}" opacity=".13"/>`;
    g+=`<polyline points="${line}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  }
  pts.forEach((p,i)=>{g+=`<circle cx="${p[0]}" cy="${p[1]}" r="${i===pts.length-1?3.4:2.2}" fill="${col}"/>`});
  if(showLbl){
    series.forEach((v,i)=>{ if(v===null)return;
      g+=`<text x="${xs(i)}" y="${ys(v)-7}" text-anchor="middle" fill="#E8EDF2" font-size="9.5" font-family="Bricolage Grotesque" font-weight="800">${(v*10).toFixed(1)}</text>`;
      g+=`<text x="${xs(i)}" y="${h-4}" text-anchor="middle" fill="#8494A3" font-size="9" font-family="Instrument Sans">${labels[i]}</text>`;});
  }
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" style="display:block">${g}</svg>`;
}

function history(t){
  const ms=[];for(let m=2;m<=NOW.m;m++)ms.push({m,s:score(t,NOW.y,m)});
  const labels=ms.map(x=>MON[x.m]);
  const vals=ms.map(x=>x.s.overall);
  const live=vals.filter(v=>v!==null);
  const avg=live.length?live.reduce((a,b)=>a+b,0)/live.length:null;
  const best=ms.slice().sort((a,b)=>(b.s.overall||0)-(a.s.overall||0))[0];
  const worst=ms.slice().sort((a,b)=>(a.s.overall||0)-(b.s.overall||0))[0];
  const pos=vals.filter(v=>v!==null&&v>=.7).length;

  let h=`<div class="histcard"><div class="eyebrow" style="margin-bottom:10px">${T[t].scoreName} trend</div>
    ${lineChart(vals,400,132,'#4C9BE0',true,labels)}</div>`;

  h+=`<div class="statgrid">
    <div class="stat"><div class="sl">Average</div><div class="sv">${ten(avg)}</div></div>
    <div class="stat"><div class="sl">Best month</div><div class="sv">${ten(best.s.overall)}<span class="sm">${MON[best.m]}</span></div></div>
    <div class="stat"><div class="sl">Lowest month</div><div class="sv" style="color:var(--alert)">${ten(worst.s.overall)}<span class="sm">${MON[worst.m]}</span></div></div>
    <div class="stat"><div class="sl">7.0 or better</div><div class="sv">${pos}<span class="sm">of ${vals.length} months</span></div></div>
  </div>`;

  // per-category series
  const rows=T[t].cats.map(c=>{
    const ser=ms.map(x=>{const cc=x.s.cats.find(y=>y.id===c.id);return cc?cc.pct:null});
    const cur=ser[ser.length-1], first=ser.find(v=>v!==null);
    return {c,ser,cur,delta:(cur!==null&&first!==undefined&&first!==null)?(cur-first)*10:null,
      last:ms[ms.length-1].s.cats.find(y=>y.id===c.id)};
  }).filter(r=>r.cur!==null);

  const moved=rows.filter(r=>r.delta!==null).sort((a,b)=>b.delta-a.delta);
  if(moved.length>1){
    const up=moved[0],dn=moved[moved.length-1];
    h+=`<div class="statgrid">
      <div class="stat"><div class="sl">Most improved</div><div class="sv" style="font-size:17px;color:var(--track)">${up.c.name.replace('Family: ','')}<span class="sm">${up.delta>=0?'+':''}${up.delta.toFixed(1)} since ${labels[0]}</span></div></div>
      <div class="stat"><div class="sl">Biggest slide</div><div class="sv" style="font-size:17px;color:${dn.delta<0?'var(--alert)':'var(--muted)'}">${dn.c.name.replace('Family: ','')}<span class="sm">${dn.delta>=0?'+':''}${dn.delta.toFixed(1)} since ${labels[0]}</span></div></div>
    </div>`;
  }

  h+=`<div class="eyebrow" style="margin:26px 0 12px">Every category, month by month</div>`;
  rows.slice().sort((a,b)=>a.cur-b.cur).forEach(r=>{
    const col=r.cur<.5?'#E0705F':r.cur>=.85?'#3FA88F':'#4C9BE0';
    h+=`<div class="ctrend">
      <div class="cth"><div class="ctn">${r.c.name}</div>
        <div class="ctd">${r.delta===null?'':(r.delta>0?`<span style="color:var(--track)">▲ ${r.delta.toFixed(1)}</span>`:r.delta<0?`<span style="color:var(--alert)">▼ ${Math.abs(r.delta).toFixed(1)}</span>`:'<span>no change</span>')}</div>
        <div class="ctv" style="color:${col}">${ten(r.cur)}</div></div>
      <div class="ctc">${lineChart(r.ser,300,58,col,false,labels)}</div>
      <div class="ctvals">${r.ser.map((v,i)=>`<span class="${i===r.ser.length-1?'now':''}"><b>${MON[ms[i].m]}</b>${ten(v)}</span>`).join('')}</div>
      <div class="ctfoot">${r.last.done} of ${r.last.due} due this month · ${r.last.sel} of ${r.last.total} selected</div>
    </div>`;
  });

  h+=`<div class="eyebrow" style="margin:26px 0 12px">Month by month</div><div class="mgrid">`;
  for(let i=ms.length-1;i>=0;i--){const x=ms[i];
    h+=`<div class="mcard ${x.m===NOW.m?'cur':''}"><div class="mn">${MON[x.m]}</div>
      <div class="ms">${ten(x.s.overall)}</div><div class="mc">${x.s.tDone} of ${x.s.tDue}</div>
      ${radar(x.s.cats,140,false)}</div>`}

  h+=`</div><div class="histcard" style="margin-top:16px"><div class="eyebrow" style="margin-bottom:12px">Category streaks</div>`;
  const st=[];T[t].cats.forEach(c=>{let run=0;
    for(let m=NOW.m-1;m>=2;m--){const cc=score(t,NOW.y,m).cats.find(x=>x.id===c.id);if(cc&&cc.pct===1)run++;else break}
    if(run)st.push({n:c.name,run})});
  if(!st.length)h+=`<div style="font-size:13px;color:var(--muted);line-height:1.5">No categories at 100% yet.</div>`;
  else st.sort((a,b)=>b.run-a.run).forEach(x=>{
    h+=`<div class="hrow"><div style="flex:1;font-size:14px">${x.n}</div><div style="font-size:12.5px;color:var(--gold)">${x.run} month${x.run>1?'s':''} at 100%</div></div>`;
    if(x.run>=3)h+=`<div style="font-size:12.5px;color:var(--muted);padding:0 0 10px;line-height:1.5">You've held ${x.n} for ${x.run} months. Want to add another item?</div>`});
  return h+`</div>`;
}

function items(t){
  const sel=S.sel[t];
  let h=`<div class="note">These are suggestions, not requirements. Keep what applies, rename anything with <b>\u270e</b>, change the frequency, add your own, and tap <b>\u26a1</b> on a daily item to track it day by day.</div>`;
  h+=`<div class="seglbl" style="margin-top:0">Sort within each category</div><div class="seg">`;
  [['freq','Frequency'],['az','A \u2013 Z'],['trk','\u26a1 First'],['manual','Custom']]
    .forEach(([k,l])=>h+=`<button class="${S.sortMode===k?'on':''}" onclick="setSort('${k}')">${l}</button>`);
  h+=`</div>`;
  if(S.sortMode==='manual')h+=`<div style="font-size:11.5px;color:var(--muted);margin:9px 0 0">Drag \u283f to arrange items exactly how you want them.</div>`;
  T[t].cats.forEach(c=>{const mine=catItems(t,c.id);
    const nOn=mine.filter(i=>sel.has(i.k)).length;
    h+=`<div class="catblock" style="margin-top:24px"><div class="cathead"><div class="catname">${c.name}</div>
      <div style="font-size:12px;color:var(--muted);font-weight:600">${nOn} of ${mine.length}</div></div>
      <div class="pickrow">
        <button class="pick" ${nOn===mine.length?'disabled':''} onclick="pickAll('${t}','${c.id}',true)">Select all</button>
        <button class="pick" ${nOn===0?'disabled':''} onclick="pickAll('${t}','${c.id}',false)">Clear all</button>
      </div>
      <div class="itemlist" data-t="${t}" data-cat="${c.id}" style="display:flex;flex-direction:column;gap:2px">`;
    mine.forEach(i=>{const on=sel.has(i.k);
      if(S.editing===i.k){
        h+=`<div class="selrow on" data-k="${i.k}"><input class="renameinp" id="rn" value="${i.label.replace(/"/g,'&quot;')}"
            onkeydown="if(event.key==='Enter')this.blur();if(event.key==='Escape'){S.editing=null;render()}"
            onblur="saveName('${t}','${i.k}',this.value)">
          <button class="trkbtn" onclick="saveName('${t}','${i.k}',document.getElementById('rn').value)">\u2713</button></div>`;
        return;}
      h+=`<div class="selrow ${on?'on':''}" data-k="${i.k}">
        ${S.sortMode==='manual'?'<span class="grip">\u283f</span>':''}
        <span class="tog" onclick="toggle('${t}','${i.k}')"></span>
        <span class="ilabel" onclick="toggle('${t}','${i.k}')">${i.label}${i.custom?'<span class="custom-tag">Yours</span>':i.renamed?'<span class="custom-tag">Edited</span>':''}</span>
        <button class="trkbtn" title="Rename" onclick="S.editing='${i.k}';render();document.getElementById('rn').focus()">\u270e</button>
        ${on&&i.freq==='d'?`<button class="trkbtn ${tracked(t,i.k)?'on':''}" title="Track daily" onclick="trackDaily('${t}','${i.k}')">\u26a1</button>`:''}
        <select class="fsel" onchange="setFreq('${t}','${i.k}',this.value)">
        ${Object.keys(FREQ).map(f=>`<option value="${f}" ${i.freq===f?'selected':''}>${FREQ[f]}</option>`).join('')}</select></div>`});
    h+=`</div><div class="addwrap"><input id="ci-${c.id}" placeholder="Add your own\u2026" onkeydown="if(event.key==='Enter')addItem('${t}','${c.id}')">
      <select id="cf-${c.id}">${Object.keys(FREQ).map(f=>`<option value="${f}">${FREQ[f]}</option>`).join('')}</select>
      <button onclick="addItem('${t}','${c.id}')">Add</button></div></div>`});
  h+=`<button class="resetbtn" onclick="resetCard('${t}')">Reset this scorecard to the template</button>`;
  return h;
}
function pickAll(t,cid,on){
  catItems(t,cid).forEach(i=>on?S.sel[t].add(i.k):S.sel[t].delete(i.k));
  if(!on&&S.daily[t])catItems(t,cid).forEach(i=>S.daily[t].delete(i.k));
  render();
}
function resetCard(t){
  if(!confirm('Clear every selection, rename, custom item and frequency change on this scorecard? Your check-in history stays.'))return;
  S.sel[t]=new Set();S.rename[t]={};S.freq[t]={};S.custom[t]=[];S.daily[t]=new Set();S.order[t]={};
  S.sortMode='freq';render();
}
function setSort(m){
  if(m==='manual'){ // freeze the current visible order so nothing jumps
    const t=S.active;S.order[t]=S.order[t]||{};
    T[t].cats.forEach(c=>{if(!S.order[t][c.id])S.order[t][c.id]=catItems(t,c.id).map(i=>i.k)});
  }
  S.sortMode=m;S.editing=null;render();
}
function saveName(t,k,v){
  S.rename[t]=S.rename[t]||{};
  const val=(v||'').trim();
  if(!val)delete S.rename[t][k]; else S.rename[t][k]=val;
  S.editing=null;render();
}
/* drag to reorder — works with mouse and touch */
function initDrag(){
  document.querySelectorAll('.itemlist .grip').forEach(g=>{
    g.onpointerdown=e=>{
      e.preventDefault();
      const row=g.closest('.selrow'),list=row.parentElement;
      row.classList.add('dragging');g.setPointerCapture(e.pointerId);
      const move=ev=>{
        const others=[...list.querySelectorAll('.selrow:not(.dragging)')];
        const after=others.find(r=>{const b=r.getBoundingClientRect();return ev.clientY<b.top+b.height/2});
        after?list.insertBefore(row,after):list.appendChild(row);
      };
      const up=()=>{
        row.classList.remove('dragging');
        g.removeEventListener('pointermove',move);g.removeEventListener('pointerup',up);
        const t=list.dataset.t,cid=list.dataset.cat;
        S.order[t]=S.order[t]||{};
        S.order[t][cid]=[...list.querySelectorAll('.selrow')].map(r=>r.dataset.k);
        S.sortMode='manual';render();
      };
      g.addEventListener('pointermove',move);g.addEventListener('pointerup',up);
    };
  });
}
function tick(t,k){const p=pkey(NOW.y,NOW.m);S.entries[t][p]=S.entries[t][p]||new Set();
  S.entries[t][p].has(k)?S.entries[t][p].delete(k):S.entries[t][p].add(k);render()}
function logDay(t,k){const d=dkey(NOW.y,NOW.m,NOW.d);S.dlog[t][d]=S.dlog[t][d]||new Set();
  S.dlog[t][d].has(k)?S.dlog[t][d].delete(k):S.dlog[t][d].add(k);render()}
function toggle(t,k){S.sel[t].has(k)?S.sel[t].delete(k):S.sel[t].add(k);render()}
function setFreq(t,k,f){S.freq[t]=S.freq[t]||{};S.freq[t][k]=f;if(f!=='d'&&S.daily[t])S.daily[t].delete(k);render()}
function trackDaily(t,k){S.daily[t]=S.daily[t]||new Set();S.daily[t].has(k)?S.daily[t].delete(k):S.daily[t].add(k);render()}
function addItem(t,cid){const inp=document.getElementById('ci-'+cid),f=document.getElementById('cf-'+cid);
  const v=inp.value.trim();if(!v)return;const k='custom:'+cid+':'+Date.now();
  S.custom[t].push({key:k,cat:cid,label:v,freq:f.value});S.sel[t].add(k);render()}
function go(t){S.active=t;S.tab=(S.daily[t]||new Set()).size?'today':'checkin';S.view='card';render()}
function adopt(t){if(!S.adopted.includes(t)){S.adopted.push(t);
  const p=new Set();T[t].cats.forEach(c=>c.items.forEach((it,i)=>{if(i<3)p.add(key(c.id,i))}));
  S.sel[t]=p;S.custom[t]=[];S.entries[t]={};S.freq[t]={};S.daily[t]=new Set();S.dlog[t]={};S.order[t]={}}
  S.active=t;S.tab='items';S.view='card';render()}
document.getElementById('toolchest').onclick=()=>alert('Tool chest\n\n• Scorecards (you are here)\n• Daily Time Tracker\n\nIn the real build this switches between Chasing Excellence tools using the same login.');
seed();render();
</script>
</body>
</html>
